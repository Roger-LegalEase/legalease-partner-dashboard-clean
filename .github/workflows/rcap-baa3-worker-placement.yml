name: Verify the applied BAA3 worker without redeployment

on:
  workflow_call:
    secrets:
      FLY_API_TOKEN:
        required: true
      SUPABASE_ACCESS_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-rcap-render-worker-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      W: baa3c993136ebb11f40ad565a01a9f28983d3b6a
      D: sha256:dfe65f3cb99335888fb14306a1f0b68d2fa2bcf4e2c335a6cb43ef110ef4f0e2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require the reviewed execution context and unchanged reused guards
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = Roger-LegalEase/legalease-partner-dashboard-clean ]
          [ "$GITHUB_REF" = refs/heads/captain-release ]
          [ "$GITHUB_RUN_ATTEMPT" = 1 ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ -z "$(git status --porcelain)" ]
          printf '%s  %s\n' bb3b85b405fa1a0c571f0b3c5b6bb7537d6634b4cde066cd176f387f98fad483 scripts/qualified-worker-readonly-capture.mjs | sha256sum -c -
      - name: Check native event parsing and the read-only continuation
        run: node --test scripts/acceptance/place-baa3-worker.test.mjs scripts/acceptance/registry-image.test.mjs scripts/acceptance/fly-handoff-events.test.mjs scripts/acceptance/reconcile-baa3-worker.test.mjs
      - name: Check current worker against its accepted transition with zero deployment attempts
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/acceptance/reconcile-baa3-worker.mjs
      - name: Keep current worker and native event evidence even if verification fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baa3-worker-reconciliation-${{ github.run_id }}
          path: worker-identity-evidence/
          if-no-files-found: error
