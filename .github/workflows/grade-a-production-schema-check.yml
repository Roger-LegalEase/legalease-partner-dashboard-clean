name: Grade A production schema compatibility
on:
  push:
    branches: [release/grade-a-production-20260916]
    paths: [.github/workflows/grade-a-production-schema-check.yml]
permissions:
  contents: read
jobs:
  production-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read required production table and function metadata only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const project = 'wwtwtsmywnckfkdaqqeg';
          const tables = ['consumer_briefcase_items','rcap_document_packets','rcap_document_packet_inputs','packet_render_jobs'];
          const functions = ['enqueue_verified_consumer_packet_render','persist_consumer_packet_verification','get_consumer_packet_verification_authority','get_consumer_packet_artifact_authority','attach_consumer_packet_artifact_if_verified'];
          const sqlList = values => values.map(x => "'" + x + "'").join(',');
          const query = `select 'table' as kind, c.relname as name, c.relrowsecurity::text as detail from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname in (${sqlList(tables)}) union all select 'function' as kind, p.proname as name, pg_get_function_identity_arguments(p.oid) as detail from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in (${sqlList(functions)})`;
          let report;
          try {
            if (!process.env.SUPABASE_ACCESS_TOKEN) throw new Error('credential_missing');
            const r = await fetch(`https://api.supabase.com/v1/projects/${project}/database/query`, { method:'POST', redirect:'error', headers:{ Authorization:`Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, 'Content-Type':'application/json' }, body:JSON.stringify({ query, read_only:true }), signal:AbortSignal.timeout(20000) });
            const data = await r.json().catch(() => null);
            const rows = r.ok && Array.isArray(data) ? data : [];
            const missingTables = tables.filter(name => !rows.some(x => x.kind==='table' && x.name===name));
            const missingFunctions = functions.filter(name => !rows.some(x => x.kind==='function' && x.name===name));
            report = { projectRef:project, method:'SELECT catalog metadata only; no migration, customer rows, or writes', httpStatus:r.status, readable:r.ok, rows, missingTables:r.ok?missingTables:null, missingFunctions:r.ok?missingFunctions:null, compatible:r.ok && missingTables.length===0 && missingFunctions.length===0 };
          } catch (e) { report = { projectRef:project, readable:false, errorType:e.name, compatible:false }; }
          writeFileSync('production-schema-compatibility.json', JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if (!report.compatible) process.exitCode=1;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grade-a-production-schema-${{ github.run_id }}
          path: production-schema-compatibility.json
          if-no-files-found: error
          retention-days: 7
