name: Publish RCAP render worker

# Captain-owned, manual only. This workflow PUBLISHES AN IMAGE AND NOTHING ELSE.
# It does not deploy the worker, does not start claiming, and touches neither
# staging nor production.
#
# The tag is the full commit SHA, and only that. There is deliberately no
# mutable `latest`: the staging action requires an immutable registry digest,
# and a moving tag would let the thing that was verified stop being the thing
# that runs.

on:
  workflow_dispatch:
    inputs:
      integration_sha:
        description: "The exact 40-character SHA to build. Leaving it EMPTY builds the tip of resolve_from_ref, which defaults to the RELEASE integration branch (claude/legalease-sprint-captain-utucnw) — the branch that is fast-forwarded to a release candidate. Supplying the full SHA is stronger and is what a release publication should do: it resolves and checks out that exact commit, so the image cannot follow a branch that moved. An abbreviated or reconstructed value is refused."
        required: false
        type: string
        default: ""
      resolve_from_ref:
        description: "Branch whose tip to build when integration_sha is empty. Defaults to the RELEASE integration branch, which is where release candidates live. Pass 'main' explicitly to build the canonical branch instead."
        required: false
        type: string
        default: ""
      tag_replacement_authorization:
        description: "Leave empty. Only set to replace-<integration_sha> when deliberately replacing an existing full-SHA tag."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  # One publication at a time for a given source SHA. Two runs starting together
  # would race on the same SOURCE-SHA TAG, and a preflight lookup cannot see a
  # push that has not happened yet. cancel-in-progress stays false so a second
  # request queues behind the first rather than killing a publication midway.
  #
  # Note the wording: the source-SHA tag is an ALIAS, not an immutable object.
  # Calling it immutable is what let two publications of 664b8ddd move it. Only
  # the sha256: digest is immutable.
  group: publish-rcap-render-worker-${{ inputs.integration_sha || github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/roger-legalease/rcap-render-worker
  DOCKERFILE_PATH: deploy/rcap-render-worker/Dockerfile
  CANONICAL_INTEGRATION_BRANCH: main
  # The live release-integration branch, pinned by exact name.
  #
  # The gate below exists to stop an image being built from outside the
  # canonical integration history — from a stale feature branch, or from a SHA
  # nobody integrated. It does NOT exist to force publication to follow the
  # merge, and forcing that makes the release impossible: the required PR check
  # runs `npm test`, which includes the staging-action gate, which refuses to
  # pass until a worker has been published for the current image inputs. Requiring
  # the merge first and the publication first at the same time is a deadlock, and
  # the only ways out of it were an override or a merge over a red required
  # check, both of which are worse than publishing from the head that is about to
  # merge.
  #
  # So a SHA is accepted when it is contained in main OR in this exact branch.
  # One literal name, no wildcard, no pattern, no run-time input: a SHA on any
  # other branch is still refused, and which branch contained it is recorded in
  # the publication evidence.
  RELEASE_INTEGRATION_BRANCH: claude/legalease-sprint-captain-utucnw

jobs:
  publish:
    name: Publish rcap-render-worker by immutable digest
    runs-on: ubuntu-latest
    steps:
      # A publication is only meaningful if the bytes are the bytes someone
      # accepted, so the SHA is validated before anything is fetched or built.
      - name: Reject an abbreviated SHA before anything is fetched
        run: |
          set -euo pipefail
          SHA="${{ inputs.integration_sha }}"
          # Empty is the safe path: Git resolves the tip below, and nobody has
          # the chance to reconstruct a SHA from an abbreviation.
          if [ -n "$SHA" ] && ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::integration_sha must be a full 40-character lowercase hex commit SHA, or empty to build the branch tip. Got: '$SHA'"
            exit 1
          fi

      - name: Check out the repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the commit to build from Git, never from a typed abbreviation
        id: resolve
        run: |
          set -euo pipefail
          REF="${{ inputs.resolve_from_ref }}"
          # Defaults to the RELEASE integration branch, not the canonical one.
          #
          # This defaulted to $CANONICAL_INTEGRATION_BRANCH, which is `main`, and
          # on 2026-09-20 that published an image of main -- 5,929 commits behind
          # the approved release candidate -- from a dispatch whose whole purpose
          # was to build that candidate. Every gate passed and every gate was
          # right to: a commit on main is contained in main, so the containment
          # check had nothing to object to. No verification downstream can catch
          # a resolve step that pointed at the wrong branch.
          #
          # The release branch is the correct default because it is where release
          # candidates live: the comment on RELEASE_INTEGRATION_BRANCH above
          # explains why publication deliberately runs from the head that is
          # about to merge rather than after the merge. `main` is still
          # buildable, by naming it in resolve_from_ref.
          REF="${REF:-$RELEASE_INTEGRATION_BRANCH}"
          SUPPLIED="${{ inputs.integration_sha }}"
          if [ -z "$SUPPLIED" ]; then
            git fetch --no-tags origin "$REF"
            SHA="$(git rev-parse "origin/${REF}^{commit}")"
            echo "Resolved origin/${REF} to ${SHA}."
          else
            # A supplied value is accepted only if it names a real commit. A
            # forty-character string that looks like a SHA but resolves to
            # nothing is exactly the mistake this refuses.
            SHA="$(git rev-parse --verify --quiet "${SUPPLIED}^{commit}" || true)"
            if [ -z "$SHA" ]; then
              echo "::error::${SUPPLIED} is not a commit in this repository. Leave integration_sha empty to build the tip of ${REF}."
              exit 1
            fi
            if [ "$SHA" != "$SUPPLIED" ]; then
              echo "::error::${SUPPLIED} is not the full object name of that commit (${SHA}). Supply the full SHA or leave it empty."
              exit 1
            fi
          fi
          printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::resolved SHA is malformed"; exit 1; }
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "WORKER_BUILD_SHA=${SHA}" >> "$GITHUB_ENV"

      - name: Verify the SHA resolves and belongs to the canonical integration history
        id: containment
        run: |
          set -euo pipefail
          SHA="$WORKER_BUILD_SHA"
          if ! git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
            echo "::error::${SHA} does not resolve to a commit in this repository."
            exit 1
          fi
          git fetch --no-tags origin "${CANONICAL_INTEGRATION_BRANCH}"
          if git merge-base --is-ancestor "$SHA" "origin/${CANONICAL_INTEGRATION_BRANCH}"; then
            echo "Verified ${SHA} is contained in origin/${CANONICAL_INTEGRATION_BRANCH}."
            echo "contained_in=${CANONICAL_INTEGRATION_BRANCH}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "${RELEASE_INTEGRATION_BRANCH}"
          if git merge-base --is-ancestor "$SHA" "origin/${RELEASE_INTEGRATION_BRANCH}"; then
            echo "Verified ${SHA} is contained in origin/${RELEASE_INTEGRATION_BRANCH}, the live release-integration branch."
            echo "This is a CANDIDATE publication from the head that is about to merge. It publishes an image and nothing else."
            echo "contained_in=${RELEASE_INTEGRATION_BRANCH}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::${SHA} is contained in neither origin/${CANONICAL_INTEGRATION_BRANCH} nor origin/${RELEASE_INTEGRATION_BRANCH}. Refusing to publish an image from outside the canonical integration history."
          exit 1

      # Build from the exact accepted commit, not from the branch tip, which may
      # have moved since the SHA was cleared.
      - name: Check out the exact supplied SHA
        run: git checkout --detach "$WORKER_BUILD_SHA"

      - name: Record the build inputs
        id: inputs
        run: |
          set -euo pipefail
          DOCKERFILE_SHA256="$(sha256sum "${DOCKERFILE_PATH}" | cut -d' ' -f1)"
          LOCKFILE_SHA256="$(sha256sum package-lock.json | cut -d' ' -f1)"
          {
            echo "dockerfile_sha256=${DOCKERFILE_SHA256}"
            echo "lockfile_sha256=${LOCKFILE_SHA256}"
            echo "image_reference=${IMAGE_REPOSITORY}:${{ steps.resolve.outputs.sha }}"
          } >> "$GITHUB_OUTPUT"

      # A full-SHA tag is a POINTER, not an immutable object. Two successful
      # publications of source 664b8ddd already moved this one, leaving two
      # records each naming the same tag and a different digest. Refuse to do
      # it a third time by accident: the tag must be free, or the replacement
      # must be named explicitly.
      - name: Set up Node for the tag guard
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refuse to overwrite an existing source-SHA tag
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RCAP_WORKER_TAG: ${{ steps.resolve.outputs.sha }}
          RCAP_WORKER_TAG_REPLACEMENT_AUTHORIZATION: ${{ inputs.tag_replacement_authorization }}
        run: node scripts/verify-rcap-worker-tag-integrity.mjs --guard

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Checked AGAIN here, immediately before the push. The first check runs
      # before the build so a doomed publication fails in seconds rather than
      # minutes, but a build can take long enough for another run to publish in
      # the meantime. This is the last point at which refusing still costs
      # nothing.
      - name: Re-check the source-SHA tag at the last point before pushing
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RCAP_WORKER_TAG: ${{ steps.resolve.outputs.sha }}
          RCAP_WORKER_TAG_REPLACEMENT_AUTHORIZATION: ${{ inputs.tag_replacement_authorization }}
        run: node scripts/verify-rcap-worker-tag-integrity.mjs --guard

      - name: Build and push by source-SHA tag only
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          # Exactly one tag. No `latest`, no branch tag, no second alias.
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ steps.resolve.outputs.sha }}
          # The image must be able to say which source it was built from, so
          # that the binding between a digest and its commit does not rest
          # solely on a file this repository wrote about itself. Images
          # published before this was added carry no revision and require an
          # exact-digest compensating control; see
          # data/rcap-render/worker-source-binding-exception.json.
          labels: |
            org.opencontainers.image.revision=${{ steps.resolve.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.resolve.outputs.sha }}
          provenance: false
          sbom: false

      - name: Emit the machine-readable publication artifact
        run: |
          set -euo pipefail
          mkdir -p publication
          cat > publication/rcap-render-worker-publication.json <<JSON
          {
            "schemaVersion": "rcap-worker-publication/v1",
            "sourceSha": "${{ steps.resolve.outputs.sha }}",
            "canonicalIntegrationBranch": "${CANONICAL_INTEGRATION_BRANCH}",
            "releaseIntegrationBranch": "${RELEASE_INTEGRATION_BRANCH}",
            "containedIn": "${{ steps.containment.outputs.contained_in }}",
            "dockerfilePath": "${DOCKERFILE_PATH}",
            "dockerfileSha256": "${{ steps.inputs.outputs.dockerfile_sha256 }}",
            "lockfileSha256": "${{ steps.inputs.outputs.lockfile_sha256 }}",
            "imageRepository": "${IMAGE_REPOSITORY}",
            "imageTag": "${{ steps.resolve.outputs.sha }}",
            "imageReference": "${{ steps.inputs.outputs.image_reference }}",
            "immutableRegistryDigest": "${{ steps.build.outputs.digest }}",
            "digestPinnedReference": "${IMAGE_REPOSITORY}@${{ steps.build.outputs.digest }}",
            "workflowRunId": "${{ github.run_id }}",
            "workflowRunUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "mutableLatestTagCreated": false,
            "publishOnlyNoDeploy": true,
            "workerClaimingStarted": false,
            "stagingAndProductionUnchanged": true
          }
          JSON
          cat publication/rcap-render-worker-publication.json

      - name: Fail if the registry returned no digest
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build.outputs.digest }}"
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::No immutable registry digest was returned. A local image ID is not acceptable evidence."
            exit 1
          fi
          echo "Published ${IMAGE_REPOSITORY}@${DIGEST}"

      - name: Upload the publication artifact
        uses: actions/upload-artifact@v4
        with:
          name: rcap-render-worker-publication-${{ steps.resolve.outputs.sha }}
          path: publication/rcap-render-worker-publication.json
          if-no-files-found: error
