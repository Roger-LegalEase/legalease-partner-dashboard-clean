name: Nevada special-route validation
on:
  push:
    branches: [chatgpt/independent-nv-20260907]
    paths:
      - .github/workflows/rcap-nv-special-completion.yml
      - scripts/build-census-v1-rcap-nv-custom-pleading.mjs
      - scripts/rcap-packet-recovery/nv-special-routes.mjs
      - scripts/rcap-packet-recovery/test-nv-special-routes.mjs
      - scripts/rcap-packet-recovery/verify-nv-unchanged-pages.py
      - scripts/rcap-packet-recovery/verify-nv-footer-rerender.py
      - data/rcap-grade-a/nv-route-footer-rerender-2026-10-20/**
      - data/record-clearing/legal-decisions/2026-09-07-nv-special-route-procedure.json
      - data/rcap-all50/overlays/census-v1/nv/rcap-nv-custom-pleading--custom-pleading/**
  pull_request:
    paths:
      - .github/workflows/rcap-nv-special-completion.yml
      - scripts/build-census-v1-rcap-nv-custom-pleading.mjs
      - scripts/rcap-packet-recovery/nv-special-routes.mjs
      - scripts/rcap-packet-recovery/test-nv-special-routes.mjs
      - scripts/rcap-packet-recovery/verify-nv-unchanged-pages.py
      - scripts/rcap-packet-recovery/verify-nv-footer-rerender.py
      - data/rcap-grade-a/nv-route-footer-rerender-2026-10-20/**
      - data/record-clearing/legal-decisions/2026-09-07-nv-special-route-procedure.json
      - data/rcap-all50/overlays/census-v1/nv/rcap-nv-custom-pleading--custom-pleading/**
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FAMILY_DIR: data/rcap-all50/overlays/census-v1/nv/rcap-nv-custom-pleading--custom-pleading
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # verify-packet-completeness.mjs has required the corpus environment since 04e0a6ca5
      # (2026-09-12); this step is the factory workflow's, verbatim. Last green run before it: 2026-09-08.
      - name: Establish verified corpus environment
        id: corpus_environment
        env:
          GH_TOKEN: ${{ secrets.SOURCE_CORPUS_READ_TOKEN }}
        run: |
          set -euo pipefail
          corpus="$GITHUB_WORKSPACE/private/source-imports/Expungement_AI_RCAP_Master_Library_Edition_1"
          if [ ! -d "$corpus" ]; then
            test -n "$GH_TOKEN" || { echo "CORPUS_ENVIRONMENT_REFUSED: SOURCE_CORPUS_READ_TOKEN must read the pinned private source-artifacts release"; exit 1; }
            bash scripts/rcap-corpus/bootstrap-private-corpus.sh
          fi
          export MASTER_LIBRARY_SOURCE_DIR="$corpus"
          export RCAP_BUNDLE_EXTRACT="$corpus"
          node --input-type=module -e 'import { requireMasterLibraryEnvironment } from "./scripts/lib/corpus-index-paths.mjs"; requireMasterLibraryEnvironment({repoRoot:process.cwd()});'
          printf 'MASTER_LIBRARY_SOURCE_DIR=%s\nRCAP_BUNDLE_EXTRACT=%s\n' "$corpus" "$corpus" >> "$GITHUB_ENV"
      - name: Install locked dependencies and isolated PDF review tools
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python3 -m venv "$RUNNER_TEMP/nv-pdf-review"
          "$RUNNER_TEMP/nv-pdf-review/bin/pip" install --disable-pip-version-check PyMuPDF==1.26.7
      - name: Rebuild twice and compare every tracked family byte
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          out="$RUNNER_TEMP/nv-validation"
          mkdir -p "$out"
          # --check is an authority/map preflight, not a PDF regeneration.
          # Exercise the real renderer twice, then compare against the committed
          # outputs after EACH run. No receipt, approval, or queue is rewritten.
          for pass in 1 2; do
            node scripts/build-census-v1-rcap-nv-custom-pleading.mjs --no-raster > "$out/rebuild-$pass.json" 2> "$out/rebuild-$pass.stderr"
            python3 - "$out/rebuild-$pass.json" <<'PY'
          import json,sys
          result=json.load(open(sys.argv[1]))
          assert result['familyId']=='rcap-nv-custom-pleading'
          assert result['status']=='COMPLETED',result
          assert result['nineCountersZero'] is True
          assert result['packetsSelfVerified']==0
          assert result['productionTouched'] is False
          assert result['commercialRoutesOpened']==0
          assert {x['fixture']:x['pages'] for x in result['artifactHashes']}=={'canonical':44,'boundary':44}
          PY
            git diff --exit-code -- "$FAMILY_DIR"
            test -z "$(git ls-files --others --exclude-standard -- "$FAMILY_DIR")"
          done
          node scripts/rcap-packet-recovery/test-nv-special-routes.mjs | tee "$out/regressions.log"
          node scripts/rcap-packet-completeness/verify-packet-completeness.mjs --family rcap-nv-custom-pleading | tee "$out/machine-completeness.log"
          # The 2026-09-07 review examined one exact pair of PDFs (verify-nv-unchanged-pages.py proved
          # its 68 untouched pages against the pre-repair packet). task53 then removed the route footers,
          # so the current pair is chained to that reviewed pair instead: identical apart from footer ink.
          "$RUNNER_TEMP/nv-pdf-review/bin/python" scripts/rcap-packet-recovery/verify-nv-footer-rerender.py --record data/rcap-grade-a/nv-route-footer-rerender-2026-10-20/review.json --output "$out/footer-rerender-comparison.json" --self-test | tee "$out/footer-rerender-comparison.log"
          python3 - <<'PY'
          import pathlib,json,hashlib,os
          folder=pathlib.Path(os.environ['FAMILY_DIR'])
          evidence=pathlib.Path('data/rcap-grade-a/nv-route-footer-rerender-2026-10-20/review.json')
          reviewed=json.loads(evidence.read_text())['successor']
          hashes={}
          for fixture in ['canonical','boundary']:
            actual=hashlib.sha256((folder/'fixtures'/f'{fixture}.pdf').read_bytes()).hexdigest()
            assert actual==reviewed[fixture+'Sha256'],fixture+' differs from the bytes the successor review record chains to the visually reviewed pair'
            hashes[fixture]=actual
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'nv-validation'
          comparison=json.loads((out/'footer-rerender-comparison.json').read_text())
          assert comparison['result']=='PASS'
          assert {f:(x['pagesIdentical'],len(x['changedPages']),x['inkAddedPixels'],x['textIdenticalApartFromFooters']) for f,x in comparison['fixtures'].items()}=={'canonical':(16,28,0,True),'boundary':(16,28,0,True)}
          result={'schemaVersion':'rcap-nv-read-only-validation/v2','checkedCommit':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'event':os.environ['GITHUB_EVENT_NAME'],'fullRendererPasses':2,'eachRebuildMatchesCommittedFamilyBytes':True,'regressionChecks':30,'includedInMemoryNegativeControls':10,'reviewedPairChainedTo':'data/rcap-grade-a/nv-completion-2026-09-07/targeted-review.json','pagesIdenticalToReviewedPair':16,'pagesWithFooterInkRemovedOnly':28,'pixelsOfInkAdded':0,'footerRerenderComparisonSha256':hashlib.sha256((out/'footer-rerender-comparison.json').read_bytes()).hexdigest(),'pdfSha256':hashes,'independentApprovalGranted':False,'newTerminalPromotions':0,'productionTouched':False,'commercialRoutesOpened':0}
          (out/'validation.json').write_text(json.dumps(result,indent=2)+'\n')
          print('Two complete rebuilds match all committed family bytes; every page is the 2026-09-07 reviewed page minus its route footer (16 identical, 28 lose footer ink only, no ink added); both successor PDF hashes confirmed.')
          PY
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nv-read-only-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/nv-validation/
          retention-days: 14
          if-no-files-found: error
