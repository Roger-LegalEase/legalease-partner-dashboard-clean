name: Consumer launch rails DB acceptance

# Manual only. Boots a DISPOSABLE runner-local Supabase stack, applies the
# repository's supabase/migrations sequence to it, and runs the consumer
# launch-rail database acceptance script end to end
# (scripts/verify-consumer-launch-rails-db.mjs). The script itself refuses
# any non-loopback database, and everything here lives and dies inside the
# runner: no hosted project, no persistent environment, no production
# surface is touched, and nothing outlives the run. This is acceptance
# evidence only — it authorizes no route promotion and applies no live
# migration.

on:
  workflow_dispatch:
    inputs:
      run_sandbox:
        description: Run the isolated Stripe sandbox and current application payment HTTP regression
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: consumer-launch-rails-acceptance
  cancel-in-progress: false

jobs:
  db-acceptance:
    if: ${{ !inputs.run_sandbox }}
    name: Runner-local Supabase DB acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start the disposable Supabase stack (runner-local only)
        run: |
          set -euo pipefail
          npm install -g supabase@2
          # The repo tracks supabase/migrations but no config.toml; init
          # creates one so the CLI can run, and leaves the migrations
          # directory untouched (same pattern as rcap-f1-ephemeral-staging).
          supabase init --force >/dev/null
          # Only the services the DB script needs: Postgres (plus the core
          # stack the CLI always brings). Everything binds to the runner's
          # loopback; no port is exposed beyond this machine.
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta
          supabase status -o env > /tmp/supabase.env
          sed 's/KEY=.*/KEY=***REDACTED***/' /tmp/supabase.env || true

      - name: Apply the full migration sequence to the local database
        run: |
          set -euo pipefail
          # supabase start applies pending migrations on a fresh database;
          # migration up makes that explicit and is a no-op when already applied.
          supabase migration up
          supabase migration list --local

      - name: Run the consumer launch-rail database acceptance end to end
        run: |
          set -euo pipefail
          set -a; source /tmp/supabase.env; set +a
          export CONSUMER_ACCEPTANCE_DATABASE_URL="${DB_URL:-postgresql://postgres:postgres@127.0.0.1:54322/postgres}"
          node scripts/verify-consumer-launch-rails-db.mjs

      - name: Stop the disposable stack
        if: always()
        run: supabase stop --no-backup || true

  stripe-sandbox-regression:
    if: ${{ inputs.run_sandbox }}
    name: Isolated Stripe sandbox through application webhook and local PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify unchanged approved application source
        run: |
          git fetch --depth=1 origin 4c189b682d0a9225a21b9fdf8a2ebc50500029d6
          git diff --exit-code 4c189b682d0a9225a21b9fdf8a2ebc50500029d6 -- src supabase data package.json package-lock.json next.config.*
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Run real sandbox Checkout and signed webhook against disposable PostgreSQL
        env:
          HOSTED_STRIPE_TEST_SECRET: ${{ secrets.HOSTED_STRIPE_TEST_SECRET }}
          HOSTED_STRIPE_TEST_WEBHOOK_SECRET: ${{ secrets.HOSTED_STRIPE_TEST_WEBHOOK_SECRET }}
          QA_APPLICATION_SHA: 4c189b682d0a9225a21b9fdf8a2ebc50500029d6
        run: node scripts/verify-expungement-consumer-payment-http.mjs --stripe-sandbox --write
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-stripe-sandbox-regression
          path: |
            data/rcap-render/consumer-payment-http.json
            data/rcap-render/stripe-sandbox-regression.json
          if-no-files-found: warn
