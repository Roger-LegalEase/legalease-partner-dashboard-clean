name: Deploy RCAP render worker to production

# Release-captain-only control. Places the exact accepted worker image on the
# production execution target (one always-on Fly.io Machine, see
# deploy/rcap-render-worker/fly.toml) and proves it is running.
#
# Refuses unless the requested tuple is the one the committed publication
# evidence and the frozen release candidate bind. Never builds an image: it
# pulls the immutable digest from ghcr.io, re-tags it into the app's own Fly
# registry (Fly cannot pull a private ghcr.io image directly) and deploys that
# by digest. Production secrets are read from the Fly secret store by name
# only; this workflow never sees or prints their values.
#
# Required repository secrets:
#   FLY_API_TOKEN          — a Fly deploy token scoped to the app
#   SUPABASE_ACCESS_TOKEN  — existing; read-only queue-age verification
# Required Fly app secrets (set once by the owner, names only checked here):
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY

on:
  workflow_dispatch:
    inputs:
      worker_source_sha:
        description: "Exact 40-character worker source SHA (must equal the frozen candidate)"
        required: true
        type: string
      worker_digest:
        description: "Exact immutable image digest sha256:… (must equal the frozen candidate)"
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-rcap-render-worker-production
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/roger-legalease/rcap-render-worker
  FLY_APP_NAME: legalease-rcap-render-worker
  FLY_CONFIG: deploy/rcap-render-worker/fly.toml
  PRODUCTION_PROJECT_REF: wwtwtsmywnckfkdaqqeg

jobs:
  deploy:
    name: Exact worker onto the production execution target
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Refuse any worker identity outside the frozen candidate
        env:
          INPUT_WORKER_SOURCE_SHA: ${{ inputs.worker_source_sha }}
          INPUT_WORKER_DIGEST: ${{ inputs.worker_digest }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from "node:fs";
          const sha = process.env.INPUT_WORKER_SOURCE_SHA ?? "";
          const digest = process.env.INPUT_WORKER_DIGEST ?? "";
          if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error("worker_source_sha must be an exact 40-character SHA");
          if (!/^sha256:[a-f0-9]{64}$/.test(digest)) throw new Error("worker_digest must be an exact sha256 digest");
          const candidate = JSON.parse(fs.readFileSync("data/rcap-grade-a/launch-control/RELEASE_CANDIDATE_BINDING.json", "utf8"));
          const publication = JSON.parse(fs.readFileSync("data/rcap-render/worker-publication-evidence.json", "utf8"));
          const mismatches = [];
          if (candidate.workerSourceSha !== sha) mismatches.push("candidate workerSourceSha");
          if (candidate.workerDigest !== digest) mismatches.push("candidate workerDigest");
          if (candidate.productionAuthorized !== true) mismatches.push("candidate productionAuthorized");
          if (publication.sourceSha !== sha) mismatches.push("publication sourceSha");
          if (publication.immutableRegistryDigest !== digest) mismatches.push("publication immutableRegistryDigest");
          if (publication.workflowConclusion !== "success") mismatches.push("publication workflowConclusion");
          if (publication.imageAcceptance?.conclusion !== "success") mismatches.push("image acceptance conclusion");
          if (mismatches.length) throw new Error("refused: " + mismatches.join(", "));
          console.log("worker tuple is the frozen, published, accepted candidate");
          JS

      - name: Pull the accepted worker by immutable digest and read back its identity
        env:
          WORKER_SOURCE_SHA: ${{ inputs.worker_source_sha }}
          WORKER_DIGEST: ${{ inputs.worker_digest }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          REF="$IMAGE_REPOSITORY@$WORKER_DIGEST"
          docker pull "$REF" >/dev/null
          ACTUAL="$(docker inspect --format='{{index .RepoDigests 0}}' "$REF" | sed 's/.*@//')"
          REVISION="$(docker inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' "$REF")"
          [ "$ACTUAL" = "$WORKER_DIGEST" ] || { echo "::error::worker digest readback mismatch"; exit 1; }
          [ "$REVISION" = "$WORKER_SOURCE_SHA" ] || { echo "::error::worker OCI revision mismatch"; exit 1; }
          echo "Accepted worker pulled by digest; OCI revision matches the frozen worker source."

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Require the production secret NAMES in the Fly secret store
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$FLY_API_TOKEN" ] || { echo "::error::FLY_API_TOKEN repository secret is absent"; exit 1; }
          NAMES="$(flyctl secrets list --app "$FLY_APP_NAME" --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const r of JSON.parse(s)) console.log(r.Name ?? r.name)})')"
          for required in NEXT_PUBLIC_SUPABASE_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            echo "$NAMES" | grep -qx "$required" || { echo "::error::Fly app secret $required is not set (set it with: flyctl secrets set $required=… --app $FLY_APP_NAME)"; exit 1; }
          done
          echo "All required production secret names are present in the Fly secret store (values never read)."

      - name: Mirror the exact image into the app's Fly registry and deploy it by digest
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          WORKER_SOURCE_SHA: ${{ inputs.worker_source_sha }}
          WORKER_DIGEST: ${{ inputs.worker_digest }}
        run: |
          set -euo pipefail
          flyctl auth docker >/dev/null
          MIRROR="registry.fly.io/$FLY_APP_NAME:$WORKER_SOURCE_SHA"
          docker tag "$IMAGE_REPOSITORY@$WORKER_DIGEST" "$MIRROR"
          docker push "$MIRROR" >/dev/null
          MIRROR_DIGEST="$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "$MIRROR" | grep '^registry.fly.io/' | sed 's/.*@//' | head -n1)"
          echo "mirror digest: $MIRROR_DIGEST"
          echo "RCAP_FLY_IMAGE_DIGEST=$MIRROR_DIGEST" >> "$GITHUB_ENV"
          flyctl deploy \
            --app "$FLY_APP_NAME" \
            --config "$FLY_CONFIG" \
            --image "registry.fly.io/$FLY_APP_NAME@$MIRROR_DIGEST" \
            --env "RCAP_WORKER_CONTAINER_DIGEST=$WORKER_DIGEST" \
            --ha=false \
            --strategy immediate \
            --yes

      - name: Verify the production worker is running the exact image and the queue is being served
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RCAP_WORKER_SOURCE_SHA: ${{ inputs.worker_source_sha }}
          RCAP_WORKER_DIGEST: ${{ inputs.worker_digest }}
          RCAP_PRODUCTION_PROJECT_REF: ${{ env.PRODUCTION_PROJECT_REF }}
        run: node scripts/verify-rcap-production-worker-execution.mjs

      - name: Upload the production worker execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcap-production-worker-${{ github.run_id }}
          path: production-worker-evidence/
          if-no-files-found: error
