name: Deploy RCAP render worker to production

# Release-captain-only control. Places the exact accepted worker image on the
# production execution target (one always-on Fly.io Machine, see
# deploy/rcap-render-worker/fly.toml) and proves it is running.
#
# Refuses unless the requested tuple is the one the committed publication
# evidence and the frozen release candidate bind. Never builds an image: it
# pulls the immutable digest from ghcr.io, re-tags it into the app's own Fly
# registry (Fly cannot pull a private ghcr.io image directly) and deploys that
# by digest. Production secrets are read from the Fly secret store by name
# only; this workflow never sees or prints their values.
#
# The exact E4D7 job below is the separately commissioned image-only operator
# case. It leaves the technical readonly ledger and every legacy guard intact.
# Its public artifact is a result projection, never a machine/config capsule.
#
# Required repository secrets:
#   FLY_API_TOKEN          — a Fly deploy token scoped to the app
#   SUPABASE_ACCESS_TOKEN  — existing; read-only queue-age verification
# Required Fly app secrets (set once by the owner, names only checked here):
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY

on:
  workflow_dispatch:
    inputs:
      worker_registry_readonly:
        description: "Inspect only the exact E4D7 destination digest and known W tag; no copy or machine/DB operation"
        required: false
        type: boolean
        default: false
      worker_source_sha:
        description: "Exact 40-character worker source SHA (must equal the frozen candidate)"
        required: true
        type: string
      worker_digest:
        description: "Exact immutable image digest sha256:… (must equal the frozen candidate)"
        required: true
        type: string
  # Callable from the registered dispatcher (rcap-f1-ephemeral-staging.yml,
  # mode production_worker_deploy): GitHub resolves workflow_dispatch against
  # the default branch, which this release never updates directly.
  workflow_call:
    inputs:
      worker_registry_readonly:
        description: "Inspect only the exact E4D7 destination digest and known W tag; no copy or machine/DB operation"
        required: false
        type: boolean
        default: false
      worker_source_sha:
        required: true
        type: string
      worker_digest:
        required: true
        type: string
    secrets:
      FLY_API_TOKEN:
        required: true
      SUPABASE_ACCESS_TOKEN:
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-rcap-render-worker-production
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/roger-legalease/rcap-render-worker
  FLY_APP_NAME: legalease-rcap-render-worker
  FLY_CONFIG: deploy/rcap-render-worker/fly.toml
  PRODUCTION_PROJECT_REF: wwtwtsmywnckfkdaqqeg

jobs:
  deploy:
    if: ${{ !inputs.worker_registry_readonly && !(inputs.worker_source_sha == 'e4d7faef0960c8b453bb88f2bf56456d3220567f' && inputs.worker_digest == 'sha256:1858985f511a74725c9d45dea1cb7881f53b0b66422e2786615799dcb8e6d31d') }}
    name: Exact worker onto the production execution target
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.worker_source_sha == '84a75b6e65dc69e6c371afac44f1284e0debf722' && inputs.worker_digest == 'sha256:c574d7ca3864dfcae9de3cb4fc77c8c324ace050310333093042f961e6f0b5f1' && 257 || 0 }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure bounded qualified worker history
        if: inputs.worker_source_sha == '84a75b6e65dc69e6c371afac44f1284e0debf722' && inputs.worker_digest == 'sha256:c574d7ca3864dfcae9de3cb4fc77c8c324ace050310333093042f961e6f0b5f1'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=257 origin captain-release
          for required in 4c189b682d0a9225a21b9fdf8a2ebc50500029d6 84a75b6e65dc69e6c371afac44f1284e0debf722 ed8d0902a99c5326f75987a942eb507b6cfb16cf 68784f1d89c1f2120a7f4c385569f8918d1492d1 0cd12827498a582b8558c312d8d5eae7076e7c3a 9c120d99f800c1fcf2ccf5c4b4e5b3eedd75a291 e49d4fee4d3c082f3be9571f4d3f5d77f5b2f67b; do
            git cat-file -e "$required^{commit}"
          done
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || { echo "::error::workflow execution checkout mismatch"; exit 1; }

      - name: Install frozen release-control dependencies
        run: npm ci

      - name: Verify the qualified worker placement controls
        if: inputs.worker_source_sha == '84a75b6e65dc69e6c371afac44f1284e0debf722' && inputs.worker_digest == 'sha256:c574d7ca3864dfcae9de3cb4fc77c8c324ace050310333093042f961e6f0b5f1'
        run: QUALIFIED_WORKER_CONTROLLER_TEST=1 node --test scripts/qualified-worker-deployment-inputs.test.mjs scripts/qualified-worker-placement.test.mjs

      - name: Refuse any worker identity outside the frozen candidate
        env:
          INPUT_WORKER_SOURCE_SHA: ${{ inputs.worker_source_sha }}
          INPUT_WORKER_DIGEST: ${{ inputs.worker_digest }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import { requireProductionPhaseAuthorization } from "./scripts/grade-a-launch-control/production-preflight-authorization.mjs";
          import { verifyProductionPreflightEvidence } from "./scripts/grade-a-launch-control/verify-production-preflight-evidence.mjs";
          import { requireCurrentReleaseCandidate } from "./scripts/grade-a-launch-control/verify-release-candidate-binding.mjs";
          import { readQualifiedWorkerDeploymentInputs } from "./scripts/qualified-worker-deployment-inputs.mjs";
          const sha = process.env.INPUT_WORKER_SOURCE_SHA ?? "";
          const digest = process.env.INPUT_WORKER_DIGEST ?? "";
          if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error("worker_source_sha must be an exact 40-character SHA");
          if (!/^sha256:[a-f0-9]{64}$/.test(digest)) throw new Error("worker_digest must be an exact sha256 digest");
          const candidate = JSON.parse(fs.readFileSync("data/rcap-grade-a/launch-control/RELEASE_CANDIDATE_BINDING.json", "utf8"));
          requireProductionPhaseAuthorization(candidate, "production_worker_deploy");
          const publication = JSON.parse(fs.readFileSync("data/rcap-render/worker-publication-evidence.json", "utf8"));
          const qualified = Boolean(candidate.qualifiedWorkerDatabase);
          if (qualified) {
            requireCurrentReleaseCandidate(process.cwd());
            readQualifiedWorkerDeploymentInputs(process.cwd(), candidate, publication);
          } else verifyProductionPreflightEvidence(process.cwd());
          const mismatches = [];
          if (candidate.workerSourceSha !== sha) mismatches.push("candidate workerSourceSha");
          if (candidate.workerDigest !== digest) mismatches.push("candidate workerDigest");
          if (candidate.productionAuthorized !== true) mismatches.push("candidate productionAuthorized");
          if (publication.sourceSha !== sha) mismatches.push("publication sourceSha");
          if (publication.immutableRegistryDigest !== digest) mismatches.push("publication immutableRegistryDigest");
          if (publication.workflowConclusion !== "success") mismatches.push("publication workflowConclusion");
          // Field-contract repair, 2026-09-22. This read `imageAcceptance.workflowConclusion`
          // and `imageAcceptance.immutableRegistryDigest`, which the evidence schema carried
          // until 4e16d6d8e and has not carried since: the block records `conclusion`, `digest`
          // and `tag`. Both reads were therefore undefined, so the clause could never be
          // satisfied by any tuple. It failed CLOSED, which is why nothing broke, but it was
          // tripping on absent fields rather than checking acceptance -- a gate that refuses
          // for the wrong reason proves nothing about the image. It now reads the fields the
          // committed evidence actually records, and also requires runtimeAccepted and that
          // the acceptance names this worker source as its tag.
          if (publication.runtimeAccepted !== true) mismatches.push("publication runtimeAccepted");
          const acceptance = publication.imageAcceptance;
          if (!acceptance || typeof acceptance !== "object") mismatches.push("recorded image acceptance");
          else {
            if (acceptance.conclusion !== "success") mismatches.push("image acceptance conclusion");
            if (acceptance.digest !== digest) mismatches.push("image acceptance digest");
            if (acceptance[qualified ? "sourceSha" : "tag"] !== sha) mismatches.push("image acceptance source");
            if (acceptance.digest !== candidate.workerDigest) mismatches.push("image acceptance vs candidate digest");
          }
          if (mismatches.length) throw new Error("refused: " + mismatches.join(", "));
          console.log("worker tuple is the frozen, published, accepted candidate");
          JS

      - name: Pull the accepted worker by immutable digest and read back its identity
        env:
          WORKER_SOURCE_SHA: ${{ inputs.worker_source_sha }}
          WORKER_DIGEST: ${{ inputs.worker_digest }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          REF="$IMAGE_REPOSITORY@$WORKER_DIGEST"
          docker pull "$REF" >/dev/null
          ACTUAL="$(docker inspect --format='{{index .RepoDigests 0}}' "$REF" | sed 's/.*@//')"
          REVISION="$(docker inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' "$REF")"
          [ "$ACTUAL" = "$WORKER_DIGEST" ] || { echo "::error::worker digest readback mismatch"; exit 1; }
          [ "$REVISION" = "$WORKER_SOURCE_SHA" ] || { echo "::error::worker OCI revision mismatch"; exit 1; }
          echo "Accepted worker pulled by digest; OCI revision matches the frozen worker source."

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Require the production secret NAMES in the Fly secret store
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$FLY_API_TOKEN" ] || { echo "::error::FLY_API_TOKEN repository secret is absent"; exit 1; }
          NAMES="$(flyctl secrets list --app "$FLY_APP_NAME" --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const r of JSON.parse(s)) console.log(r.Name ?? r.name)})')"
          for required in NEXT_PUBLIC_SUPABASE_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            echo "$NAMES" | grep -qx "$required" || { echo "::error::Fly app secret $required is not set (set it with: flyctl secrets set $required=… --app $FLY_APP_NAME)"; exit 1; }
          done
          echo "All required production secret names are present in the Fly secret store (values never read)."

      - name: Read current worker identity and decide no-op or exact deployment
        id: worker_readiness
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RCAP_WORKER_SOURCE_SHA: ${{ inputs.worker_source_sha }}
          RCAP_WORKER_DIGEST: ${{ inputs.worker_digest }}
          RCAP_PRODUCTION_PROJECT_REF: ${{ env.PRODUCTION_PROJECT_REF }}
        run: node scripts/rcap-production-worker-readiness.mjs

      - name: Mirror the exact image into the app's Fly registry and deploy it by digest
        if: steps.worker_readiness.outputs.disposition == 'WRITE_REQUIRED_AND_PROVEN'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          WORKER_SOURCE_SHA: ${{ inputs.worker_source_sha }}
          WORKER_DIGEST: ${{ inputs.worker_digest }}
        run: |
          set -euo pipefail
          flyctl auth docker >/dev/null
          MIRROR="registry.fly.io/$FLY_APP_NAME:$WORKER_SOURCE_SHA"
          docker tag "$IMAGE_REPOSITORY@$WORKER_DIGEST" "$MIRROR"
          docker push "$MIRROR" >/dev/null
          MIRROR_DIGEST="$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "$MIRROR" | grep '^registry.fly.io/' | sed 's/.*@//' | head -n1)"
          [[ "$MIRROR_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::mirror digest unavailable"; exit 1; }
          echo "mirror digest: $MIRROR_DIGEST"
          echo "RCAP_FLY_IMAGE_DIGEST=$MIRROR_DIGEST" >> "$GITHUB_ENV"
          export RCAP_FLY_IMAGE_DIGEST="$MIRROR_DIGEST"
          PLACEMENT_FLAGS=()
          if node -e "process.exit(JSON.parse(require('fs').readFileSync('data/rcap-grade-a/launch-control/RELEASE_CANDIDATE_BINDING.json')).qualifiedWorkerDatabase ? 0 : 1)"; then
            node scripts/qualified-worker-placement.mjs pre-effect
            WORKER_MACHINE_ID="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('production-worker-evidence/qualified-placement-intent.json')).machineId)")"
            PLACEMENT_FLAGS=(--only-machines "$WORKER_MACHINE_ID" --update-only --deploy-retries 0 --skip-release-command)
          fi
          flyctl deploy \
            --app "$FLY_APP_NAME" \
            --config "$FLY_CONFIG" \
            --image "registry.fly.io/$FLY_APP_NAME@$MIRROR_DIGEST" \
            --env "RCAP_WORKER_CONTAINER_DIGEST=$WORKER_DIGEST" \
            --ha=false \
            --strategy immediate \
            "${PLACEMENT_FLAGS[@]}" \
            --yes

      - name: Verify the production worker is running the exact image and the queue is being served
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RCAP_WORKER_SOURCE_SHA: ${{ inputs.worker_source_sha }}
          RCAP_WORKER_DIGEST: ${{ inputs.worker_digest }}
          RCAP_PRODUCTION_PROJECT_REF: ${{ env.PRODUCTION_PROJECT_REF }}
        run: |
          set -euo pipefail
          node scripts/verify-rcap-production-worker-execution.mjs
          if node -e "process.exit(JSON.parse(require('fs').readFileSync('data/rcap-grade-a/launch-control/RELEASE_CANDIDATE_BINDING.json')).qualifiedWorkerDatabase ? 0 : 1)"; then
            node scripts/qualified-worker-placement.mjs post-placement
          fi

      - name: Upload the production worker execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcap-production-worker-${{ github.run_id }}
          path: production-worker-evidence/
          if-no-files-found: warn

  deploy_e4d7:
    name: Exact E4D7 zero-copy transition with held-lease SSH proof
    if: ${{ inputs.worker_source_sha == 'e4d7faef0960c8b453bb88f2bf56456d3220567f' && inputs.worker_digest == 'sha256:1858985f511a74725c9d45dea1cb7881f53b0b66422e2786615799dcb8e6d31d' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INPUT_WORKER_SOURCE_SHA: ${{ inputs.worker_source_sha }}
      INPUT_WORKER_DIGEST: ${{ inputs.worker_digest }}
      RCAP_FLY_IMAGE_DIGEST: sha256:1858985f511a74725c9d45dea1cb7881f53b0b66422e2786615799dcb8e6d31d
      DOCKER_CONFIG: /tmp/e4d7-registry-auth
      RCAP_WORKER_REGISTRY_READONLY: ${{ inputs.worker_registry_readonly }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require the commissioned target and exact control closure
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ -z "$(git status --porcelain)" ]
          node --input-type=module -e 'import {requireExecutionContext} from "./scripts/acceptance/place-e4d7-worker.mjs"; requireExecutionContext(process.env)'
          printf '%s  %s\n' \
            ae5ef6a33f31e382cfa4eac6887fcdfaf1c9680f97df3487ae8ad5cdbc4382db scripts/acceptance/place-e4d7-worker.mjs \
            e092bfbd8d8335b6d7d444a28f06014a5b3d93139ee0288499da16dd2cc360aa scripts/acceptance/registry-image.mjs \
            5a184100854833ebaac42f1239e1cf210be24d7e4c4441b2c212c6988a9e649e scripts/acceptance/fly-handoff-events.mjs \
            bb3b85b405fa1a0c571f0b3c5b6bb7537d6634b4cde066cd176f387f98fad483 scripts/qualified-worker-readonly-capture.mjs \
            375eac173a9d5593aa1aa13463782911debd6649782bd7925458ffd00cc7f63d scripts/acceptance/place-e4d7-worker.test.mjs \
            | sha256sum -c -
          command -v skopeo >/dev/null
          skopeo --version
      - name: Check only the affected E4D7 module and before-effect refusals
        run: |
          if [ "$RCAP_WORKER_REGISTRY_READONLY" = true ]; then
            node --test --test-name-pattern='safe registry diagnostic (Skopeo-format|preserves only structural)' scripts/acceptance/place-e4d7-worker.test.mjs
          else
            node --test --test-name-pattern='held lease SSH correction:' scripts/acceptance/place-e4d7-worker.test.mjs
          fi
      - name: Set up the existing Fly CLI interface
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: 0.5.8
      - name: Check remaining streaming writes and the physical emergency reserve
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import os from 'node:os';
          const devices = new Map();
          // Both exact E4D7 paths inspect only bounded registry metadata; the writer reuses the verified mirror.
          const registryWrites = 1048576n;
          for (const [directory, writes] of [[process.cwd(), 1048576n], [os.tmpdir(), registryWrites]]) {
            const device = String(fs.statSync(directory).dev);
            const stat = fs.statfsSync(directory, {bigint: true});
            const entry = devices.get(device) ?? {available: stat.bavail * stat.bsize, writes: 0n};
            entry.available = entry.available < stat.bavail * stat.bsize ? entry.available : stat.bavail * stat.bsize;
            entry.writes += writes;
            devices.set(device, entry);
          }
          for (const {available, writes} of devices.values()) if (available < writes + 268435456n + 2147483648n) throw Error('remaining_stream_writes_and_emergency_buffer_unavailable');
          console.log('remaining_write_budget_and_emergency_reserve_proven');
          JS
      - name: Bind existing registry credential references without reading their bodies
        if: ${{ !inputs.worker_registry_readonly }}
        env:
          GHCR_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$DOCKER_CONFIG"
          printf '%s' "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null 2>&1 || { echo '::error::existing_registry_login_refused'; exit 1; }
          flyctl auth docker >/dev/null 2>&1 || { echo '::error::existing_fly_registry_auth_refused'; exit 1; }
      - name: Bind only the existing Fly registry reference for read-only diagnosis
        if: ${{ inputs.worker_registry_readonly }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$DOCKER_CONFIG"
          flyctl auth docker >/dev/null 2>&1 || { echo '::error::existing_fly_registry_auth_refused'; exit 1; }
      - name: Inspect only the accepted destination digest and known W tag
        if: ${{ inputs.worker_registry_readonly }}
        run: |
          node --input-type=module <<'JS'
          import {probeDestinationRegistry} from './scripts/acceptance/place-e4d7-worker.mjs';
          try {
            const result = probeDestinationRegistry();
            console.log(JSON.stringify(result));
            if (!result.diagnosticComplete) process.exitCode = 1;
          } catch (error) {
            console.error(/^[a-z][a-z0-9_]{1,100}$/.test(error?.message ?? '') ? error.message : 'destination_registry_preflight_or_custody_refused');
            process.exitCode = 1;
          }
          JS
      - name: Execute the exact guarded transition once
        if: ${{ !inputs.worker_registry_readonly }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/acceptance/place-e4d7-worker.mjs
      - name: Retain only the approved public result projection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e4d7-worker-result-${{ github.run_id }}
          path: e4d7-worker-placement-evidence/result.public.json
          if-no-files-found: warn
