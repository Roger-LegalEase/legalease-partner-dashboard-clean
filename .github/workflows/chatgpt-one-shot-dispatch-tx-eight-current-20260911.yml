name: ChatGPT one-shot dispatch Texas eight current-byte raster

on:
  push:
    paths:
      - .github/workflows/chatgpt-one-shot-dispatch-tx-eight-current-20260911.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch pinned eight-family Texas current-byte raster
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'rcap-packet-raster-acceptance-batch.yml',
              ref: 'claude/legalease-sprint-captain-utucnw',
              inputs: {
                commit_sha: 'e2e6fb4a44cc3eadc0fd350dcbc677eeefb58b87',
                raster_manifest_path: 'data/rcap-grade-a/packet-factory-24h/fix07/tx-eight-complete-20260911/raster-manifest.json'
              }
            });
            core.info('Dispatched eight-family Texas current-byte raster pinned to e2e6fb4a44cc3eadc0fd350dcbc677eeefb58b87');
