name: RCAP isolated recovery inspection
on:
  push:
    branches: [chatgpt/launch-recovery-20260906]
    paths: [.github/workflows/rcap-chatgpt-recovery.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Acquire only named official public repair inputs
        env:
          OUT: ${{ runner.temp }}/recovery-inputs
        run: |
          python3 - <<'PY'
          import os, json, hashlib, pathlib, datetime, urllib.request
          out = pathlib.Path(os.environ['OUT']); out.mkdir(parents=True)
          sources = [
            ('VA-CC1473.pdf', 'https://www.vacourts.gov/forms/circuit/cc1473.pdf', '6176c2f55bdb320682acecf0a79931bd5e496c4c93b5696645d4ef447fa67219'),
            ('PA-IFP-CCP.pdf', 'https://www.pacourts.us/Storage/media/pdfs/20210515/215517-file-6679.pdf', 'b1255ef0503f9c9ff0565e884083e37fe4072e4e9999bec159712d467d420fca'),
            ('PA-790-ORDER.pdf', 'https://www.pacourts.us/Storage/media/pdfs/20210224/222549-blankexpungementorder7900309121-000065.pdf', '4d312ebde4aed7c1941e1ae9d734c90ba7183db273778839b15a84be8e611c95'),
            ('DE-27S23V.pdf', 'https://dsp.delaware.gov/wp-content/uploads/sites/118/2023/09/DE-Service-Code-Form_27S23V_DSP_Expungements-Pardons.pdf', None),
            ('DE-SBI-process.html', 'https://dsp.delaware.gov/obtaining-a-certified-criminal-history/', None),
            ('NC-G106.pdf', 'https://www.nccourts.gov/assets/documents/forms/g106ff%2010-25-2024.pdf?VersionId=pWEgUyskv7C0ph8Hpo.ql0cZ16GxWaPs', None),
          ]
          rows=[]
          for name, url, expected in sources:
            row={'file':name,'url':url,'expectedSha256':expected,'retrievedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
            try:
              request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; LegalEase official-form verification)'})
              with urllib.request.urlopen(request, timeout=45) as response:
                data=response.read(20_000_001)
                if len(data)>20_000_000: raise ValueError('source exceeds 20 MB bound')
                row.update(status=response.status, finalUrl=response.url, contentType=response.headers.get('Content-Type'))
              if name.endswith('.pdf') and not data.startswith(b'%PDF-'): raise ValueError('response is not a PDF')
              digest=hashlib.sha256(data).hexdigest()
              row.update(sha256=digest,byteLength=len(data),matchesPinnedHash=(digest==expected if expected else None))
              (out/name).write_bytes(data)
            except Exception as error:
              row['error']=str(error)
            rows.append(row)
          (out/'download-evidence.json').write_text(json.dumps(rows,indent=2)+'\n')
          print(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rcap-recovery-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/recovery-inputs/
          retention-days: 3
          if-no-files-found: error
