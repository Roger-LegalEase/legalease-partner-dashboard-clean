name: RCAP isolated recovery inspection
on:
  push:
    branches: [chatgpt/launch-recovery-20260906]
    paths: [.github/workflows/rcap-chatgpt-recovery.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture tracked source and commit-only ancestry
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/recovery"
          mkdir -p "$out/metadata"
          git rev-parse HEAD > "$out/metadata/source-sha.txt"
          git ls-tree -r HEAD > "$out/metadata/source-tree.txt"
          git for-each-ref --format='%(objectname) %(refname)' refs/remotes/origin/ > "$out/metadata/source-refs.txt"
          git rev-list HEAD | git pack-objects --stdout > "$out/metadata/commits.pack"
          git archive --format=tar.gz HEAD | split -b 400M -d -a 2 - "$out/source.part."
          sha256sum "$out"/source.part.* > "$out/metadata/parts.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: rcap-recovery-source-00-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/recovery/source.part.00
            ${{ runner.temp }}/recovery/metadata/
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: rcap-recovery-source-01-${{ github.run_id }}
          path: ${{ runner.temp }}/recovery/source.part.01
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: rcap-recovery-source-02-${{ github.run_id }}
          path: ${{ runner.temp }}/recovery/source.part.02
          retention-days: 3
          compression-level: 0
