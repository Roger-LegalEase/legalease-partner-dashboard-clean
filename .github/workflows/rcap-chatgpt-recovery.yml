name: RCAP isolated recovery inspection
on:
  push:
    branches: [chatgpt/launch-recovery-20260906]
    paths: [.github/workflows/rcap-chatgpt-recovery.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect baseline without modifying any branch
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/recovery"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/source-sha.txt"
          for script in generate generate-source-conveyor generate-washington-repair; do
            if node "scripts/grade-a-packet-factory-24h/$script.mjs" --check > "$out/$script-baseline.txt" 2>&1; then code=0; else code=$?; fi
            printf '%s %s\n' "$script" "$code" >> "$out/baseline-exit-codes.txt"
          done
          git status --porcelain > "$out/baseline-worktree.txt"
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Package offline Node dependencies
        run: tar -czf "$RUNNER_TEMP/recovery/node_modules.tar.gz" node_modules
      - name: Upload temporary inspection artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcap-recovery-inspection-${{ github.run_id }}
          path: ${{ runner.temp }}/recovery/
          retention-days: 3
          if-no-files-found: error
