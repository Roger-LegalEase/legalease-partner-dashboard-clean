# RCAP partner onboarding gate.
#
# A separate workflow rather than steps added to an existing one, for two reasons: the
# onboarding portal should be able to go red without hiding the state of the nationwide
# factory checks, and rcap-all50-handoff.yml and rcap-production-factory.yml are being
# edited on another branch, so adding steps there would guarantee a merge conflict.
#
# The database and staging groups are deliberately not run here. They need credentials this
# workflow does not have, and a gate that silently skips is worse than one that does not
# exist. They are release gates, documented in docs/rcap/onboarding/VERIFICATION_GATES.md.

name: RCAP Partner Onboarding

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: rcap-partner-onboarding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  onboarding:
    name: Verify RCAP partner onboarding
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch pinned Georgia assembly comparison baseline
        run: git fetch --no-tags --depth=1 origin 8af7a0641c8ff7ad126c40b1333994737e76dbe7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Verify Clinic acceptance harness controls
        run: node --test scripts/clinic-qa/artifact-journey.test.mjs scripts/clinic-qa/fixture.test.mjs scripts/clinic-qa/generation-refusal.test.mjs scripts/clinic-qa/sponsored-cleanup.test.mjs scripts/test-private-download-denial.mjs

      - name: Install PDF text verification dependency
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi

      - name: Verify nationwide correction boundaries
        run: |
          node scripts/generate-rcap-public-witness-answer-sets.mjs --check
          node scripts/test-public-witness-convergence.mjs
          node scripts/test-ar-record-origin.mjs
          node scripts/test-ar-record-origin-render.mjs
          node scripts/test-ar-record-origin-presentation.mjs
          node scripts/test-composed-route-final-disposition.mjs
          node scripts/test-md-automatic-county-collection.mjs
          node scripts/test-ms-exact-timing-recovery.mjs
          node scripts/test-ms-program-factual-routing.mjs
          node scripts/test-ms-program-final-disposition.mjs
          node scripts/test-ms-conditional-discharge-event.mjs
          node scripts/test-ms-program-completion-events.mjs
          node scripts/test-guidance-result-packet-claims.mjs
          node scripts/test-ga-first-offender-factual-routing.mjs
          node scripts/test-il-cannabis-factual-boundaries.mjs
          node scripts/test-il-ga-factual-pathway-exclusions.mjs
          node scripts/test-il-ga-protected-exclusion-recovery.mjs
          node scripts/test-conviction-relief-request.mjs
          node scripts/test-ga-pardon-facts.mjs
          node scripts/test-ga-pardon-caption.mjs
          node scripts/test-ga-agency-county-context.mjs
          node scripts/test-ga-agency-protected-county-successor.mjs
          node scripts/test-ga-pardon-category-context.mjs
          node scripts/test-ga-pardon-preparation.mjs
          node scripts/test-ga-pardon-petition-readiness.mjs
          node scripts/test-ga-participant-assembly.mjs --mapping-only
          node scripts/test-ga-pardon-track-selection.mjs
          node scripts/test-ga-pardon-packet-label.mjs
          node scripts/test-ga-personalized-handoff.mjs "$RUNNER_TEMP/ga-personalized-handoff"
          node scripts/test-ga-personalized-dispatch.mjs
          node scripts/test-question-contract-output-continuity.mjs
          node scripts/test-ms-paid-packet-output-continuity.mjs
          node scripts/test-ms-paid-packet-proof.mjs --proof-only
          node scripts/verify-personalized-route-refusal.mjs
          node scripts/test-ks-municipal-factual-boundaries.mjs
          node scripts/test-ks-district-factual-routing.mjs
          node scripts/test-ga10-missing-witnesses.mjs
          node scripts/test-ga10-ne-missing-witnesses.mjs
          node scripts/test-ga10-la9852-missing-witness.mjs
          node scripts/test-ga10-me-nonconviction-witness.mjs
          node scripts/test-ga10-mo-closure-witness.mjs
          node scripts/test-ga10-mo-marijuana-custody.mjs
          node scripts/test-ny-16059-factual-boundaries.mjs
          node scripts/test-ny-16059-guidance.mjs
          node scripts/test-ny-16059-typed-completion.mjs
          node scripts/test-ny-16059-packet-preparation.mjs
          node scripts/test-ny-16059-case-records.mjs
          node scripts/test-ny-16059-case-classification.mjs
          node scripts/test-ny-16059-filing-venue.mjs
          node scripts/test-ny-16059-sealing-history.mjs
          node scripts/test-ny-16059-future-applications.mjs
          node scripts/test-ny-16059-owned-completion.mjs
          node scripts/test-ny-later-conviction-fact.mjs
          node scripts/test-ny-history-clock.mjs
          node scripts/test-ny-residual-order-transactions.mjs
          node scripts/test-ca-prop64-conduct.mjs
          node scripts/test-ca-prop64-integration.mjs
          node scripts/test-ca-prop64-form-ownership.mjs
          node scripts/test-ca-prop64-completeness-actors.mjs
          node scripts/test-ca-prop64-caption-bindings.mjs
          node scripts/test-ca-prop64-caption-collection.mjs
          node scripts/test-ca-prop64-contact-collection.mjs
          node scripts/test-packet-initial-save-revision.mjs
          node scripts/test-tx-nondisclosure-arrest-anchor.mjs
          node scripts/test-nevada-program-question-scope.mjs
          node scripts/test-ms-felony-record-class-safety.mjs
          node scripts/verify-de-exclusion-mechanism-boundary.mjs
          node scripts/test-de-discretionary-date-anchor.mjs
          node scripts/test-de-conviction-predicates.mjs
          node scripts/test-de-public-profile-dates.mjs
          node scripts/test-ks-document-responsibilities.mjs
          node scripts/test-independent-paid-financial-meaning.mjs
          node scripts/test-reused-completion-review-edit.mjs
          node scripts/test-financial-nonplan-recovery.mjs
          node scripts/test-screening-completion-correction-save.mjs
          node scripts/test-protected-legacy-answer-preservation.mjs
          node scripts/test-protected-legacy-presentation.mjs
          node scripts/test-protected-legacy-derivation-guard.mjs
          node scripts/test-va-cc1472-fact-ownership.mjs
          node scripts/test-va-absolute-pardon-procedure.mjs
          node scripts/verify-va-cc1472-two-branch-treatment.mjs
          node scripts/verify-va-regime-1-caption-and-dead-end.mjs
          node scripts/verify-rcap-prepay-question-gate.mjs

      # Every deterministic onboarding verifier, through the one entry point that also
      # fails when a verifier exists that no group owns.
      - name: Verify onboarding (local group)
        run: npm run partners:verify-onboarding-all

      - name: Verify partner launch readiness
        run: npm run partners:verify-launch-readiness

      # The contract the README and the partner setup checklist both promise: the
      # production build completes with no Supabase credentials present. Running it with
      # the variables explicitly empty is the point of the step.
      - name: Credential-free production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
        run: npm run build
