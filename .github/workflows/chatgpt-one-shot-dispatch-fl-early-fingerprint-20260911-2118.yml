name: ChatGPT one-shot dispatch Florida early fingerprint raster

on:
  push:
    paths:
      - .github/workflows/chatgpt-one-shot-dispatch-fl-early-fingerprint-20260911-2118.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch pinned Florida early fingerprint raster
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'rcap-packet-raster-acceptance-batch.yml',
              ref: 'claude/legalease-sprint-captain-utucnw',
              inputs: {
                commit_sha: '1e09363c514ddfabfe493be8685bc466afd7f723',
                raster_manifest_path: 'data/rcap-grade-a/packet-factory-24h/fix06/fl-early-source-geometry-20260911/raster-manifest.json',
                family_batch: 'fl-early-juvenile-set'
              }
            });
            core.info('Dispatched Florida early fingerprint raster pinned to 1e09363c514ddfabfe493be8685bc466afd7f723');
