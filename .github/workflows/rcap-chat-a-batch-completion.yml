name: RCAP Chat A batch completion
on:
  push:
    branches: [chatgpt/launch-recovery-20260906]
    paths: [.github/workflows/rcap-chat-a-batch-completion.yml]
permissions:
  contents: read
concurrency:
  group: rcap-completion-publication
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.publish.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare readers without rebuilding a packet
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Consume measured complete outputs, validate exact guidance and publish after all checks
        id: publish
        run: python3 scripts/rcap-packet-recovery/integrate-fl-de-batch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-a-fl-de-completion-${{ github.run_id }}
          path: |
            data/rcap-grade-a/chat-parallel-2026-09-07/integration/fl-de-hosted-validation/
            data/rcap-all50/overlays/census-v1/fl/fl-early-juvenile-set--official-pdf-fill/
            data/rcap-all50/overlays/census-v1/de/de-mandatory-expungement-set--official-pdf-fill/product-wiring.json
            ${{ runner.temp }}/published-sha.txt
          retention-days: 14
          if-no-files-found: error
  raster:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/github-script@v7
        env:
          CANDIDATE: ${{ needs.integrate.outputs.candidate }}
        with:
          script: |
            const candidate = process.env.CANDIDATE;
            if (!/^[a-f0-9]{40}$/.test(candidate)) throw new Error('Missing published packet commit');
            await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'rcap-packet-raster-acceptance-batch.yml',ref:'main',inputs:{commit_sha:candidate,raster_manifest_path:'data/rcap-grade-a/packet-factory-24h/RASTER_QUEUE.json',family_batch:'fl-early-juvenile-set',requested_scale:'2.5'}});
            core.info('Fresh full Florida raster dispatched; not a verdict or independent approval.');
