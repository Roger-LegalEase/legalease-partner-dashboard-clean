name: RCAP All50 Handoff Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/rcap-all50-qa-attorney-handoff

permissions:
  contents: read

jobs:
  verify:
    name: Verify RCAP all50 handoff
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect CI scope
        id: scope
        run: node scripts/detect-ci-scope.mjs --github-output

      - name: Skip RCAP handoff when RCAP is not affected
        if: ${{ steps.scope.outputs.rcapAffected != 'true' }}
        run: echo "RCAP not affected; skipping RCAP handoff verification."

      - name: Set up Node
        if: ${{ steps.scope.outputs.rcapAffected == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: ${{ steps.scope.outputs.rcapAffected == 'true' }}
        run: npm ci

      - name: Lint
        if: ${{ steps.scope.outputs.rcapAffected == 'true' }}
        run: npm run lint

      - name: Typecheck
        if: ${{ steps.scope.outputs.rcapAffected == 'true' }}
        run: npm run typecheck

      - name: Test
        if: ${{ steps.scope.outputs.rcapAffected == 'true' }}
        run: npm test

      - name: Verify all50 build
        if: ${{ steps.scope.outputs.rcapAffected == 'true' }}
        run: npm run rcap:verify-all50-build

      - name: Verify all50 state packs
        if: ${{ steps.scope.outputs.rcapAffected == 'true' }}
        run: npm run rcap:verify-all50-state-packs

      - name: Verify overlay factory
        if: ${{ steps.scope.outputs.rcapAffected == 'true' }}
        run: npm run rcap:verify-overlay-factory

      - name: Verify all50 review artifacts
        if: ${{ steps.scope.outputs.rcapAffected == 'true' }}
        run: npm run rcap:verify-all50-review-artifacts

      - name: Verify all50 internal preview
        if: ${{ steps.scope.outputs.rcapAffected == 'true' }}
        run: npm run rcap:verify-all50-internal-preview

      - name: Verify all50 handoff
        if: ${{ steps.scope.outputs.rcapAffected == 'true' }}
        run: npm run rcap:verify-all50-handoff
      # Unconditional on purpose. A stale or over-broad .vercelignore is not
      # "RCAP-affected" in the scope detector's sense, and this is precisely the
      # check that must not be skipped on the run where someone prunes a path
      # the application reads.
      - name: Verify the Vercel deployment source stays closed
        run: node scripts/verify-rcap-deployment-closure.mjs

      # Deliberately invoked directly rather than wired into `npm test`.
      # package.json is one of the seven worker image inputs, so adding a script
      # entry there would change the image fingerprint and invalidate the digest
      # published from this very commit — forcing a rebuild for a change that
      # alters nothing the image contains. This file is in neither image-input
      # set, so the guard runs on every pull request at no such cost.
      #
      # Unconditional on purpose: a stale digest is not "RCAP-affected" in the
      # scope detector's sense, and this is exactly the check that must not be
      # skipped on the run where someone repoints a digest.
      - name: Verify the acceptance migration sequence reaches phase 55
        run: node scripts/verify-rcap-acceptance-migration-sequence.mjs

      - name: Prove the acceptance migration sequence guard is load-bearing
        run: node scripts/test-rcap-acceptance-migration-sequence-mutations.mjs

      - name: Verify the published worker digest is bound to its fingerprint
        run: node scripts/test-rcap-worker-digest-binding-mutations.mjs

      # Same reasoning as above: package.json is an image input for both the
      # application and the worker, and this guard exists to stop a second
      # publication from moving a source-SHA tag. Wiring it through the chain
      # string would invalidate the digest it protects.
      - name: Verify the worker publication cannot move an existing source-SHA tag
        run: node scripts/verify-rcap-worker-tag-guard.mjs

      - name: Prove the source-SHA tag guard is load-bearing
        run: node scripts/test-rcap-worker-tag-guard-mutations.mjs

      # The hosted acceptance matrix cannot run here — it needs Stripe, Vercel
      # and the acceptance project — but the part of it that decides verdicts
      # can, and has to. Two false greens have already shipped from that one
      # file: a four-argument record() call whose case could not fail, and a
      # worker case that read a process exit code as a delivery. Both printed
      # "ok". These two steps execute the verdict function extracted from the
      # shipped bytes and check every call site and verdict expression, then
      # put each defect back to prove the check goes red for it.
      #
      # Outside both image-input sets, like the guards above, so a matrix the
      # digests never see can still be held to this.
      - name: Verify the hosted acceptance matrix cannot report an unearned verdict
        run: node scripts/verify-rcap-hosted-acceptance-verdicts.mjs

      - name: Prove the hosted acceptance verdict guard is load-bearing
        run: node scripts/test-rcap-hosted-acceptance-verdict-mutations.mjs

      # The boundaries the matrix above asserts against, proved on a real
      # database rather than assumed: binding is written in the enqueue INSERT,
      # the consumption row and the credit ledger event are written by
      # finalization, and a failing worker leaves a job 'failed' and never
      # 'claimed'. The matrix had guessed two of these and reported one
      # unfinalized render as four unrelated failures. Skips itself cleanly
      # where no ephemeral PostgreSQL is available.
      - name: Verify where each consumer record is actually created
        run: node scripts/verify-rcap-consumer-lifecycle-boundaries.mjs

      # The problematic-PDF lane's fail-closed contract, invoked directly for
      # the same reason as the guards above: package.json is a worker image
      # input, so an npm script entry would change the image fingerprint and
      # force a rebuild for a check that alters nothing the image contains.
      # This file is in neither image-input set.
      #
      # Unconditional on purpose. The two counters this asserts -- no
      # problematic asset sellable, none on a public packet route -- must hold
      # on every pull request, and a change that makes one of them false is
      # exactly the change the scope detector would not call RCAP-affected.
      - name: Verify the problematic-PDF register, evidence and dispositions
        run: node scripts/verify-rcap-problematic-pdf-remediation.mjs

      - name: Prove the problematic-PDF contract is load-bearing
        run: node scripts/verify-rcap-problematic-pdf-remediation.mjs --mutations

      - name: Verify the problematic-PDF contract is actually wired into this workflow
        run: node scripts/verify-rcap-problematic-pdf-ci-wiring.mjs

      # Retirement removes an asset from the problematic denominator, so the
      # evidence behind it has to hold on every run: the determination must
      # still probe every surface and still find none, and every retirement
      # marker must still match what the determination says.
      - name: Verify the PDF retirement determination is current
        run: node scripts/generate-rcap-pdf-retirement-determination.mjs --check

      - name: Verify every retirement marker matches its determination
        run: node scripts/retire-rcap-problematic-pdf-assets.mjs --check

      # Every discovered field or measured anchor carries exactly one class.
      # An empty classification file is worse than none: it looks like the
      # question was asked.
      - name: Verify every discovered field or anchor is classified
        run: node scripts/generate-rcap-field-classification.mjs --check

      - name: Verify the flat-overlay renders are current
        run: node scripts/render-rcap-flat-overlay-families.mjs --check
