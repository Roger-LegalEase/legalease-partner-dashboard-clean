          assert.equal(input.sponsor_items??'[]','[]');assert.ok(input.sponsor_fulfillment===undefined||input.sponsor_fulfillment===false||input.sponsor_fulfillment==='false');
          JS
      - uses: actions/checkout@v4
        with:
          ref: 2a28aa80597b214808adf46859c1fdb473ecacb6
          path: admitted-controller
          fetch-depth: 257
          persist-credentials: false
      - name: Bind exact qualified-image Preview controls separately from the real carrier
        run: |
