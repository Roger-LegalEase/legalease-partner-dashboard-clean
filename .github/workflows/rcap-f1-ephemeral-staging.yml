          assert.equal(input.sponsor_items??'[]','[]');assert.ok(input.sponsor_fulfillment===undefined||input.sponsor_fulfillment===false||input.sponsor_fulfillment==='false');
          for(const [file,hash]of Object.entries({"scripts/rcap-hosted-ordinary-admin-readonly.mjs":"728455bd5108add8d54986636de5c6af859a275e514c51cb0d01e8f7c828f9b7","scripts/rcap-hosted-ordinary-admin-readonly-runner.mjs":"9615976c91644b68819761fcd624cdf3ecabaa3f88219c578521757fe8038e0e","scripts/rcap-hosted-ordinary-admin-configure-diagnostic.mjs":"e11b80936ddffea3fa3537a48259f3c6301f8514b993923eca596611bbb45119"}))assert.equal(createHash('sha256').update(fs.readFileSync(file)).digest('hex'),hash);
          JS
      - uses: actions/checkout@v4
        with:
          ref: 1e5878528f0b7aea1ada192b01b514bd38b54192
          path: admitted-controller
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the already accepted immutable controller record bytes
        working-directory: admitted-controller
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';import {execFileSync} from 'node:child_process';
          assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),'1e5878528f0b7aea1ada192b01b514bd38b54192');
          for(const [name,hash]of Object.entries({PENDING_WORKER_SUCCESSOR:'5d7dd5da43ed35e9a23ec78e45cd0c5d3757515414beb55f77c4bfb32a63db17',RELEASE_CANDIDATE_BINDING:'4d2b52fc8266e72e1c26683aae6e60ba279ce7cafde4db79244a154e5e2443bb',HOSTED_TOOLS_BINDING:'eced4fb24457d0f666304a3eae3b765681f3705f1be6d6be317e10b599fcaff5'}))assert.equal(createHash('sha256').update(fs.readFileSync('data/rcap-grade-a/launch-control/'+name+'.json')).digest('hex'),hash);
