  ordinary_full_journey:
    name: Complete only a Start-admitted ordinary sponsored journey
    if: inputs.mode == 'ordinary_full_journey'
    permissions:
      contents: read
      actions: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: carrier
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: carrier
          fetch-depth: 257
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require genuine successful original Start before any credential or participant operation
        env:
          DISPATCH_INPUTS: ${{ toJSON(inputs) }}
        run: |
          node --input-type=module <<'JS'
          import fs from'node:fs';import assert from'node:assert/strict';import{requireOrdinaryFullDispatch,requireOriginalStartSourceReady}from'./scripts/rcap-hosted-ordinary-full-admission.mjs';
          for(const[file,pin]of Object.entries(JSON.parse(fs.readFileSync('scripts/ordinary-full-journey-source-pins.json')).files)){assert.equal((await import('node:crypto')).createHash('sha256').update(fs.readFileSync(file)).digest('hex'),pin);}requireOrdinaryFullDispatch(process.env);requireOriginalStartSourceReady();assert.equal(JSON.parse(fs.readFileSync('vercel.json')).git.deploymentEnabled[process.env.GITHUB_REF_NAME],false);
          JS
      - name: Stage only actual successful Start and fresh ordinary control metadata privately
        env:
          ORDINARY_FULL_INPUT_ARCHIVE_B64: ${{ secrets.ORDINARY_FULL_INPUT_ARCHIVE_B64 }}
          ORDINARY_FULL_CONTROL_BINDING_SHA256: ${{ inputs.ordinary_full_control_binding_sha256 }}
        run: python3 scripts/stage-ordinary-full-input.py
      - name: Qualify the exact original Start native files before dependency or registry preparation
        env:
          DISPATCH_INPUTS: ${{ toJSON(inputs) }}
        run: node scripts/rcap-hosted-ordinary-full-journey-entry.mjs --verify
      - name: Reuse locked existing browser dependencies without application build
        run: npm ci --ignore-scripts
      - name: Authenticate existing read-only registry custody
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prepare only accepted immutable worker without starting a container
        run: |
          image=$(node --input-type=module -e "import{ORDINARY}from'./scripts/rcap-hosted-ordinary-full-admission.mjs';console.log('ghcr.io/roger-legalease/rcap-render-worker@'+ORDINARY.digest)")
          docker pull "$image"
      - name: Run one admitted ordinary UI claim Verify one worker and private delivery
        env:
          DISPATCH_INPUTS: ${{ toJSON(inputs) }}
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/rcap-hosted-ordinary-full-journey-entry.mjs
      - name: Preserve private ordinary custody and typed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ordinary-full-journey-${{ github.run_id }}
          path: carrier/ordinary-full-journey-evidence/*.json
          if-no-files-found: warn
