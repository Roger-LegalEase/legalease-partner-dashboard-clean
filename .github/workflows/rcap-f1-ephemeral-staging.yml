name: RCAP F1 ephemeral staging
run-name: "RCAP F1 | ${{ inputs.mode || 'ephemeral' }} | tools ${{ inputs.tools_sha }} | app ${{ inputs.application_sha }} | cents ${{ inputs.expected_total_cents || '5000' }}"

# Captain-owned, manual only. This workflow REHEARSES STAGING ON A DISPOSABLE
# STACK AND NOTHING ELSE. The entire environment — Postgres, Auth, PostgREST,
# Storage, Kong, Mailpit, the application, the worker container — lives and
# dies inside this runner. It touches no hosted project, no persistent
# environment, no production surface, and it deploys nothing that outlives
# the run.
#
# Lane A supplies one exact full application SHA at dispatch. The reusable
# worker publication remains pinned, and the canonical-input equivalence gate
# below refuses that digest if the final candidate changes worker bytes.

#
# This workflow is also the DISPATCH ENTRY POINT for the persistent hosted
# acceptance environment. GitHub lists workflow_dispatch only for files that
# exist on the default branch, and pushing to main is Roger's decision, so the
# hosted workflow is reached through `mode` here and runs as a reusable
# workflow resolved from this run's own commit. `mode: ephemeral` — the
# default — behaves exactly as it always has.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "ephemeral | hosted_* (Vercel, including audit and reuse-only Checkout) | github_acceptance (temporary HTTPS fallback)"
        required: false
        type: choice
        options: [ordinary_admin_configure_capacity, ordinary_admin_provision, ordinary_admin_readonly, clinic_vercel_readonly, clinic_owned_matter_packet, clinic_setup_only, clinic_prerequisites_only, clinic_owned_matter_readonly, configured_sandbox_preview, production_hotfix, successor_nonproduction_closure, ephemeral, required_worker_delivery, hosted_preflight, hosted_vercel_identity, hosted_vercel_audit, hosted_migrate, hosted_clinic_migrate, hosted_legal_aid_migrate, hosted_clinic_deploy, hosted_clinic_preview, hosted_clinic_resume, hosted_legal_aid_browser, hosted_sponsor_cap, hosted_deploy, hosted_replace_preview, hosted_accept, hosted_stripe_retarget, hosted_checkout_gate, hosted_browser, hosted_payment, hosted_full, hosted_worker_contract, github_acceptance, production_preflight, production_restage, production_clinic_migrate, production_forward_chain_readback, production_forward_chain_migrate, production_legal_aid_keys_read, production_legal_aid_keys_create, production_legal_aid_readback, production_legal_aid_migrate, production_smoke, production_activate, production_worker_deploy, production_public_verify, production_save_transition_reproduce, production_save_transition_verify, production_live_zero_dollar_order, production_packet_canary]
        default: ephemeral
      clinic_attempt_id:
        description: "Owner-authorized Clinic attempt identity; required for clinic_setup_only, never reused"
        required: false
        type: string
        default: ""
      preview_hostname:
        description: "Exact existing Vercel Preview hostname to REUSE; supplying it forbids creating another deployment"
        required: false
        default: ""
      sponsor_case:
        description: "Existing authorized synthetic case: sponsored, exhausted, or final_slot (never historical Applicant A)"
        required: false
        type: string
        default: ""
      sponsor_fulfillment:
        description: "Require sponsored completion: read-only wait for separately authorized finalization, then generated proof (no worker launch)"
        required: false
        type: boolean
        default: false
      sponsor_items:
        description: "JSON array of one existing item, or two for final_slot; owner/matter/funding are read server-side"
        required: false
        type: string
        default: "[]"
      contradiction_job_id:
        description: "Exact packet_render_jobs id to diagnose (hosted_worker_contract only)"
        required: false
        type: string
        default: ""
      promotion_code:
        description: "Stripe promotion code entered on the hosted Checkout page (hosted_payment); empty runs the ordinary $50 order"
        required: false
        type: string
        default: ""
      journey_state:
        description: "Two-letter jurisdiction for the paid journey (hosted_payment); empty picks the first sellable route"
        required: false
        type: string
        default: ""
      expected_total_cents:
        description: "Hosted payment expected total in USD cents; required with promotion_code (0–4999). Blank without a code means 5000."
        required: false
        type: string
        default: ""
      resume_matter_id:
        description: "Existing matter for separately authorized recovery; packet canary resume never creates a matter or order"
        required: false
        type: string
        default: ""
      preview_creation_run_id:
        description: "Exact successful hosted_replace_preview creation run for read-only successor closure"
        required: false
        type: string
        default: ""
      preview_deployment_id:
        description: "Exact existing Vercel Preview deployment id; optional — resolved from preview_hostname when omitted"
        required: false
        type: string
        default: ""
      supabase_project_ref:
        description: "Acceptance Supabase project ref (hosted modes only)"
        required: false
        type: string
        default: ""
      application_sha:
        description: "Exact final application SHA supplied by Lane A"
        required: true
        type: string
      worker_source_sha:
        description: "Pinned worker source freeze SHA (must equal the authorized value)"
        required: true
        type: string
      worker_digest:
        description: "Pinned immutable worker digest (must equal the authorized value)"
        required: true
        type: string
      tools_sha:
        description: "Integration-branch commit carrying the F1 orchestration scripts (must be image-input-equivalent to the freeze)"
        required: true
        type: string
      clinic_resume_authorization:
        description: "Required for hosted_clinic_resume: exact owner resume authorization identifier"
        required: false
        type: string
        default: ""
      clinic_session_closure_authorization:
        description: "Required for hosted_clinic_resume: exact lost-cookie session closure authorization identifier"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: rcap-f1-ephemeral-staging
  cancel-in-progress: false

env:
  # Accepted successor: publication 36219916209, read-only image acceptance
  # 36247303667. Application and worker source share the exact af638b61 freeze.
  AUTHORIZED_WORKER_SOURCE_SHA: 5e04eafd7eaed7e71722862e651fb787ebbd296d
  AUTHORIZED_WORKER_DIGEST: sha256:6b6a60fc5b2d0060028526013ce37c69f748e2cccb4cfb10943f2af6cf26cfe1
  IMAGE_REPOSITORY: ghcr.io/roger-legalease/rcap-render-worker
  CANONICAL_INTEGRATION_BRANCH: captain-release
  STAGING_ENVIRONMENT_NAME: rcap-acceptance

jobs:
  clinic_setup_only:
    name: Normal Clinic consent and screening only
    if: inputs.mode == 'clinic_setup_only' || inputs.mode == 'clinic_prerequisites_only'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require the published control branch to prevent Vercel Git deployment
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          import {assertClinicSetupDispatch} from './scripts/rcap-clinic-setup-only-boundary.mjs';
          const config=JSON.parse(fs.readFileSync('vercel.json'));
          assert.equal(config.git.deploymentEnabled[process.env.GITHUB_REF_NAME],false);
          assert.equal(process.env.GITHUB_RUN_ATTEMPT,'1');
          assertClinicSetupDispatch(JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8')).inputs);
          JS
      - name: Install locked runner dependencies without application build
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify the setup-only stop and request boundaries before credentials
        run: node --test scripts/rcap-clinic-setup-only-boundary.test.mjs scripts/rcap-clinic-setup-admin-code.test.mjs scripts/rcap-clinic-setup-request-guard.test.mjs scripts/rcap-clinic-normal-readiness.test.mjs scripts/rcap-clinic-live-prerequisites.test.mjs scripts/test-clinic-database-prerequisites.mjs scripts/rcap-clinic-setup-resource-loading.test.mjs
      - name: Aggregate live read-only Clinic database, Preview and CAPTCHA prerequisites
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          RCAP_BROWSER_EVIDENCE_DIR: clinic-setup-only-evidence
        run: node scripts/rcap-clinic-live-prerequisites.mjs
      - name: Enter existing Clinic and claim one new screening result
        if: inputs.mode == 'clinic_setup_only'
        env:
          RCAP_BROWSER_CLINIC_ATTEMPT_ID: ${{ inputs.clinic_attempt_id }}
          RCAP_BROWSER_CLINIC_SETUP_ONLY: '1'
          RCAP_BROWSER_CLINIC_PREREQUISITES_FILE: clinic-setup-only-evidence/clinic-live-prerequisites.json
          RCAP_BROWSER_BASE_URL: https://legalease-rcap-4feb8e94b3de-roger947s-projects.vercel.app
          RCAP_BROWSER_PREVIEW_DEPLOYMENT_ID: dpl_Eg2n58h38JhnU9uuXQ7Nk46QXGuL
          RCAP_BROWSER_APPLICATION_SHA: 4feb8e94b3dee4085fe05ea75d78853fe21e5097
          RCAP_BROWSER_ACCEPTANCE_PROJECT_REF: hyflxnlhpmiqxvvcoiia
          RCAP_BROWSER_WORKER_SOURCE_SHA: 16908485a94f475448657cea90583a4d352da9a3
          RCAP_BROWSER_WORKER_DIGEST: sha256:4f8c71c3630e6c110427d111518be149f3c74d46c856633fc5536a8065bc17af
          RCAP_BROWSER_EMAIL: mvl-demo-participant-a@rcap-acceptance.test
          RCAP_BROWSER_PASSWORD: ${{ secrets.HOSTED_CLINIC_DEMO_PASSWORD }}
          RCAP_BROWSER_ISSUE_CLINIC_CODE: '1'
          RCAP_BROWSER_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RCAP_BROWSER_VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          RCAP_BROWSER_PARTNER_SLUG: mvl-demo
          RCAP_BROWSER_CLINIC_EVENT_ID: 77000000-0000-4000-8000-000000000055
          RCAP_BROWSER_CLINIC_EVENT_SLUG: mississippi-volunteer-lawyers-demo
          RCAP_BROWSER_CLINIC_EVENT_NAME: Mississippi Volunteer Lawyers Clinic Mode Demo
          RCAP_BROWSER_ALLOW_MUTATION: '1'
          RCAP_BROWSER_CHROMIUM: /usr/bin/google-chrome
          RCAP_BROWSER_EVIDENCE_DIR: clinic-setup-only-evidence
        run: node scripts/verify-rcap-commercial-browser.mjs
      - name: Preserve actual setup-only result and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clinic-setup-only-${{ github.run_id }}
          path: clinic-setup-only-evidence/
          if-no-files-found: warn

