          const bytes=execFileSync('gh',['api','--method','GET',`repos/Roger-LegalEase/legalease-partner-dashboard-clean/actions/artifacts/${b.artifactId}/zip`],{maxBuffer:16777216,stdio:['ignore','pipe','ignore']});assert.equal(bytes.length,b.zipBytes);assert.equal(hash(bytes),b.zipSha256);fs.writeFileSync(process.env.RUNNER_TEMP+'/clinic-native.zip',bytes,{flag:'wx',mode:0o600});
          const run=execFileSync('gh',['api','--method','GET',`repos/Roger-LegalEase/legalease-partner-dashboard-clean/actions/runs/${b.creationRun}`],{maxBuffer:1048576,stdio:['ignore','pipe','ignore']});assert.equal(hash(JSON.stringify(JSON.parse(run))),b.runSha256);fs.writeFileSync(process.env.RUNNER_TEMP+'/clinic-native-run.json',run,{flag:'wx',mode:0o600});
