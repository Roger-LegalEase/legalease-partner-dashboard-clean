          printf '%s' "$WORKER_DIGEST_INPUT" | grep -Eq '^sha256:[0-9a-f]{64}$'  || { echo "::error::worker_digest is not the authorized value"; exit 1; }
          printf '%s' "$TOOLS_SHA_INPUT" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::tools_sha must be a full commit SHA"; exit 1; }
          [ "$APPLICATION_SHA_INPUT" = "e312a5efa7b4882e0fbf61a5ff0ae7891ac23226" ] || exit 1
          [ "$WORKER_SOURCE_SHA_INPUT" = "5e04eafd7eaed7e71722862e651fb787ebbd296d" ] || exit 1
          [ "$WORKER_DIGEST_INPUT" = "sha256:6b6a60fc5b2d0060028526013ce37c69f748e2cccb4cfb10943f2af6cf26cfe1" ] || exit 1
          [ "$TOOLS_SHA_INPUT" = "$WORKFLOW_SHA_INPUT" ] || { echo "::error::tools_sha must equal the workflow source SHA"; exit 1; }

