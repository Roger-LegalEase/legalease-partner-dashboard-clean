      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: carrier
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require the exact purpose dispatch and real carrier identity before credentials
