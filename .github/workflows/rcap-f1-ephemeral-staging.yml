name: RCAP F1 ephemeral staging
run-name: "RCAP F1 | ${{ inputs.mode || 'ephemeral' }} | tools ${{ inputs.tools_sha }} | app ${{ inputs.application_sha }} | cents ${{ inputs.expected_total_cents || '5000' }}"

# Captain-owned, manual only. This workflow REHEARSES STAGING ON A DISPOSABLE
# STACK AND NOTHING ELSE. The entire environment — Postgres, Auth, PostgREST,
# Storage, Kong, Mailpit, the application, the worker container — lives and
# dies inside this runner. It touches no hosted project, no persistent
# environment, no production surface, and it deploys nothing that outlives
# the run.
#
# Lane A supplies one exact full application SHA at dispatch. The reusable
# worker publication remains pinned, and the canonical-input equivalence gate
# below refuses that digest if the final candidate changes worker bytes.

#
# This workflow is also the DISPATCH ENTRY POINT for the persistent hosted
# acceptance environment. GitHub lists workflow_dispatch only for files that
# exist on the default branch, and pushing to main is Roger's decision, so the
# hosted workflow is reached through `mode` here and runs as a reusable
# workflow resolved from this run's own commit. `mode: ephemeral` — the
# default — behaves exactly as it always has.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "ephemeral | hosted_* (Vercel, including audit and reuse-only Checkout) | github_acceptance (temporary HTTPS fallback)"
        required: false
        type: choice
        options: [dtc_saved_fulfillment, dtc_stripe_pending_readonly, dtc_stripe_ingress_readonly, clinic_saved_readonly, dtc_saved_readonly, ordinary_admin_materials_start, ordinary_admin_configure_capacity, ordinary_admin_provision, ordinary_admin_readonly, clinic_vercel_readonly, clinic_owned_matter_packet, clinic_setup_only, clinic_prerequisites_only, clinic_owned_matter_readonly, configured_sandbox_preview, configured_sandbox_recover, production_hotfix, successor_nonproduction_closure, ephemeral, required_worker_delivery, hosted_preflight, hosted_vercel_identity, hosted_vercel_audit, hosted_migrate, hosted_clinic_migrate, hosted_legal_aid_migrate, hosted_clinic_deploy, hosted_managed_start_preview, hosted_clinic_preview, hosted_clinic_resume, hosted_legal_aid_browser, hosted_sponsor_cap, hosted_deploy, hosted_replace_preview, hosted_accept, hosted_stripe_retarget, hosted_checkout_gate, hosted_browser, hosted_payment, hosted_full, hosted_worker_contract, github_acceptance, production_preflight, production_restage, production_clinic_migrate, production_forward_chain_readback, production_forward_chain_migrate, production_legal_aid_keys_read, production_legal_aid_keys_create, production_legal_aid_readback, production_legal_aid_migrate, production_smoke, production_activate, production_worker_deploy, production_public_verify, production_save_transition_reproduce, production_save_transition_verify, production_live_zero_dollar_order, production_packet_canary]
        default: ephemeral
      clinic_attempt_id:
        description: "Owner-authorized Clinic attempt identity; required for clinic_setup_only, never reused"
        required: false
        type: string
        default: ""
      preview_hostname:
        description: "Exact existing Vercel Preview hostname to REUSE; supplying it forbids creating another deployment"
        required: false
        default: ""
      sponsor_case:
        description: "Existing authorized synthetic case: sponsored, exhausted, or final_slot (never historical Applicant A)"
        required: false
        type: string
        default: ""
      sponsor_fulfillment:
        description: "Require sponsored completion: read-only wait for separately authorized finalization, then generated proof (no worker launch)"
        required: false
        type: boolean
        default: false
      sponsor_items:
        description: "JSON array of one existing item, or two for final_slot; owner/matter/funding are read server-side"
        required: false
        type: string
        default: "[]"
      contradiction_job_id:
        description: "Exact packet_render_jobs id to diagnose (hosted_worker_contract only)"
        required: false
        type: string
        default: ""
      promotion_code:
        description: "Stripe promotion code entered on the hosted Checkout page (hosted_payment); empty runs the ordinary $50 order"
        required: false
        type: string
        default: ""
      journey_state:
        description: "Two-letter jurisdiction for the paid journey (hosted_payment); empty picks the first sellable route"
        required: false
        type: string
        default: ""
      expected_total_cents:
        description: "Hosted payment expected total in USD cents; required with promotion_code (0–4999). Blank without a code means 5000."
        required: false
        type: string
        default: ""
      resume_matter_id:
        description: "Existing matter for separately authorized recovery; packet canary resume never creates a matter or order"
        required: false
        type: string
        default: ""
      preview_creation_run_id:
        description: "Exact successful hosted_replace_preview creation run for read-only successor closure"
        required: false
        type: string
        default: ""
      preview_deployment_id:
        description: "Exact existing Vercel Preview deployment id; optional — resolved from preview_hostname when omitted"
        required: false
        type: string
        default: ""
      supabase_project_ref:
        description: "Acceptance Supabase project ref (hosted modes only)"
        required: false
        type: string
        default: ""
      application_sha:
        description: "Exact final application SHA supplied by Lane A"
        required: true
        type: string
      worker_source_sha:
        description: "Pinned worker source freeze SHA (must equal the authorized value)"
        required: true
        type: string
      worker_digest:
        description: "Pinned immutable worker digest (must equal the authorized value)"
        required: true
        type: string
      tools_sha:
        description: "Integration-branch commit carrying the F1 orchestration scripts (must be image-input-equivalent to the freeze)"
        required: true
        type: string
      clinic_resume_authorization:
        description: "Required for hosted_clinic_resume: exact owner resume authorization identifier"
        required: false
        type: string
        default: ""
      clinic_session_closure_authorization:
        description: "Required for hosted_clinic_resume: exact lost-cookie session closure authorization identifier"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: rcap-f1-ephemeral-staging
  cancel-in-progress: false

env:
  # Accepted successor: publication 36219916209, read-only image acceptance
  # 36247303667. Application and worker source share the exact af638b61 freeze.
  AUTHORIZED_WORKER_SOURCE_SHA: 5e04eafd7eaed7e71722862e651fb787ebbd296d
  AUTHORIZED_WORKER_DIGEST: sha256:6b6a60fc5b2d0060028526013ce37c69f748e2cccb4cfb10943f2af6cf26cfe1
  IMAGE_REPOSITORY: ghcr.io/roger-legalease/rcap-render-worker
  CANONICAL_INTEGRATION_BRANCH: captain-release
  STAGING_ENVIRONMENT_NAME: rcap-acceptance

jobs:
  dtc_saved_fulfillment:
    name: One controlled saved DTC fulfillment and conditional endpoint inverse
    if: inputs.mode == 'dtc_saved_fulfillment'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: read
    defaults:
      run:
        working-directory: admitted-controller
    env:
      APPLICATION_SHA_INPUT: ${{ inputs.application_sha }}
      WORKER_SOURCE_SHA_INPUT: ${{ inputs.worker_source_sha }}
      WORKER_DIGEST_INPUT: ${{ inputs.worker_digest }}
      TOOLS_SHA_INPUT: ${{ inputs.tools_sha }}
      ACCEPTANCE_SUPABASE_PROJECT_REF: ${{ inputs.supabase_project_ref }}
      RCAP_ADMITTED_CONTROLLER_SHA: 3bcfda1b814b7499d29cfa2817af2373493b68b6
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        path: carrier
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Require exact saved-case dispatch and frozen source closure before credentials
      working-directory: carrier
      env:
        DISPATCH_INPUTS: ${{ toJSON(inputs) }}
      run: |
        node --input-type=module <<'JS'
        import fs from'node:fs';import assert from'node:assert/strict';import{createHash}from'node:crypto';import{DTC,hash}from'./scripts/rcap-hosted-saved-dtc-contracts.mjs';
        assert.equal(process.env.GITHUB_REPOSITORY,'Roger-LegalEase/legalease-partner-dashboard-clean');assert.equal(process.env.GITHUB_ACTIONS,'true');assert.equal(process.env.GITHUB_EVENT_NAME,'workflow_dispatch');assert.equal(process.env.GITHUB_RUN_ATTEMPT,'1');assert.equal(process.env.GITHUB_REF_NAME,'codex/f-vercel-raw-readonly-20261026');assert.match(process.env.GITHUB_SHA,/^[a-f0-9]{40}$/);assert.equal(process.env.GITHUB_WORKFLOW_SHA,process.env.GITHUB_SHA);assert.equal(JSON.parse(fs.readFileSync('vercel.json')).git.deploymentEnabled[process.env.GITHUB_REF_NAME],false);
        const input=JSON.parse(process.env.DISPATCH_INPUTS);for(const[k,v]of Object.entries({mode:'dtc_saved_fulfillment',application_sha:DTC.app,tools_sha:DTC.tools,worker_source_sha:DTC.worker,worker_digest:DTC.digest,supabase_project_ref:DTC.project,preview_deployment_id:DTC.deploymentId,preview_hostname:new URL(DTC.origin).hostname,preview_creation_run_id:'40441747499'}))assert.equal(input[k],v);assert.equal(hash(input.resume_matter_id??''),hash(DTC.item));for(const k of ['clinic_attempt_id','contradiction_job_id','promotion_code','journey_state','expected_total_cents','clinic_resume_authorization','clinic_session_closure_authorization','sponsor_case'])assert(!input[k]);assert.equal(input.sponsor_items??'[]','[]');assert([undefined,false,'false'].includes(input.sponsor_fulfillment));
        JS
        node --input-type=module <<'JS'
        import fs from'node:fs';import assert from'node:assert/strict';import{createHash}from'node:crypto';for(const[file,pin]of Object.entries({"scripts/rcap-hosted-saved-dtc-controls.test.mjs":"b8fdb9d9c3d6cd06f4e178d36cdb7e6e424f6150304db098e4c2f771261cda38","scripts/rcap-hosted-saved-dtc-worker.mjs":"fd9c2791cb0f08e6acf7edcda6a96f8e71cbab25a760dcf0de3792d6b81c0916","scripts/rcap-hosted-saved-dtc-fulfillment.test.mjs":"7b72541649cce4f42e0a9ef8f55bbc766dd0b322e935bd2ec6008fbbd25fed14","scripts/rcap-hosted-saved-dtc-target.mjs":"2b00f45ee143029fd5780f5a41575a764c6c31bee15de87536bfb771dd83ecf0","scripts/rcap-hosted-saved-dtc-contracts.mjs":"6157d6b4669db26feb4976d99f2be9df62a56d8113005a0672ad3d8de9f4e416","scripts/rcap-hosted-saved-dtc-ports.mjs":"44270e387c753d7003f723cdd32bb836d2eca162a9f5639d4d55785b9480aa80","scripts/rcap-hosted-response-contract.mjs":"dd8c1eca0741df9ff8eb3013f99522ca38be6c55b6c650ecab4266623d433b44","scripts/rcap-hosted-saved-dtc-runtime.mjs":"74a3dbb50bbfc3875e0a3f226c8bb10a179bb30a7febc11cfdbb21c3d64a321c","scripts/rcap-hosted-saved-dtc-checkout-port.mjs":"e755a455f48ed903a543806994c63172ccaf1eaff53fea0fbc9b451bca5d0fc7","scripts/rcap-hosted-saved-dtc-credentials.mjs":"b0d9662511ae04fa0ca4da7f0341cecaefc10dadb62bd675eb92d6e09834e8fa","scripts/rcap-hosted-saved-dtc-runtime.test.mjs":"ed0edd54a2589651a50a54c03d8b56843b9d03cf29278ed83b3afc0fc11da856","scripts/rcap-hosted-saved-dtc-fulfillment.mjs":"58c967eaaa90ae3c16be47ec4e5403e61e017f7f087c8533e875000cb8d1772b","scripts/rcap-hosted-saved-dtc-entry.test.mjs":"88f6b6a238624a7a10e5205a9c71ff468efc3e44b638edefdc715444e33b482e","scripts/rcap-hosted-saved-dtc-target.test.mjs":"c810c1a6e46b565bd3ddeb72bb35cc476773e50f59fadc09e46d8764974e309a","scripts/rcap-saved-dtc-stripe-checkout-browser.mjs":"00fd574d3b8016a0cb543830f24afa63c88f2516db0500c203ede3602d23e596","scripts/rcap-hosted-saved-dtc-worker.test.mjs":"dbec9348f0bab6e77e06f118cd95daad18be5487eca71838f04f3d34fa853f70","scripts/rcap-hosted-consumer-purpose-release.mjs":"80caaa03662874ffdc43174578fe20ae28f14c0ab82686ba169cc3e96b402d99","scripts/rcap-hosted-configured-recovery-admission.mjs":"219bba287b324c65f124fe4c0d59b4b5fc125aef699ee41cefcea035a43c7e2b","scripts/dtc-readonly-native-binding.json":"bcd7621fc416adf59e6fbcaac39259815c95d491e6f9287743a8edef8517e6e4","scripts/rcap-hosted-saved-dtc-entry.mjs":"4f16de2bd9c17b4aade238c236615e7cfb8afae369419368bf93de741249801d","scripts/rcap-hosted-saved-dtc-final-pay-budget.test.mjs":"08627ab03aaea81ed79354667cfa7cd9aece0c5468f264b3083be112ff568426","scripts/rcap-hosted-existing-dtc-readonly-runner.mjs":"9203333edc36fdf28162e5f58cf2203460ff509d1df600758a940bdb51b6466e","scripts/rcap-hosted-saved-dtc-controls.mjs":"592a9d93519120822a3d35bc5c2836fee47948806db7dbf966ce2d6039885317","scripts/rcap-hosted-existing-dtc-continuation.mjs":"90d895dd9a0bb57dcc3ef5391d4dab08b6b125a06b864f7ff15ef759e6c9ddb6","scripts/paid-dtc-worker-once-preparation/GLOBAL-CLAIM-STATE.READONLY.NOT-EXECUTED.sql":"843475c818549d201ee5d16d765b8ba8a8d741d180130cad4bb5f3438456428a","scripts/paid-dtc-worker-once-preparation/paid-dtc-snapshot-ports.mjs":"c2bb750050643ae15146a725d143020e3e8195a871959c7afc87b9f96e159878","scripts/paid-dtc-worker-once-preparation/paid-dtc-worker-once.mjs":"307c3113311b2426c78ada9674e4d631e7d72f66e347687b289d7bf99e313555","scripts/paid-dtc-worker-once-preparation/GLOBAL-BUCKET-RPC-AGGREGATE.READONLY.NOT-EXECUTED.sql":"ff6f8fe32e6671746e0cbeffa8c676d11b7223aada7c187b78f7344abf1bd6b2","scripts/paid-dtc-worker-once-preparation/paid-dtc-gha-worker-ports.mjs":"57e78476e8a09e3b790ee1a9d9cdf017a04abc6497410420778c73d66819cc00","scripts/paid-dtc-worker-once-preparation/PAID-DTC-TARGET-JOIN.TEMPLATE.NOT-EXECUTED.sql":"7172e82cc895f21a0a16eab8f25ed54db78b7e74bba01bd2b3dcb040af1bab5e","scripts/paid-dtc-worker-once-preparation/paid-dtc-actual-target.mjs":"489203b2212d7729d7f6ef394e402bfce783b9463111b09583e30b8b80311d6e","scripts/paid-dtc-worker-once-preparation/paid-dtc-continuous-window.mjs":"881e38449b126504fdb85495b929d55dc0bc0caaf11411d8bfa5aea3a075916a","scripts/worker-once-preparation/GLOBAL-QUEUE-WINDOW-COMPLETENESS.TEMPLATE.NOT-EXECUTED.sql":"787c50a5971f5c2ea7aa82612f966750235681799277b1a6f4b72ebe6fd24684","scripts/worker-once-preparation/ordinary-worker-once.mjs":"1698a08e1047f87a3dff033ca2fea5138fbd8b8bc46ce757e324648c475c66e8","scripts/rcap-hosted-saved-dtc-historical-run.test.mjs":"dfcc55bfc64afa0e96daba2ece57f1a2cb1e320c63a5901310db4457a815a663","scripts/paid-dtc-worker-once-preparation/paid-dtc-retarget-operator.mjs":"9232a29347cc549865fbdaf3af68e155db0ad351d026bae5af21587107e6c112"}))assert.equal(createHash('sha256').update(fs.readFileSync(file)).digest('hex'),pin);
        JS
    - name: Bind actual source-frozen known-custody records before provider credentials
      working-directory: carrier
      id: window_guard
      run: |
        node --input-type=module <<'JS'
        import fs from'node:fs';import assert from'node:assert/strict';import{createHash}from'node:crypto';import{requireFrozenPaidWindow}from'./scripts/paid-dtc-worker-once-preparation/paid-dtc-continuous-window.mjs';
        const read=name=>{const file='scripts/'+name;assert(fs.existsSync(file)&&fs.existsSync(file.replace(/\.json$/,'.sha256')),'ACTUAL_ROOT_CUSTODY_RECORD_NOT_BOUND');const bytes=fs.readFileSync(file),sha=fs.readFileSync(file.replace(/\.json$/,'.sha256'),'utf8').trim();assert.match(sha,/^[a-f0-9]{64}$/);assert.equal(createHash('sha256').update(bytes).digest('hex'),sha);return{bytes,sha,value:JSON.parse(bytes)};};
        const record=read('dtc-controlled-window.json');requireFrozenPaidWindow(record.bytes,{expectedSha256:record.sha,phase:'before_retarget'});const custody=read('dtc-fulfillment-custody.json');assert.equal(custody.value.schemaVersion,'saved-dtc-root-custody/v1');assert.equal(custody.value.operator,'root');assert.equal(custody.value.windowReceiptSha256,record.sha);assert.match(custody.value.reconciliationReceiptSha256??'',/^[a-f0-9]{64}$/);
        JS
    - name: Verify existing literal credential source custody without execution or output
      working-directory: carrier
      run: |
        node --input-type=module <<'JS'
        import assert from'node:assert/strict';import{execFileSync}from'node:child_process';import{createHash}from'node:crypto';import{CREDENTIAL_SOURCE}from'./scripts/rcap-hosted-saved-dtc-credentials.mjs';execFileSync('git',['merge-base','--is-ancestor',CREDENTIAL_SOURCE.commit,'HEAD'],{stdio:'ignore'});const blob=execFileSync('git',['show',CREDENTIAL_SOURCE.commit+':'+CREDENTIAL_SOURCE.path],{stdio:['ignore','pipe','ignore']});assert.equal(createHash('sha256').update(blob).digest('hex'),CREDENTIAL_SOURCE.sha256);
        JS
    - uses: actions/checkout@v4
      with:
        ref: 3bcfda1b814b7499d29cfa2817af2373493b68b6
        path: admitted-controller
        fetch-depth: 0
        persist-credentials: false
    - name: Bind the exact native HELD controller bytes separately from the real carrier
      run: |
        node --input-type=module <<'JS'
        import fs from 'node:fs';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';import {execFileSync} from 'node:child_process';
        assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),'3bcfda1b814b7499d29cfa2817af2373493b68b6');assert.equal(process.env.RCAP_ADMITTED_CONTROLLER_SHA,'3bcfda1b814b7499d29cfa2817af2373493b68b6');
        for(const [name,hash]of Object.entries({"PENDING_WORKER_SUCCESSOR":"b0937504ea0b1d6fcc0a398c6b10ff1b4d65f56073dff8d06536164e8f41d5fd","RELEASE_CANDIDATE_BINDING":"b800680e224ee32c8cffd27cd986030c10456c971596b0f779c4abfdd65ca771","HOSTED_TOOLS_BINDING":"85ff48823cb51c23044e9913f34eea80481af71af2e1bee471b3e5b90c860045"}))assert.equal(createHash('sha256').update(fs.readFileSync('data/rcap-grade-a/launch-control/'+name+'.json')).digest('hex'),hash);
        JS

        node --input-type=module <<'JS'
        import fs from'node:fs';import assert from'node:assert/strict';import{createHash}from'node:crypto';
        assert.equal(createHash('sha256').update(fs.readFileSync('scripts/rcap-hosted-stripe-webhook-retarget.mjs')).digest('hex'),'e310942b6432e9ce8b7da48d774b86b9324a146d93f9280633d2954a5726b080');
        const b=JSON.parse(fs.readFileSync('data/rcap-grade-a/launch-control/RELEASE_CANDIDATE_BINDING.json'));assert.equal(b.status,'FORWARD_BOUND_HOSTED_PENDING');assert.equal(b.productionAuthorized,false);assert.equal(b.deploymentAuthorized,false);assert.equal(b.hostedAdmission,null);
        JS
    - name: Read only exact failed creator and successful recovery chain
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        node --input-type=module <<'JS'
        import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';
        const hash=b=>createHash('sha256').update(b).digest('hex'),b=JSON.parse(fs.readFileSync('scripts/dtc-readonly-native-binding.json'));
        for(const kind of ['creator','recovery']){const id=b[kind+'ArtifactId'];assert(Number.isSafeInteger(id)&&id>0);const bytes=execFileSync('gh',['api','--method','GET',`repos/Roger-LegalEase/legalease-partner-dashboard-clean/actions/artifacts/${id}/zip`],{maxBuffer:16777216,stdio:['ignore','pipe','ignore']});assert.equal(bytes.length,b[kind+'ZipBytes']);assert.equal(hash(bytes),b[kind+'ZipSha256']);fs.writeFileSync(process.env.RUNNER_TEMP+'/retarget-'+kind+'.zip',bytes,{flag:'wx',mode:0o600});const runBytes=execFileSync('gh',['api','--method','GET',`repos/Roger-LegalEase/legalease-partner-dashboard-clean/actions/runs/${b[kind==='creator'?'creationRun':'recoveryRun']}`],{maxBuffer:1048576,stdio:['ignore','pipe','ignore']});assert.equal(hash(JSON.stringify(JSON.parse(runBytes))),b[kind+'RunSha256']);fs.writeFileSync(process.env.RUNNER_TEMP+'/retarget-'+kind+'-run.json',runBytes,{flag:'wx',mode:0o600});}
        JS
        python3 - <<'PYCODE'
        import os,pathlib,json,zipfile,hashlib
        b=json.loads(pathlib.Path('scripts/dtc-readonly-native-binding.json').read_text());root=pathlib.Path(os.environ['RUNNER_TEMP'])
        for kind,name,pin in [('creator','deploy.json','creatorNativeSha256'),('recovery','configured-recovery.json','recoverySha256')]:
            with zipfile.ZipFile(root/('retarget-'+kind+'.zip')) as z:
                entry=z.getinfo(name);assert 0<entry.file_size<=2097152;raw=z.read(entry)
            assert hashlib.sha256(raw).hexdigest()==b[pin];p=root/('retarget-'+kind+'.json');p.write_bytes(raw);p.chmod(0o600)
        PYCODE
      working-directory: carrier
    - name: Protect exact native chain local file modes
      working-directory: carrier
      run: |
        node --input-type=module <<'JS'
        import fs from'node:fs';for(const name of ['creator','creator-run','recovery','recovery-run'])fs.chmodSync(process.env.RUNNER_TEMP+'/retarget-'+name+'.json',0o600);
        JS
    - name: Admit only the original failed creator plus accepted successful zero-create recovery
      working-directory: carrier
      env:
        DISPATCH_INPUTS: ${{ toJSON(inputs) }}
      run: |-
        node --input-type=module <<'JS'
        import fs from'node:fs';import assert from'node:assert/strict';import {admitDtcRecoveryChain,RECOVERY}from'./scripts/rcap-hosted-configured-recovery-admission.mjs';
        const binding=JSON.parse(fs.readFileSync('scripts/dtc-readonly-native-binding.json')),input=JSON.parse(process.env.DISPATCH_INPUTS),root=process.env.RUNNER_TEMP;
        const view=admitDtcRecoveryChain({binding,creatorBytes:fs.readFileSync(root+'/retarget-creator.json'),creatorRun:JSON.parse(fs.readFileSync(root+'/retarget-creator-run.json')),recoveryBytes:fs.readFileSync(root+'/retarget-recovery.json'),recoveryRun:JSON.parse(fs.readFileSync(root+'/retarget-recovery-run.json'))});
        assert.equal(view.creatorFailed,true);assert.equal(view.recoveryPassed,true);assert.equal(input.preview_creation_run_id,String(RECOVERY.creatorRun));assert.equal(binding.recoveryRun,40446715593);assert.equal(input.preview_hostname,new URL(binding.origin).hostname);assert.equal(input.preview_deployment_id,view.deployment.id);assert.equal(input.application_sha,view.applicationSha);assert.equal(input.supabase_project_ref,view.acceptanceProjectRef);
        console.log('Exact failed creator retained and successful zero-create recovery admitted for URL-only target identity; no customer or payment operation.');
        JS
    - name: Install immutable controller dependencies once without builds or browser installation
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        NEXT_TELEMETRY_DISABLED: '1'
      run: |
        npm ci
