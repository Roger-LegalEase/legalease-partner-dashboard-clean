name: RCAP F1 ephemeral staging
run-name: "RCAP F1 | ${{ inputs.mode || 'ephemeral' }} | tools ${{ inputs.tools_sha }} | app ${{ inputs.application_sha }} | cents ${{ inputs.expected_total_cents || '5000' }}"

# Captain-owned, manual only. This workflow REHEARSES STAGING ON A DISPOSABLE
# STACK AND NOTHING ELSE. The entire environment — Postgres, Auth, PostgREST,
# Storage, Kong, Mailpit, the application, the worker container — lives and
# dies inside this runner. It touches no hosted project, no persistent
# environment, no production surface, and it deploys nothing that outlives
# the run.
#
# Lane A supplies one exact full application SHA at dispatch. The reusable
# worker publication remains pinned, and the canonical-input equivalence gate
# below refuses that digest if the final candidate changes worker bytes.

#
# This workflow is also the DISPATCH ENTRY POINT for the persistent hosted
# acceptance environment. GitHub lists workflow_dispatch only for files that
# exist on the default branch, and pushing to main is Roger's decision, so the
# hosted workflow is reached through `mode` here and runs as a reusable
# workflow resolved from this run's own commit. `mode: ephemeral` — the
# default — behaves exactly as it always has.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "ephemeral | hosted_* (Vercel, including audit and reuse-only Checkout) | github_acceptance (temporary HTTPS fallback)"
        required: false
        type: choice
        options: [clinic_failed_job_recovery, ordinary_full_journey, clinic_saved_full_journey, dtc_saved_existing_fulfillment, ordinary_admin_launch_preflight_readonly, dtc_existing_session_no_pay_inspection, clinic_saved_recovery, ordinary_admin_start_only, dtc_existing_session_readonly, clinic_unverified_draft_save, dtc_saved_fulfillment, dtc_stripe_pending_readonly, dtc_stripe_ingress_readonly, clinic_saved_readonly, dtc_saved_readonly, ordinary_admin_materials_start, ordinary_admin_configure_capacity, ordinary_admin_provision, ordinary_admin_readonly, clinic_vercel_readonly, clinic_owned_matter_packet, clinic_setup_only, clinic_prerequisites_only, clinic_owned_matter_readonly, configured_sandbox_preview, configured_sandbox_recover, production_hotfix, successor_nonproduction_closure, ephemeral, required_worker_delivery, hosted_preflight, hosted_vercel_identity, hosted_vercel_audit, hosted_migrate, hosted_clinic_migrate, hosted_legal_aid_migrate, hosted_clinic_deploy, hosted_managed_start_preview, hosted_clinic_preview, hosted_clinic_resume, hosted_legal_aid_browser, hosted_sponsor_cap, hosted_deploy, hosted_replace_preview, hosted_accept, hosted_stripe_retarget, hosted_checkout_gate, hosted_browser, hosted_payment, hosted_full, hosted_worker_contract, github_acceptance, production_preflight, production_restage, production_clinic_migrate, production_forward_chain_readback, production_forward_chain_migrate, production_legal_aid_keys_read, production_legal_aid_keys_create, production_legal_aid_readback, production_legal_aid_migrate, production_smoke, production_activate, production_worker_deploy, production_public_verify, production_save_transition_reproduce, production_save_transition_verify, production_live_zero_dollar_order, production_packet_canary]
        default: ephemeral
      ordinary_full_control_binding_sha256:
        description: "Exact actual ordinary Start and fresh controls binding; NULL remains held"
        required: false
        type: string
        default: ""
      clinic_worker_control_binding_sha256:
        description: "Exact captain-frozen actual Clinic worker-control binding SHA256 (Clinic full journey only)"
        required: false
        type: string
        default: ""
      clinic_attempt_id:
        description: "Owner-authorized Clinic attempt identity; required for clinic_setup_only, never reused"
        required: false
        type: string
        default: ""
      preview_hostname:
        description: "Exact existing Vercel Preview hostname to REUSE; supplying it forbids creating another deployment"
        required: false
        default: ""
      sponsor_case:
        description: "Existing authorized synthetic case: sponsored, exhausted, or final_slot (never historical Applicant A)"
        required: false
        type: string
        default: ""
      sponsor_fulfillment:
        description: "Require sponsored completion: read-only wait for separately authorized finalization, then generated proof (no worker launch)"
        required: false
        type: boolean
        default: false
      sponsor_items:
        description: "JSON array of one existing item, or two for final_slot; owner/matter/funding are read server-side"
        required: false
        type: string
        default: "[]"
      contradiction_job_id:
        description: "Exact packet_render_jobs id to diagnose (hosted_worker_contract only)"
        required: false
        type: string
        default: ""
      promotion_code:
        description: "Stripe promotion code entered on the hosted Checkout page (hosted_payment); empty runs the ordinary $50 order"
        required: false
        type: string
        default: ""
      journey_state:
        description: "Two-letter jurisdiction for the paid journey (hosted_payment); empty picks the first sellable route"
        required: false
        type: string
        default: ""
      expected_total_cents:
        description: "Hosted payment expected total in USD cents; required with promotion_code (0–4999). Blank without a code means 5000."
        required: false
        type: string
        default: ""
      resume_matter_id:
        description: "Existing matter for separately authorized recovery; packet canary resume never creates a matter or order"
        required: false
        type: string
        default: ""
      preview_creation_run_id:
        description: "Exact successful hosted_replace_preview creation run for read-only successor closure"
        required: false
        type: string
        default: ""
      preview_deployment_id:
        description: "Exact existing Vercel Preview deployment id; optional — resolved from preview_hostname when omitted"
        required: false
        type: string
        default: ""
      supabase_project_ref:
        description: "Acceptance Supabase project ref (hosted modes only)"
        required: false
        type: string
        default: ""
      application_sha:
        description: "Exact final application SHA supplied by Lane A"
        required: true
        type: string
      worker_source_sha:
        description: "Pinned worker source freeze SHA (must equal the authorized value)"
        required: true
        type: string
      worker_digest:
        description: "Pinned immutable worker digest (must equal the authorized value)"
        required: true
        type: string
      tools_sha:
        description: "Integration-branch commit carrying the F1 orchestration scripts (must be image-input-equivalent to the freeze)"
        required: true
        type: string
      clinic_resume_authorization:
        description: "Required for hosted_clinic_resume: exact owner resume authorization identifier"
        required: false
        type: string
        default: ""
      clinic_session_closure_authorization:
        description: "Required for hosted_clinic_resume: exact lost-cookie session closure authorization identifier"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: rcap-f1-ephemeral-staging
  cancel-in-progress: false

env:
  # Accepted successor: publication 36219916209, read-only image acceptance
  # 36247303667. Application and worker source share the exact af638b61 freeze.
  AUTHORIZED_WORKER_SOURCE_SHA: 5e04eafd7eaed7e71722862e651fb787ebbd296d
  AUTHORIZED_WORKER_DIGEST: sha256:6b6a60fc5b2d0060028526013ce37c69f748e2cccb4cfb10943f2af6cf26cfe1
  IMAGE_REPOSITORY: ghcr.io/roger-legalease/rcap-render-worker
  CANONICAL_INTEGRATION_BRANCH: captain-release
  STAGING_ENVIRONMENT_NAME: rcap-acceptance

jobs:
  clinic_failed_job_recovery:
    name: Run one admitted lifecycle step for the fixed Clinic job
    if: inputs.mode == 'clinic_failed_job_recovery'
    permissions:
      contents: read
      actions: read
      packages: read
