          assert.equal(price?.unit_amount, 5000);
          assert.equal(price?.currency, 'usd');
          assert.equal(price?.type, 'one_time');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `product_id=${productId}\n`);
          console.log(`Existing test catalog verified: ${productId}, ${price.id}; GET only.`);
