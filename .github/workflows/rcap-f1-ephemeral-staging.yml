name: RCAP F1 ephemeral staging

# Captain-owned, manual only. This workflow REHEARSES STAGING ON A DISPOSABLE
# STACK AND NOTHING ELSE. The entire environment — Postgres, Auth, PostgREST,
# Storage, Kong, Mailpit, the application, the worker container — lives and
# dies inside this runner. It touches no hosted project, no persistent
# environment, no production surface, and it deploys nothing that outlives
# the run.
#
# Every input is pinned: the run refuses any application SHA, worker source
# SHA or digest other than the authorized values, so this cannot be repointed
# at other bytes without editing the workflow on the default branch.

#
# This workflow is also the DISPATCH ENTRY POINT for the persistent hosted
# acceptance environment. GitHub lists workflow_dispatch only for files that
# exist on the default branch, and pushing to main is Roger's decision, so the
# hosted workflow is reached through `mode` here and runs as a reusable
# workflow resolved from this run's own commit. `mode: ephemeral` — the
# default — behaves exactly as it always has.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "ephemeral | hosted_* — hosted_payment is the only Stripe-transacting phase; the two *_environment_probe phases are read-only"
        required: false
        type: choice
        options: [ephemeral, hosted_preflight, hosted_vercel_audit, hosted_environment_probe, hosted_migrate, hosted_deploy, hosted_accept, hosted_full_nonpayment, hosted_checkout_pinning, hosted_worker_contract, hosted_payment_environment_probe, hosted_payment]
        default: ephemeral
      preview_hostname:
        description: "Exact existing Vercel Preview hostname to REUSE; supplying it forbids creating another deployment"
        required: false
        default: ""
      contradiction_job_id:
        description: "Exact packet_render_jobs id to diagnose (hosted_worker_contract only)"
        required: false
        type: string
        default: ""
      preview_deployment_id:
        description: "Exact existing Vercel Preview deployment id; optional — resolved from preview_hostname when omitted"
        required: false
        type: string
        default: ""
      supabase_project_ref:
        description: "Acceptance Supabase project ref (hosted modes only)"
        required: false
        type: string
        default: ""
      application_sha:
        description: "Pinned application SHA (must equal the authorized value)"
        required: true
        type: string
      worker_source_sha:
        description: "Pinned worker source freeze SHA (must equal the authorized value)"
        required: true
        type: string
      worker_digest:
        description: "Pinned immutable worker digest (must equal the authorized value)"
        required: true
        type: string
      tools_sha:
        description: "PROVENANCE LABEL ONLY — must equal the reviewed control-plane SHA (github.sha / job.workflow_sha). It is NOT a checkout ref and NOT executable authority: nothing is ever checked out from it. The former 6d9e8792 value is no longer valid and is refused."
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: rcap-f1-ephemeral-staging
  cancel-in-progress: false

env:
  AUTHORIZED_APPLICATION_SHA: f7ed0ad3a8f37a0c1446b62760b1a36fb163c926
  AUTHORIZED_WORKER_SOURCE_SHA: 5ac0d8d6910aec3dc6259b2d4da6931abc5af7e8
  AUTHORIZED_WORKER_DIGEST: sha256:4e5b58e4492289446bcbdd100bb39dcd13dd4512916679fa2a252e4532ab9530
  IMAGE_REPOSITORY: ghcr.io/roger-legalease/rcap-render-worker
  CANONICAL_INTEGRATION_BRANCH: main
  STAGING_ENVIRONMENT_NAME: rcap-acceptance

jobs:
  # ---------------------------------------------------------------------------
  # ENV-007 C5 — EXACT DISPATCH ROUTING.
  #
  # Routing was `if: startsWith(inputs.mode, 'hosted_')` plus a chained
  # `&&`/`||` expression that ended in `|| 'preflight'`. Two consequences:
  #
  #   1. any unrecognised value beginning with `hosted_` reached the hosted
  #      workflow, and
  #   2. it arrived as `preflight` — a real phase, with real credentials — so an
  #      unknown mode did not refuse, it silently ran the weakest thing.
  #
  # That expression is also what GitHub's parser rejected: it carried nine
  # opening and ten closing parentheses, so the workflow file was invalid.
  #
  # Routing is now an exact map with no default. Every mode is either named or
  # refused, and no path reaches `preflight` except the mode that asks for it.
  # A refusal here fails the job, so `hosted` and `f1` — which both need it —
  # are never scheduled, and no readonly, protected or payment job starts.
  # ---------------------------------------------------------------------------
  route:
    name: Exact dispatch routing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target: ${{ steps.map.outputs.target }}
      phase: ${{ steps.map.outputs.phase }}
    steps:
      # ENV-007 C7 / F1 — IMMUTABLE EXECUTION AUTHORITY (caller).
      #
      # First executable step, ahead of checkout, setup, secrets and any external
      # request. RCAP_AUTHORIZED_INFRASTRUCTURE_SHA and RCAP_AUTHORIZED_EXECUTION_REF
      # are NON-SECRET configuration, neither is created by this change, and an
      # unconfigured authority is a refusal rather than a pass.
      #
      # F1 CORRECTION. The previous gate compared a workflow-SHA property on the
      # `github` context that GitHub does not define; it resolved to the empty
      # string and the old comparison skipped on empty, so the gate asserted
      # nothing. The documented `github.workflow_sha` is used instead, and every
      # comparison here is unconditional.
      - name: Validate the execution authority before checkout, setup or secrets
        id: execution_authority
        env:
          OBSERVED_SHA: ${{ github.sha }}
          OBSERVED_REF: ${{ github.ref }}
          OBSERVED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_SHA: ${{ vars.RCAP_AUTHORIZED_INFRASTRUCTURE_SHA }}
          EXPECTED_REF: ${{ vars.RCAP_AUTHORIZED_EXECUTION_REF }}
        run: |
          set -uo pipefail
          fail=0
          note() { echo "  - $1"; fail=1; }
          present() {
            if [ -z "${2:-}" ]; then note "$1 is missing or empty"; return 1; fi
            return 0
          }
          equal() {
            present "$1" "${2:-}" || return 1
            if [ "$2" != "$3" ]; then note "$1 is '${2}'; expected '${3}'"; return 1; fi
            return 0
          }
          echo "INFRASTRUCTURE EXECUTION AUTHORITY (caller)"
          present "RCAP_AUTHORIZED_INFRASTRUCTURE_SHA" "${EXPECTED_SHA:-}" || true
          present "RCAP_AUTHORIZED_EXECUTION_REF"      "${EXPECTED_REF:-}" || true
          if [ -n "${EXPECTED_SHA:-}" ]; then
            printf '%s' "${EXPECTED_SHA}" | grep -Eq '^[0-9a-f]{40}$'               || note "RCAP_AUTHORIZED_INFRASTRUCTURE_SHA is not a full commit SHA"
            equal "github.sha"          "${OBSERVED_SHA:-}"          "${EXPECTED_SHA}" || true
            equal "github.workflow_sha" "${OBSERVED_WORKFLOW_SHA:-}" "${EXPECTED_SHA}" || true
          else
            present "github.sha"          "${OBSERVED_SHA:-}"          || true
            present "github.workflow_sha" "${OBSERVED_WORKFLOW_SHA:-}" || true
          fi
          if [ -n "${EXPECTED_REF:-}" ]; then
            equal "github.ref" "${OBSERVED_REF:-}" "${EXPECTED_REF}" || true
          else
            present "github.ref" "${OBSERVED_REF:-}" || true
          fi
          if [ "$fail" -ne 0 ]; then
            echo "::error::INFRASTRUCTURE_EXECUTION_AUTHORITY_INVALID"
            echo "INFRASTRUCTURE_EXECUTION_AUTHORITY_INVALID"
            exit 1
          fi
          echo "  ok   github.sha=$OBSERVED_SHA"
          echo "  ok   github.workflow_sha=$OBSERVED_WORKFLOW_SHA"
          echo "  ok   github.ref=$OBSERVED_REF"
          echo "  ok   caller execution authority validated"

      - name: Map the dispatch mode to exactly one target
        id: map
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -uo pipefail
          # RETIRED AND RENAMED VALUES. A `choice` input rejects an unlisted
          # value, but a stale bookmark, a legacy caller or an API dispatch
          # against an older workflow revision can still present one. Each of
          # these enters the refusal path and nothing else.
          case "$MODE" in
            github_acceptance)
              echo "::error::GITHUB_ACCEPTANCE_RETIRED"
              echo "GITHUB_ACCEPTANCE_RETIRED"
              echo "Use hosted_payment for payment-producing acceptance."
              exit 1 ;;
            hosted_full|full)
              echo "::error::LEGACY_MODE_REFUSED: '$MODE' implied a payment-exercising run. Use hosted_full_nonpayment, or hosted_payment when payment must actually be exercised."
              echo "LEGACY_MODE_REFUSED"
              exit 1 ;;
            hosted_checkout_gate|checkout_gate)
              echo "::error::LEGACY_MODE_REFUSED: '$MODE' read as a real Checkout Session test. Use hosted_checkout_pinning for the static verification, or hosted_payment to create a real Sandbox Session."
              echo "LEGACY_MODE_REFUSED"
              exit 1 ;;
          esac
          # THE EXACT ACCEPTED SET. No prefix test, no fallthrough, no default.
          case "$MODE" in
            ephemeral|"")                     TARGET=ephemeral; PHASE=none ;;
            hosted_preflight)                 TARGET=hosted;    PHASE=preflight ;;
            hosted_vercel_audit)              TARGET=hosted;    PHASE=vercel_audit ;;
            hosted_environment_probe)         TARGET=hosted;    PHASE=environment_probe ;;
            hosted_migrate)                   TARGET=hosted;    PHASE=migrate ;;
            hosted_deploy)                    TARGET=hosted;    PHASE=deploy ;;
            hosted_accept)                    TARGET=hosted;    PHASE=accept ;;
            hosted_full_nonpayment)           TARGET=hosted;    PHASE=full_nonpayment ;;
            hosted_checkout_pinning)          TARGET=hosted;    PHASE=checkout_pinning ;;
            hosted_worker_contract)           TARGET=hosted;    PHASE=worker_contract ;;
            hosted_payment_environment_probe) TARGET=hosted;    PHASE=payment_environment_probe ;;
            hosted_payment)                   TARGET=hosted;    PHASE=payment ;;
            *)
              echo "::error::UNKNOWN_MODE_REFUSED: '$MODE' is not an accepted dispatch mode. Refusing rather than defaulting to a weaker phase."
              echo "UNKNOWN_MODE_REFUSED"
              exit 1 ;;
          esac
          # Belt and braces: the mapped phase must itself be one the hosted
          # workflow declares, so a future edit that mistypes a phase refuses
          # here instead of arriving as an unknown phase inside a protected job.
          case "$PHASE" in
            none|preflight|vercel_audit|environment_probe|migrate|deploy|accept|full_nonpayment|checkout_pinning|worker_contract|payment_environment_probe|payment) ;;
            *) echo "::error::UNKNOWN_MODE_REFUSED: mode '$MODE' mapped to unrecognised phase '$PHASE'"; exit 1 ;;
          esac
          {
            echo "target=$TARGET"
            echo "phase=$PHASE"
          } >> "$GITHUB_OUTPUT"
          echo "mode='$MODE' target=$TARGET phase=$PHASE"

  # RETIRED — github_acceptance.
  #
  # It ran the frozen application on the runner behind a cloudflared HTTPS
  # tunnel and held that host open for a real, human-completed Stripe Sandbox
  # payment. That IS a case hosted_payment does not reproduce: hosted_payment
  # signs its own completion event rather than waiting for a person to pay.
  #
  # It is retired anyway, because it was a payment-producing journey outside the
  # payment environment, and the owner decision is that only hosted_payment may
  # transact. The unique case is not moved here: route it through hosted_payment,
  # whose reuse-only Checkout step already prepares one real unpaid Sandbox
  # Session against a stable Vercel Preview host that a person can pay.
  #
  # The job is removed rather than disabled so no caller exists, and `route`
  # above refuses the name before any job that holds a secret is scheduled.

  hosted:
    name: Persistent hosted acceptance staging
    needs: route
    if: needs.route.outputs.target == 'hosted'
    uses: ./.github/workflows/rcap-hosted-acceptance-staging.yml
    with:
      phase: ${{ needs.route.outputs.phase }}
      preview_hostname: ${{ inputs.preview_hostname }}
      preview_deployment_id: ${{ inputs.preview_deployment_id }}
      contradiction_job_id: ${{ inputs.contradiction_job_id }}
      application_sha: ${{ inputs.application_sha }}
      worker_source_sha: ${{ inputs.worker_source_sha }}
      worker_digest: ${{ inputs.worker_digest }}
      tools_sha: ${{ inputs.tools_sha }}
      supabase_project_ref: ${{ inputs.supabase_project_ref }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # The Stripe test secrets are NOT forwarded and the hosted workflow no
      # longer declares them as workflow_call secrets. They are read from the
      # rcap-acceptance-payment environment by the hosted_payment job alone, so
      # this dispatch entry point — which has no environment — never holds them.
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

  f1:
    name: Ephemeral F1 staging rehearsal (rcap-ci-staging)
    needs: route
    if: needs.route.outputs.target == 'ephemeral'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Refuse any input that is not the authorized pinned value
        env:
          APPLICATION_SHA_INPUT: ${{ inputs.application_sha }}
          WORKER_SOURCE_SHA_INPUT: ${{ inputs.worker_source_sha }}
          WORKER_DIGEST_INPUT: ${{ inputs.worker_digest }}
          TOOLS_SHA_INPUT: ${{ inputs.tools_sha }}
        run: |
          set -euo pipefail
          [ "$APPLICATION_SHA_INPUT" = "$AUTHORIZED_APPLICATION_SHA" ] || { echo "::error::application_sha is not the authorized value"; exit 1; }
          [ "$WORKER_SOURCE_SHA_INPUT" = "$AUTHORIZED_WORKER_SOURCE_SHA" ] || { echo "::error::worker_source_sha is not the authorized value"; exit 1; }
          [ "$WORKER_DIGEST_INPUT" = "$AUTHORIZED_WORKER_DIGEST" ] || { echo "::error::worker_digest is not the authorized value"; exit 1; }
          printf '%s' "$TOOLS_SHA_INPUT" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::tools_sha must be a full commit SHA"; exit 1; }

      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify ancestry and image-input equivalence of every pinned SHA
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CANONICAL_INTEGRATION_BRANCH"
          for SHA in "${{ inputs.application_sha }}" "${{ inputs.worker_source_sha }}" "${{ inputs.tools_sha }}"; do
            git cat-file -e "${SHA}^{commit}" || { echo "::error::$SHA does not resolve"; exit 1; }
            git merge-base --is-ancestor "$SHA" "origin/$CANONICAL_INTEGRATION_BRANCH" || { echo "::error::$SHA is outside the canonical integration history"; exit 1; }
          done
          # The tools commit must carry the exact application and worker bytes:
          # if this diff is empty, building once at tools_sha builds the pinned
          # application SHA's bytes, and the worker fingerprint is unchanged.
          # ENV-007 C1 — tools_sha is a LABEL, never a checkout target. The
          # detach that used to stand here made a caller-supplied commit the
          # executable authority for this whole job, so naming the superseded
          # 6d9e8792 orchestration commit would have been obeyed. The rehearsal
          # now runs the reviewed bytes it was dispatched from, and tools_sha is
          # accepted only when it names exactly those bytes.
          [ "${{ inputs.tools_sha }}" = "${{ github.sha }}" ] \
            || { echo "::error::INFRASTRUCTURE_EXECUTION_AUTHORITY_INVALID"; echo "tools_sha must name this run's own commit ${{ github.sha }}; it is a label, not a checkout target"; exit 1; }
          # Worker image-input equivalence is per file, from the canonical
          # manifest, not a whole-directory diff over scripts/lib and src.
          node scripts/rcap-worker-image-input-manifest.mjs --check

      - name: Authenticate to GHCR and pull the worker by immutable digest
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin \
            || { echo "::error::GHCR authentication failed"; exit 1; }
          REF="$IMAGE_REPOSITORY@$AUTHORIZED_WORKER_DIGEST"
          docker pull "$REF" || { echo "::error::pull by immutable digest failed"; exit 1; }
          ACTUAL="$(docker inspect --format='{{index .RepoDigests 0}}' "$REF" | sed 's/.*@//')"
          [ "$ACTUAL" = "$AUTHORIZED_WORKER_DIGEST" ] || { echo "::error::pulled digest $ACTUAL differs from authorized digest"; exit 1; }
          echo "Pulled $REF (digest verified; the mutable tag was never used)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Start the disposable Supabase stack (runner-local only)
        run: |
          set -euo pipefail
          npm install -g supabase@2
          supabase init --force >/dev/null
          # Only the required services: Postgres, Auth, PostgREST, Storage,
          # Kong, and the mail catcher. Everything binds to the runner's
          # loopback; no port is exposed beyond this machine.
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta
          supabase status -o env > /tmp/supabase.env
          cat /tmp/supabase.env | sed 's/KEY=.*/KEY=***REDACTED***/' || true

      - name: Apply the six-migration sequence and run the stack-integration matrix
        run: |
          set -euo pipefail
          set -a; source /tmp/supabase.env; set +a
          export F1_SUPABASE_URL="${API_URL:-http://127.0.0.1:54321}"
          export F1_DB_URL="${DB_URL:-postgresql://postgres:postgres@127.0.0.1:54322/postgres}"
          export F1_ANON_KEY="${ANON_KEY}"
          export F1_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY}"
          export F1_MAILPIT_API="${INBUCKET_URL:-http://127.0.0.1:54324}/api/v1"
          export F1_WORKER_DIGEST_REF="$IMAGE_REPOSITORY@$AUTHORIZED_WORKER_DIGEST"

          # The application at the pinned SHA, delivery route disabled.
          export NEXT_PUBLIC_SUPABASE_URL="$F1_SUPABASE_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$F1_ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$F1_SERVICE_ROLE_KEY"
          export SUPABASE_URL="$F1_SUPABASE_URL"
          export STRIPE_SECRET_KEY="sk_test_f1_ephemeral_dummy"
          export STRIPE_WEBHOOK_SECRET="whsec_f1_ephemeral_dummy"
          npm run build
          unset RCAP_CONSUMER_DELIVERY_ROUTE_STATE || true
          nohup npx next start -p 3000 > /tmp/app-disabled.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3000/ && break; sleep 2; done

          export F1_APP_URL="http://127.0.0.1:3000"
          export F1_FLIP_CMD='pkill -f "next start" || true; sleep 2; RCAP_CONSUMER_DELIVERY_ROUTE_STATE=staging_scoped RCAP_CONSUMER_DELIVERY_STAGING_SCOPE=f1-scope-1,f1-scope-2 nohup npx next start -p 3000 > /tmp/app-scoped.log 2>&1 & for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3000/ && break; sleep 2; done'
          export F1_ROLLBACK_CMD='pkill -f "next start" || true; sleep 2; nohup npx next start -p 3000 > /tmp/app-rolledback.log 2>&1 & for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3000/ && break; sleep 2; done'

          node scripts/f1-ephemeral-staging-stack.mjs

      - name: Run the deep behavioural matrix (repository battery on the runner)
        run: |
          set -euo pipefail
          node scripts/verify-rcap-phase52-consumer-payment-authority.mjs
          node scripts/verify-rcap-phase53-consumer-job-binding.mjs
          node scripts/verify-rcap-phase51-consumer-payment-security.mjs
          node scripts/verify-expungement-consumer-payment-http.mjs
          node scripts/verify-rcap-consumer-person-namespace.mjs
          node scripts/verify-rcap-packet-delivery-db.mjs
          node scripts/verify-rcap-render-worker-delivery.mjs
          node scripts/verify-rcap-packet-delivery-e2e.mjs

      - name: Collect sanitized evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p f1-evidence
          for f in /tmp/app-disabled.log /tmp/app-scoped.log /tmp/app-rolledback.log; do
            [ -f "$f" ] && sed -E 's/(key|token|secret|password)[^ ]*/\1=***REDACTED***/Ig' "$f" > "f1-evidence/$(basename "$f")" || true
          done
          echo "{\"stagingEnvironmentName\":\"$STAGING_ENVIRONMENT_NAME\",\"applicationSha\":\"${{ inputs.application_sha }}\",\"workerSourceSha\":\"${{ inputs.worker_source_sha }}\",\"workerDigest\":\"$AUTHORIZED_WORKER_DIGEST\",\"toolsSha\":\"${{ inputs.tools_sha }}\",\"runId\":\"${{ github.run_id }}\"}" > f1-evidence/f1-run-identity.json

      - name: Upload the F1 evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcap-f1-evidence-${{ github.run_id }}
          path: f1-evidence/
          if-no-files-found: error

      - name: Destroy the disposable stack
        if: always()
        run: |
          pkill -f "next start" || true
          docker rm -f f1-worker 2>/dev/null || true
          supabase stop --no-backup || true
