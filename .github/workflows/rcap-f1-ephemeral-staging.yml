            || process.env.ACCEPTANCE_SUPABASE_PROJECT_REF !== 'hyflxnlhpmiqxvvcoiia'
            || !process.env.GITHUB_ENV) throw new Error('DS08_CONTINUITY_RUNNER_TARGET_REQUIRED');
          const names = [
            'HOSTED_LEGAL_AID_RESTRICTED_FIELD_KEY',
            'HOSTED_LEGAL_AID_RESTRICTED_FIELD_KEY_VERSION',
            'HOSTED_PARTICIPANT_PRIVACY_PSEUDONYM_SECRET'
          ];
          let values = names.map(name => process.env[name] ?? '');
          const present = values.filter(value => value !== '').length;
          if (present !== 0 && present !== names.length) throw new Error('DS08_CONTINUITY_PARTIAL_PRESERVED_INPUTS');
          if (present === 0) {
            const password = process.env.HOSTED_CLINIC_DEMO_PASSWORD ?? '';
            if (password.length < 20) throw new Error('DS08_CONTINUITY_DEMO_PASSWORD_TOO_SHORT');
            values = [
              createHmac('sha256', password)
                .update('rcap-acceptance-server-secret:hyflxnlhpmiqxvvcoiia:legal-aid-restricted-field-key/v1').digest('base64'),
              'v1',
              createHmac('sha256', password)
                .update('rcap-acceptance-server-secret:hyflxnlhpmiqxvvcoiia:participant-privacy-pseudonym-secret/v1').digest('base64url')
            ];
          }
          // Register masks before writing any value. Escape workflow-command
          // metacharacters so even explicit multiline inputs cannot inject logs.
          for (const value of values) {
            console.log('::add-mask::' + value.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A'));
          }
          for (let i = 0; i < names.length; i++) {
            let delimiter;
            do { delimiter = 'DS08_' + randomUUID(); } while (values[i].includes(delimiter));
            appendFileSync(process.env.GITHUB_ENV, names[i] + '<<' + delimiter + '\n' + values[i] + '\n' + delimiter + '\n');
          }
          NODE

      - name: Create the single isolated Preview with the unchanged admitted deployer
        env:
          PHASE_INPUT: clinic_deploy
          APPLICATION_SHA_INPUT: 4feb8e94b3dee4085fe05ea75d78853fe21e5097
          WORKER_SOURCE_SHA_INPUT: 16908485a94f475448657cea90583a4d352da9a3
          WORKER_DIGEST_INPUT: sha256:4f8c71c3630e6c110427d111518be149f3c74d46c856633fc5536a8065bc17af
          TOOLS_SHA_INPUT: 9fe0ea17727339755c10e73c06adb34215ba2a0e
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ACCEPTANCE_SUPABASE_PROJECT_REF: hyflxnlhpmiqxvvcoiia
          HOSTED_APPLICATION_SHA: 4feb8e94b3dee4085fe05ea75d78853fe21e5097
          HOSTED_ISOLATED_CLINIC_PREVIEW: 'true'
          HOSTED_ROUTE_STATE: staging_scoped
          HOSTED_STAGING_SCOPE: e7c1d76e-dcf2-4d41-b585-ba164806f391,255998e1-eb69-4239-b151-0f8b8935a539
          HOSTED_EXISTING_PARTICIPANT_ONLY: 'true'
          HOSTED_CLINIC_DEMO_MODE: mississippi_preview
          HOSTED_CLINIC_DEMO_PASSWORD: ${{ secrets.HOSTED_CLINIC_DEMO_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          HOSTED_STRIPE_TEST_SECRET: ''
