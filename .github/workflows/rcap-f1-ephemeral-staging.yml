      - name: Stage captain-frozen recovery controls and accepted native evidence privately
        env:
          CLINIC_RECOVERY_MODE: 'true'
          CLINIC_WORKER_CONTROL_ARCHIVE_B64: ${{ secrets.CLINIC_WORKER_CONTROL_ARCHIVE_B64 }}
          CLINIC_WORKER_CONTROL_BINDING_SHA256: ${{ inputs.clinic_worker_control_binding_sha256 }}
        run: python3 scripts/clinic-worker-once-preparation/stage-clinic-controls.py
      - name: Run one admitted fixed Clinic lifecycle step
        env:
          DISPATCH_INPUTS: ${{ toJSON(inputs) }}
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          HOSTED_CLINIC_DEMO_PASSWORD: ${{ secrets.HOSTED_CLINIC_DEMO_PASSWORD }}
          CLINIC_NATIVE_DEPLOY_FILE: ${{ runner.temp }}/clinic-native-deploy.json
          CLINIC_NATIVE_RUN_FILE: ${{ runner.temp }}/clinic-native-run.json
          CLINIC_RECOVERY_PUBLICATION_FILE: ${{ runner.temp }}/clinic-recovery-publication.json
          CLINIC_RECOVERY_PUBLICATION_RUN_FILE: ${{ runner.temp }}/clinic-recovery-publication-run.json
          CLINIC_RECOVERY_IMAGE_QUALIFICATION_FILE: ${{ github.workspace }}/clinic-worker-input/image-qualification.json
          CLINIC_RECOVERY_FAILED_STATE_FILE: ${{ github.workspace }}/clinic-worker-input/failed-state.json
          CLINIC_WORKER_CONTROL_BINDING_FILE: ${{ github.workspace }}/clinic-worker-input/binding.json
        run: node scripts/rcap-hosted-clinic-failed-job-recovery-entry.mjs
      - name: Preserve only typed existing-job recovery checkpoints and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clinic-failed-job-recovery-${{ github.run_id }}
          path: |
            carrier/clinic-failed-job-recovery-evidence/checkpoint-*.json
            carrier/clinic-failed-job-recovery-evidence/result.json
          if-no-files-found: warn

  clinic_saved_full_journey:
    name: Complete only the existing saved Clinic matter through private delivery
    if: inputs.mode == 'clinic_saved_full_journey'
    permissions:
      contents: read
      actions: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: carrier
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: carrier
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
