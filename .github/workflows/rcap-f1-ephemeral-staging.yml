  production_public_verify:
    name: Read-only public-domain verification of the activated Production release
    if: inputs.mode == 'production_public_verify'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RCAP_PRODUCTION_PHASE: public_verify
      RCAP_APPLICATION_SHA: ${{ inputs.application_sha }}
      RCAP_WORKER_SOURCE_SHA: ${{ inputs.worker_source_sha }}
      RCAP_WORKER_DIGEST: ${{ inputs.worker_digest }}
      RCAP_TOOLS_SHA: ${{ inputs.tools_sha }}
      RCAP_PRODUCTION_PROJECT_REF: wwtwtsmywnckfkdaqqeg
    steps:
      - name: Refuse any input that is not the authorized pinned value
        env:
          APPLICATION_SHA_INPUT: ${{ inputs.application_sha }}
          WORKER_SOURCE_SHA_INPUT: ${{ inputs.worker_source_sha }}
          WORKER_DIGEST_INPUT: ${{ inputs.worker_digest }}
          TOOLS_SHA_INPUT: ${{ inputs.tools_sha }}
          WORKFLOW_SHA_INPUT: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLICATION_SHA_INPUT" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::application_sha must be a full commit SHA"; exit 1; }
          printf '%s' "$WORKER_SOURCE_SHA_INPUT" | grep -Eq '^[0-9a-f]{40}$'  || { echo "::error::worker_source_sha is not the authorized value"; exit 1; }
          printf '%s' "$WORKER_DIGEST_INPUT" | grep -Eq '^sha256:[0-9a-f]{64}$'  || { echo "::error::worker_digest is not the authorized value"; exit 1; }
          printf '%s' "$TOOLS_SHA_INPUT" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::tools_sha must be a full commit SHA"; exit 1; }
          printf '%s' "$WORKFLOW_SHA_INPUT" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::workflow execution SHA must be full"; exit 1; }

      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify ancestry and retain the exact workflow execution commit
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CANONICAL_INTEGRATION_BRANCH"
          for SHA in "${{ inputs.application_sha }}" "${{ inputs.worker_source_sha }}" "${{ inputs.tools_sha }}"; do
            git cat-file -e "${SHA}^{commit}" || { echo "::error::$SHA does not resolve"; exit 1; }
            git merge-base --is-ancestor "$SHA" "origin/$CANONICAL_INTEGRATION_BRANCH" || { echo "::error::$SHA is outside the canonical integration history"; exit 1; }
          done
          git merge-base --is-ancestor "${{ inputs.application_sha }}" "${{ inputs.tools_sha }}" \
            || { echo "::error::the final application candidate is not an ancestor of the workflow tools SHA"; exit 1; }
          git diff --quiet "${{ inputs.application_sha }}" "${{ inputs.tools_sha }}" -- package.json package-lock.json tsconfig.json scripts/rcap-render-worker.mjs deploy/rcap-render-worker/Dockerfile scripts/lib src \
            || { echo "::error::workflow tools differ from the final application on worker inputs"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || { echo "::error::workflow execution checkout mismatch"; exit 1; }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frozen dependencies
        run: npm ci

      - name: Require current release and separate public-verification authorization
        run: |
          node scripts/rcap-production-migration-contract.mjs
          node scripts/verify-rcap-worker-input-equivalence.mjs --base "${{ inputs.worker_source_sha }}" --head "${{ inputs.tools_sha }}"

      # Read-only from the outside: control-plane readback of every Production
      # domain, public HTTPS health and build identity on expungement.ai, and a
      # fresh-context Chrome walk of the Mississippi screening. No secret other
      # than the read-only Vercel token; no Supabase, Stripe or bypass secret.
      - name: Verify the activated release on the public domain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RCAP_PRODUCTION_PHASE: public_verify
          RCAP_APPLICATION_SHA: ${{ inputs.application_sha }}
          RCAP_WORKER_SOURCE_SHA: ${{ inputs.worker_source_sha }}
          RCAP_WORKER_DIGEST: ${{ inputs.worker_digest }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/rcap-production-public-verify.mjs

      - name: Upload the public verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcap-production-public-verify-${{ github.run_id }}
          path: production-public-evidence/
          if-no-files-found: error

  production_packet_canary:
