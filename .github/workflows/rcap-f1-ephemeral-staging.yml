name: RCAP F1 ephemeral staging

# Captain-owned, manual only. This workflow REHEARSES STAGING ON A DISPOSABLE
# STACK AND NOTHING ELSE. The entire environment — Postgres, Auth, PostgREST,
# Storage, Kong, Mailpit, the application, the worker container — lives and
# dies inside this runner. It touches no hosted project, no persistent
# environment, no production surface, and it deploys nothing that outlives
# the run.
#
# Lane A supplies one exact full application SHA at dispatch. The reusable
# worker publication remains pinned, and the canonical-input equivalence gate
# below refuses that digest if the final candidate changes worker bytes.

#
# This workflow is also the DISPATCH ENTRY POINT for the persistent hosted
# acceptance environment. GitHub lists workflow_dispatch only for files that
# exist on the default branch, and pushing to main is Roger's decision, so the
# hosted workflow is reached through `mode` here and runs as a reusable
# workflow resolved from this run's own commit. `mode: ephemeral` — the
# default — behaves exactly as it always has.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "ephemeral | hosted_* (Vercel, including audit and reuse-only Checkout) | github_acceptance (temporary HTTPS fallback)"
        required: false
        type: choice
        options: [ephemeral, hosted_preflight, hosted_vercel_identity, hosted_vercel_audit, hosted_migrate, hosted_clinic_migrate, hosted_legal_aid_migrate, hosted_clinic_preview, hosted_legal_aid_browser, hosted_deploy, hosted_replace_preview, hosted_accept, hosted_stripe_retarget, hosted_checkout_gate, hosted_browser, hosted_payment, hosted_full, hosted_worker_contract, github_acceptance, production_preflight, production_clinic_migrate, production_forward_chain_readback, production_forward_chain_migrate, production_legal_aid_keys_read, production_legal_aid_keys_create, production_legal_aid_readback, production_legal_aid_migrate, production_smoke, production_activate, production_worker_deploy, production_public_verify, production_save_transition_reproduce, production_save_transition_verify]
        default: ephemeral
      preview_hostname:
        description: "Exact existing Vercel Preview hostname to REUSE; supplying it forbids creating another deployment"
        required: false
        default: ""
      contradiction_job_id:
        description: "Exact packet_render_jobs id to diagnose (hosted_worker_contract only)"
        required: false
        type: string
        default: ""
      promotion_code:
        description: "Stripe promotion code entered on the hosted Checkout page (hosted_payment); empty runs the ordinary $50 order"
        required: false
        type: string
        default: ""
      promotion_zero_total:
        description: "true when that code should bring the total to zero, so the journey completes with no card"
        required: false
        type: string
        default: ""
      journey_state:
        description: "Two-letter jurisdiction for the paid journey (hosted_payment); empty picks the first sellable route"
        required: false
        type: string
        default: ""
      preview_deployment_id:
        description: "Exact existing Vercel Preview deployment id; optional — resolved from preview_hostname when omitted"
        required: false
        type: string
        default: ""
      supabase_project_ref:
        description: "Acceptance Supabase project ref (hosted modes only)"
        required: false
        type: string
        default: ""
      application_sha:
        description: "Exact final application SHA supplied by Lane A"
        required: true
        type: string
      worker_source_sha:
        description: "Pinned worker source freeze SHA (must equal the authorized value)"
        required: true
        type: string
      worker_digest:
        description: "Pinned immutable worker digest (must equal the authorized value)"
        required: true
        type: string
      tools_sha:
        description: "Integration-branch commit carrying the F1 orchestration scripts (must be image-input-equivalent to the freeze)"
        required: true
        type: string

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: rcap-f1-ephemeral-staging
  cancel-in-progress: false

env:
  AUTHORIZED_WORKER_SOURCE_SHA: 4a684f9a8d121c18aa2b8636f16c3e30fd75c498
  AUTHORIZED_WORKER_DIGEST: sha256:1d54ad549fffe7b8a3e91dc1a8a7df46b2bf9b38e7c876aa7013a3fd9687c4d9
  IMAGE_REPOSITORY: ghcr.io/roger-legalease/rcap-render-worker
  CANONICAL_INTEGRATION_BRANCH: claude/legalease-sprint-captain-utucnw
  STAGING_ENVIRONMENT_NAME: rcap-acceptance

jobs:
  production_preflight:
    name: Read-only Production identity and rollback discovery
    if: inputs.mode == 'production_preflight' || inputs.mode == 'production_clinic_migrate' || inputs.mode == 'production_forward_chain_readback' || inputs.mode == 'production_forward_chain_migrate' || inputs.mode == 'production_legal_aid_readback' || inputs.mode == 'production_legal_aid_migrate' || inputs.mode == 'production_smoke' || inputs.mode == 'production_activate'
    uses: ./.github/workflows/rcap-production-canary.yml
    with:
      phase: ${{ inputs.mode == 'production_activate' && 'activate' || (inputs.mode == 'production_clinic_migrate' && 'clinic_migrate' || (inputs.mode == 'production_forward_chain_readback' && 'forward_chain_readback' || (inputs.mode == 'production_forward_chain_migrate' && 'forward_chain_migrate' || (inputs.mode == 'production_legal_aid_readback' && 'legal_aid_readback' || (inputs.mode == 'production_legal_aid_migrate' && 'legal_aid_migrate' || (inputs.mode == 'production_smoke' && 'smoke' || 'preflight')))))) }}
      application_sha: ${{ inputs.application_sha }}
      worker_source_sha: ${{ inputs.worker_source_sha }}
      worker_digest: ${{ inputs.worker_digest }}
      tools_sha: ${{ inputs.tools_sha }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

  production_legal_aid_keys:
    name: Legal Aid protected-field keys in the Production environment store
    if: inputs.mode == 'production_legal_aid_keys_read' || inputs.mode == 'production_legal_aid_keys_create'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tools commit
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the key control never prints or persists a value
        run: node scripts/verify-rcap-production-legal-aid-keys.mjs
      - name: Read, or create once, the Production Legal Aid keys
        env:
          RCAP_LEGAL_AID_KEYS_PHASE: ${{ inputs.mode == 'production_legal_aid_keys_create' && 'create' || 'read' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/rcap-production-legal-aid-keys.mjs
      - name: Upload the key evidence (names and identifiers only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcap-production-legal-aid-keys-${{ github.run_id }}
          path: production-canary-evidence/
          if-no-files-found: error

  production_worker_deploy:
    name: Exact worker onto the production execution target
    if: inputs.mode == 'production_worker_deploy'
    uses: ./.github/workflows/deploy-rcap-render-worker-production.yml
    with:
      worker_source_sha: ${{ inputs.worker_source_sha }}
      worker_digest: ${{ inputs.worker_digest }}
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  production_public_verify:
    name: Read-only public-domain verification of the activated Production release
    if: inputs.mode == 'production_public_verify'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refuse any input that is not the authorized pinned value
        env:
          APPLICATION_SHA_INPUT: ${{ inputs.application_sha }}
          WORKER_SOURCE_SHA_INPUT: ${{ inputs.worker_source_sha }}
          WORKER_DIGEST_INPUT: ${{ inputs.worker_digest }}
          TOOLS_SHA_INPUT: ${{ inputs.tools_sha }}
          WORKFLOW_SHA_INPUT: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLICATION_SHA_INPUT" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::application_sha must be a full commit SHA"; exit 1; }
          [ "$WORKER_SOURCE_SHA_INPUT" = "$AUTHORIZED_WORKER_SOURCE_SHA" ] || { echo "::error::worker_source_sha is not the authorized value"; exit 1; }
          [ "$WORKER_DIGEST_INPUT" = "$AUTHORIZED_WORKER_DIGEST" ] || { echo "::error::worker_digest is not the authorized value"; exit 1; }
          printf '%s' "$TOOLS_SHA_INPUT" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::tools_sha must be a full commit SHA"; exit 1; }
          [ "$TOOLS_SHA_INPUT" = "$WORKFLOW_SHA_INPUT" ] || { echo "::error::tools_sha must equal the workflow source SHA"; exit 1; }

      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify ancestry of every pinned SHA and check out the tools commit
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CANONICAL_INTEGRATION_BRANCH"
          for SHA in "${{ inputs.application_sha }}" "${{ inputs.worker_source_sha }}" "${{ inputs.tools_sha }}"; do
            git cat-file -e "${SHA}^{commit}" || { echo "::error::$SHA does not resolve"; exit 1; }
            git merge-base --is-ancestor "$SHA" "origin/$CANONICAL_INTEGRATION_BRANCH" || { echo "::error::$SHA is outside the canonical integration history"; exit 1; }
          done
          git merge-base --is-ancestor "${{ inputs.application_sha }}" "${{ inputs.tools_sha }}" \
            || { echo "::error::the final application candidate is not an ancestor of the workflow tools SHA"; exit 1; }
          git diff --quiet "${{ inputs.application_sha }}" "${{ inputs.tools_sha }}" -- package.json package-lock.json tsconfig.json scripts/rcap-render-worker.mjs deploy/rcap-render-worker/Dockerfile scripts/lib src \
            || { echo "::error::workflow tools differ from the final application on worker inputs"; exit 1; }
          git checkout --detach "${{ inputs.tools_sha }}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frozen dependencies
        run: npm ci

      # Read-only from the outside: control-plane readback of every Production
      # domain, public HTTPS health and build identity on expungement.ai, and a
      # fresh-context Chrome walk of the Mississippi screening. No secret other
      # than the read-only Vercel token; no Supabase, Stripe or bypass secret.
      - name: Verify the activated release on the public domain
        env:
          RCAP_PRODUCTION_PHASE: public_verify
          RCAP_APPLICATION_SHA: ${{ inputs.application_sha }}
          RCAP_WORKER_SOURCE_SHA: ${{ inputs.worker_source_sha }}
          RCAP_WORKER_DIGEST: ${{ inputs.worker_digest }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/rcap-production-public-verify.mjs

      - name: Upload the public verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcap-production-public-verify-${{ github.run_id }}
          path: production-public-evidence/
          if-no-files-found: error

  # 2026-09-16 production incident ("Save my result and continue" fails on the
  # live Mississippi result page). Reproduce: a signed-out public browser walk
  # that clicks Save and records the pending/claim statuses and sanitized error
  # codes, in Chromium and WebKit. Verify: the same walk through the one
  # authorized dedicated synthetic account to the claimed matter and back after
  # refresh, plus the signed-in path and duplicate protection. Never Stripe,
  # never packet generation, never a real customer matter.
  production_save_transition:
    name: Public save-to-Briefcase transition probe on expungement.ai
    if: inputs.mode == 'production_save_transition_reproduce' || inputs.mode == 'production_save_transition_verify'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Refuse any input that is not the authorized pinned value
        env:
          APPLICATION_SHA_INPUT: ${{ inputs.application_sha }}
          WORKER_SOURCE_SHA_INPUT: ${{ inputs.worker_source_sha }}
          WORKER_DIGEST_INPUT: ${{ inputs.worker_digest }}
          TOOLS_SHA_INPUT: ${{ inputs.tools_sha }}
          WORKFLOW_SHA_INPUT: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLICATION_SHA_INPUT" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::application_sha must be a full commit SHA"; exit 1; }
          [ "$WORKER_SOURCE_SHA_INPUT" = "$AUTHORIZED_WORKER_SOURCE_SHA" ] || { echo "::error::worker_source_sha is not the authorized value"; exit 1; }
          [ "$WORKER_DIGEST_INPUT" = "$AUTHORIZED_WORKER_DIGEST" ] || { echo "::error::worker_digest is not the authorized value"; exit 1; }
          printf '%s' "$TOOLS_SHA_INPUT" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::tools_sha must be a full commit SHA"; exit 1; }
          [ "$TOOLS_SHA_INPUT" = "$WORKFLOW_SHA_INPUT" ] || { echo "::error::tools_sha must equal the workflow source SHA"; exit 1; }

      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify ancestry of every pinned SHA and check out the tools commit
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CANONICAL_INTEGRATION_BRANCH"
          for SHA in "${{ inputs.application_sha }}" "${{ inputs.worker_source_sha }}" "${{ inputs.tools_sha }}"; do
            git cat-file -e "${SHA}^{commit}" || { echo "::error::$SHA does not resolve"; exit 1; }
            git merge-base --is-ancestor "$SHA" "origin/$CANONICAL_INTEGRATION_BRANCH" || { echo "::error::$SHA is outside the canonical integration history"; exit 1; }
          done
          git checkout --detach "${{ inputs.tools_sha }}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frozen dependencies and the WebKit engine
        run: |
          npm ci
          npx playwright install --with-deps webkit

      - name: Verify the probe contract
        run: node scripts/verify-rcap-production-save-transition-probe.mjs

      - name: Probe the public save-to-Briefcase transition
        env:
          RCAP_PRODUCTION_PHASE: ${{ inputs.mode == 'production_save_transition_verify' && 'save_transition_verify' || 'save_transition_reproduce' }}
          RCAP_PUBLIC_ORIGIN: https://expungement.ai
          RCAP_PRODUCTION_PROJECT_REF: wwtwtsmywnckfkdaqqeg
          RCAP_PRODUCTION_SUPABASE_URL: https://wwtwtsmywnckfkdaqqeg.supabase.co
          RCAP_BROWSER_CHROMIUM: /usr/bin/google-chrome
          RCAP_PROBE_BROWSERS: chromium,webkit
          SUPABASE_ACCESS_TOKEN: ${{ inputs.mode == 'production_save_transition_verify' && secrets.SUPABASE_ACCESS_TOKEN || '' }}
        run: node scripts/rcap-production-save-transition-probe.mjs

      - name: Upload the save-transition evidence (sanitized)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcap-production-save-transition-${{ github.run_id }}
          path: production-canary-evidence/
          if-no-files-found: error

  github_acceptance:
    name: GitHub-hosted functional acceptance fallback
    if: inputs.mode == 'github_acceptance'
    uses: ./.github/workflows/rcap-github-hosted-acceptance.yml
    with:
      application_sha: ${{ inputs.application_sha }}
      worker_source_sha: ${{ inputs.worker_source_sha }}
      worker_digest: ${{ inputs.worker_digest }}
      tools_sha: ${{ inputs.tools_sha }}
      supabase_project_ref: ${{ inputs.supabase_project_ref }}
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      HOSTED_STRIPE_TEST_SECRET: ${{ secrets.HOSTED_STRIPE_TEST_SECRET }}
      HOSTED_STRIPE_TEST_WEBHOOK_SECRET: ${{ secrets.HOSTED_STRIPE_TEST_WEBHOOK_SECRET }}

  hosted:
    name: Persistent hosted acceptance staging
    if: startsWith(inputs.mode, 'hosted_')
    uses: ./.github/workflows/rcap-hosted-acceptance-staging.yml
    with:
      phase: ${{ inputs.mode == 'hosted_clinic_preview' && 'clinic_preview' || (inputs.mode == 'hosted_legal_aid_browser' && 'legal_aid_browser' || (inputs.mode == 'hosted_full' && 'full' || (inputs.mode == 'hosted_worker_contract' && 'worker_contract' || (inputs.mode == 'hosted_payment' && 'payment' || (inputs.mode == 'hosted_browser' && 'browser' || (inputs.mode == 'hosted_checkout_gate' && 'checkout_gate' || (inputs.mode == 'hosted_stripe_retarget' && 'stripe_retarget' || (inputs.mode == 'hosted_accept' && 'accept' || (inputs.mode == 'hosted_replace_preview' && 'replace_preview' || (inputs.mode == 'hosted_deploy' && 'deploy' || (inputs.mode == 'hosted_clinic_migrate' && 'clinic_migrate' || (inputs.mode == 'hosted_legal_aid_migrate' && 'legal_aid_migrate' || (inputs.mode == 'hosted_migrate' && 'migrate' || (inputs.mode == 'hosted_vercel_audit' && 'vercel_audit' || (inputs.mode == 'hosted_vercel_identity' && 'vercel_identity' || 'preflight'))))))))))))))) }}
      preview_hostname: ${{ inputs.preview_hostname }}
      preview_deployment_id: ${{ inputs.preview_deployment_id }}
      contradiction_job_id: ${{ inputs.contradiction_job_id }}
      promotion_code: ${{ inputs.promotion_code }}
      promotion_zero_total: ${{ inputs.promotion_zero_total }}
      journey_state: ${{ inputs.journey_state }}
      application_sha: ${{ inputs.application_sha }}
      worker_source_sha: ${{ inputs.worker_source_sha }}
      worker_digest: ${{ inputs.worker_digest }}
      tools_sha: ${{ inputs.tools_sha }}
      supabase_project_ref: ${{ inputs.supabase_project_ref }}
    secrets:
      VERCEL_TOKEN: ${{ (inputs.mode == 'hosted_migrate' || inputs.mode == 'hosted_legal_aid_migrate') && 'not-used-in-supabase-only' || secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Optional. Absent until Roger adds them; the hosted workflow declares
      # them non-required so every phase still runs without Stripe configured,
      # and the deployment simply keeps the control's disabled default.
      HOSTED_STRIPE_TEST_SECRET: ${{ secrets.HOSTED_STRIPE_TEST_SECRET }}
      HOSTED_STRIPE_TEST_WEBHOOK_SECRET: ${{ secrets.HOSTED_STRIPE_TEST_WEBHOOK_SECRET }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      HOSTED_CLINIC_DEMO_PASSWORD: ${{ secrets.HOSTED_CLINIC_DEMO_PASSWORD }}
      HOSTED_CLINIC_DEMO_ACCESS_CODE: ${{ secrets.HOSTED_CLINIC_DEMO_ACCESS_CODE }}
      HOSTED_LEGAL_AID_RESEND_API_KEY: ${{ secrets.HOSTED_LEGAL_AID_RESEND_API_KEY }}
      HOSTED_LEGAL_AID_TEST_MAILBOX: ${{ secrets.HOSTED_LEGAL_AID_TEST_MAILBOX }}
      HOSTED_LEGAL_AID_EMAIL_FROM: ${{ secrets.HOSTED_LEGAL_AID_EMAIL_FROM }}

  f1:
    name: Ephemeral F1 staging rehearsal (rcap-ci-staging)
    if: inputs.mode == 'ephemeral' || inputs.mode == ''
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Refuse any input that is not the authorized pinned value
        env:
          APPLICATION_SHA_INPUT: ${{ inputs.application_sha }}
          WORKER_SOURCE_SHA_INPUT: ${{ inputs.worker_source_sha }}
          WORKER_DIGEST_INPUT: ${{ inputs.worker_digest }}
          TOOLS_SHA_INPUT: ${{ inputs.tools_sha }}
          WORKFLOW_SHA_INPUT: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLICATION_SHA_INPUT" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::application_sha must be a full commit SHA"; exit 1; }
          [ "$WORKER_SOURCE_SHA_INPUT" = "$AUTHORIZED_WORKER_SOURCE_SHA" ] || { echo "::error::worker_source_sha is not the authorized value"; exit 1; }
          [ "$WORKER_DIGEST_INPUT" = "$AUTHORIZED_WORKER_DIGEST" ] || { echo "::error::worker_digest is not the authorized value"; exit 1; }
          printf '%s' "$TOOLS_SHA_INPUT" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::tools_sha must be a full commit SHA"; exit 1; }
          [ "$TOOLS_SHA_INPUT" = "$WORKFLOW_SHA_INPUT" ] || { echo "::error::tools_sha must equal the workflow source SHA"; exit 1; }

      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify ancestry and image-input equivalence of every pinned SHA
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CANONICAL_INTEGRATION_BRANCH"
          for SHA in "${{ inputs.application_sha }}" "${{ inputs.worker_source_sha }}" "${{ inputs.tools_sha }}"; do
            git cat-file -e "${SHA}^{commit}" || { echo "::error::$SHA does not resolve"; exit 1; }
            git merge-base --is-ancestor "$SHA" "origin/$CANONICAL_INTEGRATION_BRANCH" || { echo "::error::$SHA is outside the canonical integration history"; exit 1; }
          done
          git merge-base --is-ancestor "${{ inputs.worker_source_sha }}" "${{ inputs.application_sha }}" \
            || { echo "::error::the accepted worker source is not an ancestor of the final application candidate"; exit 1; }
          git merge-base --is-ancestor "${{ inputs.application_sha }}" "${{ inputs.tools_sha }}" \
            || { echo "::error::the final application candidate is not an ancestor of the workflow tools SHA"; exit 1; }
          # The tools commit must carry the exact application and worker bytes:
          # if this diff is empty, building once at tools_sha builds the pinned
          # application SHA's bytes, and the worker fingerprint is unchanged.
          git diff --quiet "${{ inputs.application_sha }}" "${{ inputs.tools_sha }}" -- src package.json package-lock.json tsconfig.json next.config.ts postcss.config.mjs tailwind.config.ts public docs/record-clearing/field-map-drafts \
            || { echo "::error::tools_sha differs from application_sha on application bytes"; exit 1; }
          git diff --quiet "${{ inputs.worker_source_sha }}" "${{ inputs.application_sha }}" -- package.json package-lock.json tsconfig.json scripts/rcap-render-worker.mjs deploy/rcap-render-worker/Dockerfile scripts/lib src \
            || { echo "::error::final application changes canonical worker inputs; build and pin one new full-SHA image"; exit 1; }
          git diff --quiet "${{ inputs.application_sha }}" "${{ inputs.tools_sha }}" -- package.json package-lock.json tsconfig.json scripts/rcap-render-worker.mjs deploy/rcap-render-worker/Dockerfile scripts/lib src \
            || { echo "::error::workflow tools differ from the final application on worker inputs"; exit 1; }
          git checkout --detach "${{ inputs.tools_sha }}"

      - name: Authenticate to GHCR and pull the worker by immutable digest
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin \
            || { echo "::error::GHCR authentication failed"; exit 1; }
          REF="$IMAGE_REPOSITORY@$AUTHORIZED_WORKER_DIGEST"
          docker pull "$REF" || { echo "::error::pull by immutable digest failed"; exit 1; }
          ACTUAL="$(docker inspect --format='{{index .RepoDigests 0}}' "$REF" | sed 's/.*@//')"
          [ "$ACTUAL" = "$AUTHORIZED_WORKER_DIGEST" ] || { echo "::error::pulled digest $ACTUAL differs from authorized digest"; exit 1; }
          echo "Pulled $REF (digest verified; the mutable tag was never used)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Start the disposable Supabase stack (runner-local only)
        run: |
          set -euo pipefail
          npm install -g supabase@2
          supabase init --force >/dev/null
          # Only the required services: Postgres, Auth, PostgREST, Storage,
          # Kong, and the mail catcher. Everything binds to the runner's
          # loopback; no port is exposed beyond this machine.
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta
          supabase status -o env > /tmp/supabase.env
          cat /tmp/supabase.env | sed 's/KEY=.*/KEY=***REDACTED***/' || true

      - name: Apply the verified migration sequence and run the stack-integration matrix
        env:
          F1_APPLICATION_SHA: ${{ inputs.application_sha }}
        run: |
          set -euo pipefail
          set -a; source /tmp/supabase.env; set +a
          export F1_SUPABASE_URL="${API_URL:-http://127.0.0.1:54321}"
          export F1_DB_URL="${DB_URL:-postgresql://postgres:postgres@127.0.0.1:54322/postgres}"
          export F1_ANON_KEY="${ANON_KEY}"
          export F1_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY}"
          export F1_MAILPIT_API="${INBUCKET_URL:-http://127.0.0.1:54324}/api/v1"
          export F1_WORKER_DIGEST_REF="$IMAGE_REPOSITORY@$AUTHORIZED_WORKER_DIGEST"

          # The application at the pinned SHA, delivery route disabled.
          export NEXT_PUBLIC_SUPABASE_URL="$F1_SUPABASE_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$F1_ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$F1_SERVICE_ROLE_KEY"
          export SUPABASE_URL="$F1_SUPABASE_URL"
          export STRIPE_SECRET_KEY="sk_test_f1_ephemeral_dummy"
          export STRIPE_WEBHOOK_SECRET="whsec_f1_ephemeral_dummy"
          npm run build
          unset RCAP_CONSUMER_DELIVERY_ROUTE_STATE || true
          nohup npx next start -p 3000 > /tmp/app-disabled.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3000/ && break; sleep 2; done

          export F1_APP_URL="http://127.0.0.1:3000"
          export F1_FLIP_CMD='pkill -f "next start" || true; sleep 2; RCAP_CONSUMER_DELIVERY_ROUTE_STATE=staging_scoped RCAP_CONSUMER_DELIVERY_STAGING_SCOPE=f1-scope-1,f1-scope-2 nohup npx next start -p 3000 > /tmp/app-scoped.log 2>&1 & for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3000/ && break; sleep 2; done'
          export F1_ROLLBACK_CMD='pkill -f "next start" || true; sleep 2; nohup npx next start -p 3000 > /tmp/app-rolledback.log 2>&1 & for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3000/ && break; sleep 2; done'

          node scripts/f1-ephemeral-staging-stack.mjs

      - name: Run the deep behavioural matrix (repository battery on the runner)
        run: |
          set -euo pipefail
          node scripts/verify-rcap-phase52-consumer-payment-authority.mjs
          node scripts/verify-rcap-phase53-consumer-job-binding.mjs
          node scripts/verify-rcap-phase51-consumer-payment-security.mjs
          node scripts/verify-expungement-consumer-payment-http.mjs
          node scripts/verify-rcap-consumer-person-namespace.mjs
          node scripts/verify-rcap-packet-delivery-db.mjs
          node scripts/verify-rcap-render-worker-delivery.mjs
          node scripts/verify-rcap-packet-delivery-e2e.mjs

      - name: Collect sanitized evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p f1-evidence
          for f in /tmp/app-disabled.log /tmp/app-scoped.log /tmp/app-rolledback.log; do
            [ -f "$f" ] && sed -E 's/(key|token|secret|password)[^ ]*/\1=***REDACTED***/Ig' "$f" > "f1-evidence/$(basename "$f")" || true
          done
          echo "{\"stagingEnvironmentName\":\"$STAGING_ENVIRONMENT_NAME\",\"applicationSha\":\"${{ inputs.application_sha }}\",\"workerSourceSha\":\"${{ inputs.worker_source_sha }}\",\"workerDigest\":\"$AUTHORIZED_WORKER_DIGEST\",\"toolsSha\":\"${{ inputs.tools_sha }}\",\"runId\":\"${{ github.run_id }}\"}" > f1-evidence/f1-run-identity.json

      - name: Upload the F1 evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcap-f1-evidence-${{ github.run_id }}
          path: f1-evidence/
          if-no-files-found: error

      - name: Destroy the disposable stack
        if: always()
        run: |
          pkill -f "next start" || true
          docker rm -f f1-worker 2>/dev/null || true
          supabase stop --no-backup || true
