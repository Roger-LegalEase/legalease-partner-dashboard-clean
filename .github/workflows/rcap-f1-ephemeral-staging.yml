-once-preparation/GLOBAL-QUEUE-WINDOW-COMPLETENESS.TEMPLATE.NOT-EXECUTED.sql":"787c50a5971f5c2ea7aa82612f966750235681799277b1a6f4b72ebe6fd24684","scripts/worker-once-preparation/ordinary-worker-once.mjs":"13cc4f3e4f1fb2e6fd94335199d7bbb6c8f04572005af1ab7d2ed23a5d8c6c9f","scripts/clinic-readonly-native-binding.json":"99b9ffd757a8b6b62826336d86f3f2f7e923af288a9626dc8cfb2ba75a405b4a","vercel.json":"6cd68b2f302c6f6f41d0cbfc918c77d13a541c16a961925ba1ae5178b296ab8b","package.json":"73ab9869dfb6b045d0a549943024a1b32c04b238bceb658b0d450d330fa7cc20","package-lock.json":"fc0208973470f108d82dc3defa99647fe1ee01c43a7bea5302487368ae36aae7","scripts/dtc-qualified-worker-qualification-acceptance.json":"4fcd976eae6e488aa0b4b9b4c510f3f94651ebf9aba8ffaa19eb67edd61e33e1","scripts/dtc-qualified-worker-qualification.json":"91995107caac569ae661d956da61701b242ce46fc24ed25260a42aa1bd0d923d","scripts/dtc-qualified-worker-publication.json":"fe6100d154eb9aa7a17b8899f6395e9466e2a3b4192e23e905fc293a59763e85","scripts/dtc-qualified-worker-publication-run.json":"a2355985170510c8f805c2b1a4767e3be7c315084df337f6fb3e78278bbf5795","scripts/worker-once-preparation/qualified-worker-image.mjs":"8f8eb39676cf3d5ba237bbab54e4928390497dafa153ff6946121fe44462a0b7","scripts/clinic-worker-once-preparation/clinic-worker-runtime-context.mjs":"a146f0875e6ce6e9be0091c86a9c754eb8022df07cc7d23bb1981e874672eac7","scripts/clinic-worker-once-preparation/ACTUAL-CLINIC-EXPIRED2-PRECLAIM.TEMPLATE.NOT-EXECUTED.sql":"ea35148bc92502b7bf5f911504ee5294dd18efcba3ba1f6c475b04c7d00986c3","scripts/worker-once-preparation/sponsored-worker-runtime-context.mjs":"2f6fca48cfc5f3beb124f6e985371a374d475c8ac86852046786ba6c17730960","data/record-clearing/legal-decisions/2026-10-23-ms-nonconv-sponsored-preview.json":"8c8c7b190724fdd52851ce0c1499bc8cb1be3947da0a47fc81c58e27ce379355","scripts/clinic-worker-once-preparation/clinic-finalized-private-delivery.mjs":"ecb3886eae5805ca3c484241df94c5aa672943855d8359b59569591b9e02ae34"}))assert.equal(createHash('sha256').update(fs.readFileSync(file)).digest('hex'),pin);
          JS
      - name: Reuse existing locked dependencies without builds or browser installation
        run: npm ci --ignore-scripts
      - name: Authenticate existing read-only registry custody
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull only the qualified immutable recovery image without claiming
        if: inputs.journey_state != 'finalized_attempt3_private_only'
        run: docker pull ghcr.io/roger-legalease/rcap-render-worker@sha256:c574d7ca3864dfcae9de3cb4fc77c8c324ace050310333093042f961e6f0b5f1
      - name: Read only the accepted native Clinic target and successful run metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
