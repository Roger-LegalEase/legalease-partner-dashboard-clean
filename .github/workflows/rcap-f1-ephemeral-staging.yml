  production_legal_aid_keys:
    name: Legal Aid protected-field keys in the Production environment store
    if: inputs.mode == 'production_legal_aid_keys_read' || inputs.mode == 'production_legal_aid_keys_create'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tools commit
