  hosted:
    name: Persistent hosted acceptance staging
    if: startsWith(inputs.mode, 'hosted_') && inputs.mode != 'hosted_clinic_deploy'
    uses: ./.github/workflows/rcap-hosted-acceptance-staging.yml
    with:
      sponsor_case: ${{ inputs.sponsor_case }}
      sponsor_items: ${{ inputs.sponsor_items }}
      sponsor_fulfillment: ${{ inputs.sponsor_fulfillment }}
      phase: ${{ inputs.mode == 'hosted_sponsor_cap' && 'sponsor_cap' || inputs.mode == 'hosted_clinic_resume' && 'clinic_resume' || inputs.mode == 'hosted_clinic_deploy' && 'clinic_deploy' || inputs.mode == 'hosted_clinic_preview' && 'clinic_preview' || (inputs.mode == 'hosted_legal_aid_browser' && 'legal_aid_browser' || (inputs.mode == 'hosted_full' && 'full' || (inputs.mode == 'hosted_worker_contract' && 'worker_contract' || (inputs.mode == 'hosted_payment' && 'payment' || (inputs.mode == 'hosted_browser' && 'browser' || (inputs.mode == 'hosted_checkout_gate' && 'checkout_gate' || (inputs.mode == 'hosted_stripe_retarget' && 'stripe_retarget' || (inputs.mode == 'hosted_accept' && 'accept' || (inputs.mode == 'hosted_replace_preview' && 'replace_preview' || (inputs.mode == 'hosted_deploy' && 'deploy' || (inputs.mode == 'hosted_clinic_migrate' && 'clinic_migrate' || (inputs.mode == 'hosted_legal_aid_migrate' && 'legal_aid_migrate' || (inputs.mode == 'hosted_migrate' && 'migrate' || (inputs.mode == 'hosted_vercel_audit' && 'vercel_audit' || (inputs.mode == 'hosted_vercel_identity' && 'vercel_identity' || 'preflight'))))))))))))))) }}
      preview_hostname: ${{ inputs.preview_hostname }}
      preview_deployment_id: ${{ inputs.preview_deployment_id }}
      contradiction_job_id: ${{ inputs.contradiction_job_id }}
      promotion_code: ${{ inputs.promotion_code }}
      expected_total_cents: ${{ inputs.expected_total_cents }}
      journey_state: ${{ inputs.journey_state }}
      application_sha: ${{ inputs.application_sha }}
      worker_source_sha: ${{ inputs.worker_source_sha }}
      worker_digest: ${{ inputs.worker_digest }}
      tools_sha: ${{ inputs.tools_sha }}
      supabase_project_ref: ${{ inputs.supabase_project_ref }}
      clinic_resume_authorization: ${{ inputs.clinic_resume_authorization }}
      clinic_session_closure_authorization: ${{ inputs.clinic_session_closure_authorization }}
    secrets:
      VERCEL_TOKEN: ${{ (inputs.mode == 'hosted_migrate' || inputs.mode == 'hosted_legal_aid_migrate') && 'not-used-in-supabase-only' || secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Optional. Absent until Roger adds them; the hosted workflow declares
      # them non-required so every phase still runs without Stripe configured,
      # and the deployment simply keeps the control's disabled default.
      HOSTED_STRIPE_TEST_SECRET: ${{ secrets.HOSTED_STRIPE_TEST_SECRET }}
      HOSTED_STRIPE_TEST_WEBHOOK_SECRET: ${{ secrets.HOSTED_STRIPE_TEST_WEBHOOK_SECRET }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      HOSTED_CLINIC_DEMO_PASSWORD: ${{ secrets.HOSTED_CLINIC_DEMO_PASSWORD }}
      HOSTED_LEGAL_AID_RESTRICTED_FIELD_KEY: ${{ secrets.HOSTED_LEGAL_AID_RESTRICTED_FIELD_KEY }}
      HOSTED_LEGAL_AID_RESTRICTED_FIELD_KEY_VERSION: ${{ secrets.HOSTED_LEGAL_AID_RESTRICTED_FIELD_KEY_VERSION }}
      HOSTED_PARTICIPANT_PRIVACY_PSEUDONYM_SECRET: ${{ secrets.HOSTED_PARTICIPANT_PRIVACY_PSEUDONYM_SECRET }}
      HOSTED_CLINIC_DEMO_ACCESS_CODE: ${{ secrets.HOSTED_CLINIC_DEMO_ACCESS_CODE }}
      HOSTED_LEGAL_AID_RESEND_API_KEY: ${{ secrets.HOSTED_LEGAL_AID_RESEND_API_KEY }}
      HOSTED_LEGAL_AID_TEST_MAILBOX: ${{ secrets.HOSTED_LEGAL_AID_TEST_MAILBOX }}
      HOSTED_LEGAL_AID_EMAIL_FROM: ${{ secrets.HOSTED_LEGAL_AID_EMAIL_FROM }}

  # Repository test only. This verdict is not F1, image or release acceptance.
  # The shared form's worker/tools inputs remain required for existing modes;
  # this job neither consumes those inputs nor asserts worker-image equivalence.
  required_worker_delivery:
    name: TEST ONLY — required worker-delivery repository suite
    if: inputs.mode == 'required_worker_delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      RELEASE_INTEGRATION_BRANCH: captain-release
      APPLICATION_SHA_INPUT: ${{ inputs.application_sha }}
    steps:
      - name: Require an exact application commit SHA
        run: |
          set -euo pipefail
          [[ "$APPLICATION_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::application_sha must be a full commit SHA"; exit 1; }

      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release ancestry and check out the exact application
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$RELEASE_INTEGRATION_BRANCH"
          git cat-file -e "${APPLICATION_SHA_INPUT}^{commit}" || { echo "::error::application_sha does not resolve"; exit 1; }
          git merge-base --is-ancestor "$APPLICATION_SHA_INPUT" "origin/$RELEASE_INTEGRATION_BRANCH" || { echo "::error::application_sha is outside the canonical integration history"; exit 1; }
          git checkout --detach "$APPLICATION_SHA_INPUT"
          [ "$(git rev-parse HEAD)" = "$APPLICATION_SHA_INPUT" ] || { echo "::error::application checkout does not match the requested SHA"; exit 1; }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies from the frozen lockfile
        run: npm ci

      - name: Install the suite's PostgreSQL and PDF-text prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-16 postgresql-client-16 poppler-utils

      - name: Run the unchanged required worker-delivery suite
        id: required_suite
        run: |
          set +e
          node scripts/verify-rcap-render-worker-delivery.mjs
          test_exit_status=$?
          printf 'exit_status=%s\n' "$test_exit_status" >> "$GITHUB_OUTPUT"
          exit "$test_exit_status"

      - name: Record the test-only result
        if: always()
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          TEST_OUTCOME: ${{ steps.required_suite.outcome }}
          TEST_EXIT_STATUS: ${{ steps.required_suite.outputs.exit_status }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const input = process.env.APPLICATION_SHA_INPUT ?? '';
          const applicationSha = input.length === 40 && /^[0-9a-f]{40}$/.test(input) ? input : null;
          const exitStatus = /^\d+$/.test(process.env.TEST_EXIT_STATUS ?? '') ? Number(process.env.TEST_EXIT_STATUS) : null;
          const passed = process.env.TEST_OUTCOME === 'success' && exitStatus === 0;
          fs.mkdirSync('required-worker-delivery-evidence', { recursive: true });
          fs.writeFileSync('required-worker-delivery-evidence/result.json', JSON.stringify({
            mode: 'required_worker_delivery',
            releaseAcceptance: false,
            applicationSha,
            workflowSha: process.env.WORKFLOW_SHA,
            runId: process.env.GITHUB_RUN_ID,
            testExitStatus: exitStatus,
            result: passed ? 'PASS' : exitStatus === null ? 'NOT_COMPLETED' : 'FAIL'
          }, null, 2) + '\n');
          NODE

      - name: Upload minimal test-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcap-required-worker-delivery-${{ github.run_id }}
          path: required-worker-delivery-evidence/result.json
          if-no-files-found: error

  f1:
    name: Ephemeral F1 staging rehearsal (rcap-ci-staging)
    if: inputs.mode == 'ephemeral' || inputs.mode == ''
    env:
      # Preproduction only; production jobs retain their existing containment.
      RELEASE_INTEGRATION_BRANCH: captain-release
      # Accepted by read-only run 36132255563; scoped to this nonproduction job.
      AUTHORIZED_WORKER_SOURCE_SHA: 2742392d59579d823cd0cdc54456f5e80a210aaf
      AUTHORIZED_WORKER_DIGEST: sha256:80c6da8c14cd8f09bba81a2b8d0385ac2b2f40bbde16464acc80aa83db0e4813
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Refuse any input that is not the authorized pinned value
        env:
          APPLICATION_SHA_INPUT: ${{ inputs.application_sha }}
          WORKER_SOURCE_SHA_INPUT: ${{ inputs.worker_source_sha }}
          WORKER_DIGEST_INPUT: ${{ inputs.worker_digest }}
          TOOLS_SHA_INPUT: ${{ inputs.tools_sha }}
          WORKFLOW_SHA_INPUT: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLICATION_SHA_INPUT" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::application_sha must be a full commit SHA"; exit 1; }
          [ "$WORKER_SOURCE_SHA_INPUT" = "$AUTHORIZED_WORKER_SOURCE_SHA" ] || { echo "::error::worker_source_sha is not the authorized value"; exit 1; }
          [ "$WORKER_DIGEST_INPUT" = "$AUTHORIZED_WORKER_DIGEST" ] || { echo "::error::worker_digest is not the authorized value"; exit 1; }
          printf '%s' "$TOOLS_SHA_INPUT" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::tools_sha must be a full commit SHA"; exit 1; }
          [ "$TOOLS_SHA_INPUT" = "$WORKFLOW_SHA_INPUT" ] || { echo "::error::tools_sha must equal the workflow source SHA"; exit 1; }

      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Verify ancestry and image-input equivalence of every pinned SHA
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$RELEASE_INTEGRATION_BRANCH"
          for SHA in "${{ inputs.application_sha }}" "${{ inputs.worker_source_sha }}" "${{ inputs.tools_sha }}"; do
            git cat-file -e "${SHA}^{commit}" || { echo "::error::$SHA does not resolve"; exit 1; }
            git merge-base --is-ancestor "$SHA" "origin/$RELEASE_INTEGRATION_BRANCH" || { echo "::error::$SHA is outside the canonical integration history"; exit 1; }
          done
          git merge-base --is-ancestor "${{ inputs.worker_source_sha }}" "${{ inputs.application_sha }}" \
            || { echo "::error::the accepted worker source is not an ancestor of the final application candidate"; exit 1; }
          git merge-base --is-ancestor "${{ inputs.application_sha }}" "${{ inputs.tools_sha }}" \
            || { echo "::error::the final application candidate is not an ancestor of the workflow tools SHA"; exit 1; }
          # The tools commit must carry the exact application and worker bytes:
          # if this diff is empty, building once at tools_sha builds the pinned
          # application SHA's bytes, and the worker fingerprint is unchanged.
          node scripts/rcap-application-inputs.mjs --base "${{ inputs.application_sha }}" --head "${{ inputs.tools_sha }}"
          node scripts/verify-rcap-application-candidate.mjs --application "${{ inputs.application_sha }}"
          # Worker equivalence is decided by the canonical resolver. The list
          # this step used to carry named seven paths and omitted
          # Dockerfile.dockerignore, the supplemental guides, the brand asset
          # and every Docker COPY-derived input, so it could report no drift
          # while the planner required a rebuild.
          node scripts/verify-rcap-worker-input-equivalence.mjs \
            --base "${{ inputs.worker_source_sha }}" --head "${{ inputs.application_sha }}" \
            --label "accepted worker source -> final application" \
            || { echo "::error::final application changes canonical worker inputs; build and pin one new full-SHA image"; exit 1; }
          node scripts/verify-rcap-worker-input-equivalence.mjs \
            --base "${{ inputs.application_sha }}" --head "${{ inputs.tools_sha }}" \
            --label "final application -> workflow tools" \
            || { echo "::error::workflow tools differ from the final application on worker inputs"; exit 1; }
          git checkout --detach "${{ inputs.tools_sha }}"

      - name: Authenticate to GHCR and pull the worker by immutable digest
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin \
            || { echo "::error::GHCR authentication failed"; exit 1; }
          REF="$IMAGE_REPOSITORY@$AUTHORIZED_WORKER_DIGEST"
          docker pull "$REF" || { echo "::error::pull by immutable digest failed"; exit 1; }
          ACTUAL="$(docker inspect --format='{{index .RepoDigests 0}}' "$REF" | sed 's/.*@//')"
          [ "$ACTUAL" = "$AUTHORIZED_WORKER_DIGEST" ] || { echo "::error::pulled digest $ACTUAL differs from authorized digest"; exit 1; }
          echo "Pulled $REF (digest verified; the mutable tag was never used)"

      - name: Start the disposable Supabase stack (runner-local only)
        run: |
          set -euo pipefail
          npm install -g supabase@2
          supabase init --force >/dev/null
          # Only the required services: Postgres, Auth, PostgREST, Storage,
          # Kong, and the mail catcher. Everything binds to the runner's
          # loopback; no port is exposed beyond this machine.
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta
          supabase status -o env > /tmp/supabase.env
          cat /tmp/supabase.env | sed 's/KEY=.*/KEY=***REDACTED***/' || true

      - name: Apply the verified migration sequence and run the stack-integration matrix
        env:
          F1_APPLICATION_SHA: ${{ inputs.application_sha }}
        run: |
          set -euo pipefail
          set -a; source /tmp/supabase.env; set +a
          export F1_SUPABASE_URL="${API_URL:-http://127.0.0.1:54321}"
          export F1_DB_URL="${DB_URL:-postgresql://postgres:postgres@127.0.0.1:54322/postgres}"
          export F1_ANON_KEY="${ANON_KEY}"
          export F1_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY}"
          export F1_MAILPIT_API="${INBUCKET_URL:-http://127.0.0.1:54324}/api/v1"
          export F1_WORKER_DIGEST_REF="$IMAGE_REPOSITORY@$AUTHORIZED_WORKER_DIGEST"

          # The application at the pinned SHA, delivery route disabled.
          export NEXT_PUBLIC_SUPABASE_URL="$F1_SUPABASE_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$F1_ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$F1_SERVICE_ROLE_KEY"
          export SUPABASE_URL="$F1_SUPABASE_URL"
          export STRIPE_SECRET_KEY="sk_test_f1_ephemeral_dummy"
          export STRIPE_WEBHOOK_SECRET="whsec_f1_ephemeral_dummy"
          npm run build
          unset RCAP_CONSUMER_DELIVERY_ROUTE_STATE || true
          nohup npx next start -p 3000 > /tmp/app-disabled.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3000/ && break; sleep 2; done

          export F1_APP_URL="http://127.0.0.1:3000"
          export F1_FLIP_CMD='pkill -f "next start" || true; sleep 2; RCAP_CONSUMER_DELIVERY_ROUTE_STATE=staging_scoped RCAP_CONSUMER_DELIVERY_STAGING_SCOPE=f1-scope-1,f1-scope-2 nohup npx next start -p 3000 > /tmp/app-scoped.log 2>&1 & for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3000/ && break; sleep 2; done'
          export F1_ROLLBACK_CMD='pkill -f "next start" || true; sleep 2; nohup npx next start -p 3000 > /tmp/app-rolledback.log 2>&1 & for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3000/ && break; sleep 2; done'

          node scripts/f1-ephemeral-staging-stack.mjs

      - name: Run the deep behavioural matrix (repository battery on the runner)
        run: |
          set -euo pipefail
          node scripts/verify-rcap-phase52-consumer-payment-authority.mjs
          node scripts/verify-rcap-phase53-consumer-job-binding.mjs
          node scripts/verify-rcap-phase51-consumer-payment-security.mjs
          node scripts/verify-expungement-consumer-payment-http.mjs
          node scripts/verify-rcap-consumer-person-namespace.mjs
          node scripts/verify-rcap-packet-delivery-db.mjs
          node scripts/verify-rcap-render-worker-delivery.mjs
          node scripts/verify-rcap-packet-delivery-e2e.mjs

      - name: Collect sanitized evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p f1-evidence
          for f in /tmp/app-disabled.log /tmp/app-scoped.log /tmp/app-rolledback.log; do
            [ -f "$f" ] && sed -E 's/(key|token|secret|password)[^ ]*/\1=***REDACTED***/Ig' "$f" > "f1-evidence/$(basename "$f")" || true
          done
          echo "{\"stagingEnvironmentName\":\"$STAGING_ENVIRONMENT_NAME\",\"applicationSha\":\"${{ inputs.application_sha }}\",\"workerSourceSha\":\"${{ inputs.worker_source_sha }}\",\"workerDigest\":\"$AUTHORIZED_WORKER_DIGEST\",\"toolsSha\":\"${{ inputs.tools_sha }}\",\"runId\":\"${{ github.run_id }}\"}" > f1-evidence/f1-run-identity.json

      - name: Upload the F1 evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcap-f1-evidence-${{ github.run_id }}
          path: f1-evidence/
          if-no-files-found: error

      - name: Destroy the disposable stack
        if: always()
        run: |
          pkill -f "next start" || true
          docker rm -f f1-worker 2>/dev/null || true
          supabase stop --no-backup || true
