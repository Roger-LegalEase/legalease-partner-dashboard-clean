    timeout-minutes: 20
    defaults:
      run:
        working-directory: carrier
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: carrier
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
