          printf '%s' "$WORKER_SOURCE_SHA_INPUT" | grep -Eq '^[0-9a-f]{40}$'  || { echo "::error::worker_source_sha is not the authorized value"; exit 1; }
          printf '%s' "$WORKER_DIGEST_INPUT" | grep -Eq '^sha256:[0-9a-f]{64}$'  || { echo "::error::worker_digest is not the authorized value"; exit 1; }
          printf '%s' "$TOOLS_SHA_INPUT" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::tools_sha must be a full commit SHA"; exit 1; }
          [ "$APPLICATION_SHA_INPUT" = "e312a5efa7b4882e0fbf61a5ff0ae7891ac23226" ] || exit 1
          [ "$WORKER_SOURCE_SHA_INPUT" = "5e04eafd7eaed7e71722862e651fb787ebbd296d" ] || exit 1
          [ "$WORKER_DIGEST_INPUT" = "sha256:6b6a60fc5b2d0060028526013ce37c69f748e2cccb4cfb10943f2af6cf26cfe1" ] || exit 1
          [ "$TOOLS_SHA_INPUT" = "$WORKFLOW_SHA_INPUT" ] || { echo "::error::tools_sha must equal the workflow source SHA"; exit 1; }

      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify ancestry of every pinned SHA and check out the tools commit
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CANONICAL_INTEGRATION_BRANCH"
          for SHA in "${{ inputs.application_sha }}" "${{ inputs.worker_source_sha }}" "${{ inputs.tools_sha }}"; do
            git cat-file -e "${SHA}^{commit}" || { echo "::error::$SHA does not resolve"; exit 1; }
            git merge-base --is-ancestor "$SHA" "origin/$CANONICAL_INTEGRATION_BRANCH" || { echo "::error::$SHA is outside the canonical integration history"; exit 1; }
          done
          git merge-base --is-ancestor "${{ inputs.application_sha }}" "${{ inputs.tools_sha }}" \
            || { echo "::error::the final application candidate is not an ancestor of the workflow tools SHA"; exit 1; }
          git diff --quiet "${{ inputs.application_sha }}" "${{ inputs.tools_sha }}" -- package.json package-lock.json tsconfig.json scripts/rcap-render-worker.mjs deploy/rcap-render-worker/Dockerfile scripts/lib src \
            || { echo "::error::workflow tools differ from the final application on worker inputs"; exit 1; }
          git checkout --detach "${{ inputs.tools_sha }}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frozen dependencies
        run: npm ci

      - name: Require current release and separate packet-canary authorization
        run: |
          node scripts/rcap-production-migration-contract.mjs
          node scripts/verify-rcap-worker-input-equivalence.mjs --base "${{ inputs.worker_source_sha }}" --head "${{ inputs.tools_sha }}"

      - name: Install PDF inspection utility
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils

      - name: Install read-only image inspection CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: "0.4.111"

      # No service credential or bearer promotion code exists in an earlier step.
      # This successor refuses at the gate above; this step is unreachable.
      - name: Run the separately authorized current-release packet canary
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          RCAP_LIVE_PROMOTION_CODE: ${{ inputs.promotion_code }}
          RCAP_RESUME_MATTER_ID: ${{ inputs.resume_matter_id }}
        run: |
          set -euo pipefail
          # Reject control characters before issuing a single-line mask command.
          [[ "$RCAP_LIVE_PROMOTION_CODE" != *$'\n'* && "$RCAP_LIVE_PROMOTION_CODE" != *$'\r'* ]] || exit 1
          # Mask the bearer instrument before invoking any consumer code.
          printf '::add-mask::%s\n' "$RCAP_LIVE_PROMOTION_CODE"
          node scripts/rcap-production-save-transition-probe.mjs

      - name: Retain sanitized canary evidence; never clean up Production
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcap-production-packet-canary-${{ github.run_id }}
          path: production-canary-evidence/
          if-no-files-found: ignore

  # 2026-09-16 production incident ("Save my result and continue" fails on the
  # live Mississippi result page). Reproduce: a signed-out public browser walk
  # that clicks Save and records the pending/claim statuses and sanitized error
  # codes, in Chromium and WebKit. Verify: the same walk through the one
  # authorized dedicated synthetic account to the claimed matter and back after
  # refresh, plus the signed-in path and duplicate protection. Never Stripe,
  # never packet generation, never a real customer matter.
  production_save_transition:
    name: Public save-to-Briefcase transition probe on expungement.ai
    if: inputs.mode == 'production_save_transition_reproduce' || inputs.mode == 'production_save_transition_verify' || inputs.mode == 'production_live_zero_dollar_order'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Historical Production tuple and containment stay closed to this successor.
    env:
      AUTHORIZED_WORKER_SOURCE_SHA: fe2457a71dd90d0fb83d0ed2738fcd1e6566d76e
      AUTHORIZED_WORKER_DIGEST: sha256:a22ad8559df69563a4f8b055e0efcb15de128e5ce09d75325abcbf783adff905
      CANONICAL_INTEGRATION_BRANCH: claude/legalease-sprint-captain-utucnw
    steps:
      - name: Refuse any input that is not the authorized pinned value
        env:
          APPLICATION_SHA_INPUT: ${{ inputs.application_sha }}
          WORKER_SOURCE_SHA_INPUT: ${{ inputs.worker_source_sha }}
          WORKER_DIGEST_INPUT: ${{ inputs.worker_digest }}
          TOOLS_SHA_INPUT: ${{ inputs.tools_sha }}
          WORKFLOW_SHA_INPUT: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLICATION_SHA_INPUT" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::application_sha must be a full commit SHA"; exit 1; }
          [ "$WORKER_SOURCE_SHA_INPUT" = "$AUTHORIZED_WORKER_SOURCE_SHA" ] || { echo "::error::worker_source_sha is not the authorized value"; exit 1; }
          [ "$WORKER_DIGEST_INPUT" = "$AUTHORIZED_WORKER_DIGEST" ] || { echo "::error::worker_digest is not the authorized value"; exit 1; }
          printf '%s' "$TOOLS_SHA_INPUT" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::tools_sha must be a full commit SHA"; exit 1; }
          [ "$TOOLS_SHA_INPUT" = "$WORKFLOW_SHA_INPUT" ] || { echo "::error::tools_sha must equal the workflow source SHA"; exit 1; }

      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify ancestry of every pinned SHA and check out the tools commit
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CANONICAL_INTEGRATION_BRANCH"
          for SHA in "${{ inputs.application_sha }}" "${{ inputs.worker_source_sha }}" "${{ inputs.tools_sha }}"; do
            git cat-file -e "${SHA}^{commit}" || { echo "::error::$SHA does not resolve"; exit 1; }
            git merge-base --is-ancestor "$SHA" "origin/$CANONICAL_INTEGRATION_BRANCH" || { echo "::error::$SHA is outside the canonical integration history"; exit 1; }
          done
          git checkout --detach "${{ inputs.tools_sha }}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frozen dependencies and the WebKit engine
        run: |
          npm ci
          npx playwright install --with-deps webkit

      - name: Verify the probe contract
        run: node scripts/verify-rcap-production-save-transition-probe.mjs

      - name: Probe the public save-to-Briefcase transition
        env:
          RCAP_PRODUCTION_PHASE: ${{ inputs.mode == 'production_live_zero_dollar_order' && 'live_zero_dollar_order' || (inputs.mode == 'production_save_transition_verify' && 'save_transition_verify' || 'save_transition_reproduce') }}
          RCAP_PUBLIC_ORIGIN: https://expungement.ai
          RCAP_PRODUCTION_PROJECT_REF: wwtwtsmywnckfkdaqqeg
          RCAP_PRODUCTION_SUPABASE_URL: https://wwtwtsmywnckfkdaqqeg.supabase.co
          RCAP_BROWSER_CHROMIUM: /usr/bin/google-chrome
          # The live order runs in chromium alone. The webkit pass repeats the
          # signed-out journey as a best-effort extra, and a second browser on
          # an order phase is a second real order.
          RCAP_PROBE_BROWSERS: ${{ inputs.mode == 'production_live_zero_dollar_order' && 'chromium' || 'chromium,webkit' }}
          SUPABASE_ACCESS_TOKEN: ${{ (inputs.mode == 'production_save_transition_verify' || inputs.mode == 'production_live_zero_dollar_order') && secrets.SUPABASE_ACCESS_TOKEN || '' }}
          # Supplied per run and never committed. The probe masks it in every
          # log line and every artifact.
          RCAP_LIVE_PROMOTION_CODE: ${{ inputs.mode == 'production_live_zero_dollar_order' && inputs.promotion_code || '' }}
          RCAP_RESUME_MATTER_ID: ${{ inputs.mode == 'production_live_zero_dollar_order' && inputs.resume_matter_id || '' }}
          # Read-only diagnostics for an unhandled 5xx from the application. The
          # probe reads this one deployment's runtime log with a GET and nothing
          # else on Vercel; it is supplied only for the order phase, where a
          # refusal without a sentence would otherwise be undiagnosable.
          RCAP_PRODUCTION_DEPLOYMENT_ID: ${{ inputs.mode == 'production_live_zero_dollar_order' && 'dpl_BJMUzi76BWPUbnnxE8Doim6hwkiP' || '' }}
          RCAP_PRODUCTION_DEPLOYMENT_READ_TOKEN: ${{ inputs.mode == 'production_live_zero_dollar_order' && secrets.VERCEL_TOKEN || '' }}
        run: node scripts/rcap-production-save-transition-probe.mjs

      - name: Upload the save-transition evidence (sanitized)
        if: always()
