          assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),'27eda6f6470c4f5fd37a441cbdba853ef73e74d1');assert.equal(process.env.RCAP_ADMITTED_CONTROLLER_SHA,'27eda6f6470c4f5fd37a441cbdba853ef73e74d1');
          for(const [name,hash]of Object.entries({"PENDING_WORKER_SUCCESSOR":"6becf19961e4a001ebe6693004ac409fe4be6005c6462a73331526660f094c39","RELEASE_CANDIDATE_BINDING":"86a8ce88beb3cbeec5475a93bfdea28631ef61d993f0194b509cd8b925644dff","HOSTED_TOOLS_BINDING":"22eb81f06a3451028e825da32e84edba1d6589abb926240a132db1ec85d18b65"}))assert.equal(createHash('sha256').update(fs.readFileSync('data/rcap-grade-a/launch-control/'+name+'.json')).digest('hex'),hash);
