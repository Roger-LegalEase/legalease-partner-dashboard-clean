        run: |
          test -x /usr/bin/google-chrome
          ln -s ../admitted-controller/node_modules node_modules
      - name: Require the exact original credential source object without executing it
        run: |
          if ! git cat-file -e 'd3d8ff707d4d21ab508405494e6ee27056582a1a^{commit}' 2>/dev/null; then
            git fetch --no-tags --no-write-fetch-head origin d3d8ff707d4d21ab508405494e6ee27056582a1a
          fi
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';
          const bytes=execFileSync('git',['show','d3d8ff707d4d21ab508405494e6ee27056582a1a:scripts/rcap-hosted-acceptance-auth-config.mjs'],{stdio:['ignore','pipe','ignore']});
          assert.equal(createHash('sha256').update(bytes).digest('hex'),'cdf9d28192cc54de72e6c9ccef5f389c678b7472a60c6408ad54b0735e5d695c');
          JS
      - name: Read only the original accepted native creation artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET repos/Roger-LegalEase/legalease-partner-dashboard-clean/actions/artifacts/12699943085/zip > "$RUNNER_TEMP/ordinary-admin-native.zip"
          python3 - <<'PY'
          import os,pathlib,hashlib,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP']);archive=root/'ordinary-admin-native.zip';raw=archive.read_bytes()
          assert len(raw)==10460999
          assert hashlib.sha256(raw).hexdigest()=='1d667454449b63925213f640d8bce706b041d8190398aa6fd73336e1b0d3ef84'
          with zipfile.ZipFile(archive) as z:
              entry=z.getinfo('deploy.json');assert 0<entry.file_size<=2097152;data=z.read(entry)
          assert hashlib.sha256(data).hexdigest()=='76e5b1baaf13de456482194956deedaff8f6468abef6ff0a90fe615a4c451711'
          output=root/'ordinary-admin-native';output.mkdir(mode=0o700);(output/'deploy.json').write_bytes(data);os.chmod(output/'deploy.json',0o600)
          PY
      - name: Observe the current ordinary admin through normal authentication and read-only requests
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          RCAP_ADMIN_NATIVE_DEPLOY_FILE: ${{ runner.temp }}/ordinary-admin-native/deploy.json
          ORDINARY_ADMIN_EVIDENCE_FILE: ordinary-admin-readonly-evidence/result.json
        run: node scripts/rcap-hosted-ordinary-admin-readonly-runner.mjs
      - name: Preserve only the sanitized typed read-only state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ordinary-admin-readonly-${{ github.run_id }}
          path: carrier/ordinary-admin-readonly-evidence/result.json
          if-no-files-found: warn

