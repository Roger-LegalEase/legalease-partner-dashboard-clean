  configured_sandbox_recover:
    name: Complete only the existing READY configured Preview alias
    if: inputs.mode == 'configured_sandbox_recover'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: admitted-controller
    env:
      APPLICATION_SHA_INPUT: ${{ inputs.application_sha }}
      WORKER_SOURCE_SHA_INPUT: ${{ inputs.worker_source_sha }}
      WORKER_DIGEST_INPUT: ${{ inputs.worker_digest }}
      TOOLS_SHA_INPUT: ${{ inputs.tools_sha }}
      ACCEPTANCE_SUPABASE_PROJECT_REF: ${{ inputs.supabase_project_ref }}
      RCAP_ADMITTED_CONTROLLER_SHA: 3bcfda1b814b7499d29cfa2817af2373493b68b6
      RCAP_CONFIGURED_RECOVERY_NATIVE_FILE: ${{ github.workspace }}/configured-creator/deploy.json
      RCAP_CONFIGURED_RECOVERY_RUN_FILE: ${{ github.workspace }}/carrier/configured-creator-run.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: carrier
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require the exact purpose dispatch and real carrier identity before credentials
        working-directory: carrier
        env:
          DISPATCH_INPUTS: ${{ toJSON(inputs) }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          assert.equal(process.env.GITHUB_REPOSITORY,'Roger-LegalEase/legalease-partner-dashboard-clean');assert.equal(process.env.GITHUB_ACTIONS,'true');assert.equal(process.env.GITHUB_EVENT_NAME,'workflow_dispatch');assert.equal(process.env.GITHUB_RUN_ATTEMPT,'1');
          assert.equal(process.env.GITHUB_REF_NAME,'codex/f-vercel-raw-readonly-20261026');assert.match(process.env.GITHUB_SHA,/^[a-f0-9]{40}$/);assert.equal(process.env.GITHUB_WORKFLOW_SHA,process.env.GITHUB_SHA);
          assert.equal(JSON.parse(fs.readFileSync('vercel.json')).git.deploymentEnabled[process.env.GITHUB_REF_NAME],false);
          const input=JSON.parse(process.env.DISPATCH_INPUTS);
          const expected={"mode":"configured_sandbox_recover","application_sha":"c0052e13d9801d24080275aab02c70c6ea213fa3","tools_sha":"987d0c9df170641a9abe40f0d5ec450e740abaa1","worker_source_sha":"32499751569359315248c2048fa111064a47c67f","worker_digest":"sha256:cd0d3ab9098ed47028d5d89ae5280904520f28bc7331fc9ca17b2a2978a3f494","supabase_project_ref":"hyflxnlhpmiqxvvcoiia"};
          for(const [key,value]of Object.entries(expected))assert.equal(input[key],value);
          for(const key of ['preview_hostname','preview_deployment_id','preview_creation_run_id'])assert.ok(!input[key]);
          for(const key of ['clinic_attempt_id','sponsor_case','contradiction_job_id','promotion_code','journey_state','expected_total_cents','resume_matter_id','clinic_resume_authorization','clinic_session_closure_authorization'])assert.ok(!input[key]);
          assert.equal(input.sponsor_items??'[]','[]');assert.ok(input.sponsor_fulfillment===undefined||input.sponsor_fulfillment===false||input.sponsor_fulfillment==='false');
          JS
      - uses: actions/checkout@v4
        with:
          ref: 3bcfda1b814b7499d29cfa2817af2373493b68b6
          path: admitted-controller
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the exact native HELD controller bytes separately from the real carrier
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';import {execFileSync} from 'node:child_process';
          assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),'3bcfda1b814b7499d29cfa2817af2373493b68b6');assert.equal(process.env.RCAP_ADMITTED_CONTROLLER_SHA,'3bcfda1b814b7499d29cfa2817af2373493b68b6');
          for(const [name,hash]of Object.entries({"PENDING_WORKER_SUCCESSOR":"b0937504ea0b1d6fcc0a398c6b10ff1b4d65f56073dff8d06536164e8f41d5fd","RELEASE_CANDIDATE_BINDING":"b800680e224ee32c8cffd27cd986030c10456c971596b0f779c4abfdd65ca771","HOSTED_TOOLS_BINDING":"85ff48823cb51c23044e9913f34eea80481af71af2e1bee471b3e5b90c860045"}))assert.equal(createHash('sha256').update(fs.readFileSync('data/rcap-grade-a/launch-control/'+name+'.json')).digest('hex'),hash);
          JS
      - name: Install only the admitted controller locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reuse only the admitted locked dependencies for carrier receipt parsing
        working-directory: carrier
        run: ln -s ../admitted-controller/node_modules node_modules
      - name: Read only the original failed creator identity
        working-directory: carrier
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/Roger-LegalEase/legalease-partner-dashboard-clean/actions/runs/40441747499 > configured-creator-run.json
      - name: Download only the exact existing creation receipt
        uses: actions/download-artifact@v4
        with:
          name: rcap-configured-sandbox-preview-40441747499
          run-id: 40441747499
          github-token: ${{ github.token }}
          path: configured-creator
      - name: Require the native purpose-specific HELD source gate before credentials
        env:
          PHASE_INPUT: configured_sandbox_preview_recover
        run: node scripts/rcap-configured-sandbox-recover.mjs --verify
      - name: Complete only the exact existing target alias without creation
        env:
          PHASE_INPUT: configured_sandbox_preview_recover
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/rcap-configured-sandbox-recover.mjs
      - name: Preserve only the safe native purpose creation receipt
        if: always()
