name: Platform verification — PostgreSQL 16

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_verifier
          POSTGRES_PASSWORD: test_password_not_a_secret
          POSTGRES_DB: rcap_test_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_verifier -d rcap_test_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: true
      RCAP_ALLOW_LOCAL_TEST_DATABASE: "true"
      RCAP_EXTERNAL_TEST_DATABASE_URL: postgresql://test_verifier:test_password_not_a_secret@127.0.0.1:5432/rcap_test_admin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install exact dependency lock
        run: npm ci
      - name: Refuse production-capable environment
        shell: bash
        run: |
          set -euo pipefail
          for key in VERCEL_ENV SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY DATABASE_URL POSTGRES_URL STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET; do
            [ -z "${!key:-}" ] || { echo "::error::${key} must be absent"; exit 1; }
          done
          node scripts/test-platform-verification-runtime.mjs
      - name: Run platform database suites
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p platform-verification-logs
          suites=(
            verify-shared-claim-boundary-db
            test-shared-claim-boundary-mutations
            verify-participant-data-rights
            verify-rcap-phase51-consumer-payment-security
            verify-rcap-phase52-consumer-payment-authority
            test-rcap-phase52-mutations
            verify-rcap-phase53-consumer-job-binding
            test-rcap-phase53-mutations
            verify-expungement-consumer-payment-http
            verify-rcap-packet-delivery-db
            verify-rcap-render-worker-delivery
            verify-rcap-packet-delivery-e2e
            verify-rcap-packet-render-jobs
          )
          failed=0
          passed=0
          for suite in "${suites[@]}"; do
            if node "scripts/${suite}.mjs" >"platform-verification-logs/${suite}.txt" 2>&1; then
              echo "PASS ${suite}"
              passed=$((passed + 1))
            else
              echo "FAIL ${suite}"
              failed=$((failed + 1))
            fi
          done
          {
            echo "## Platform verification"
            echo
            echo "- PostgreSQL: 16 (localhost service)"
            echo "- Suites passed: ${passed}/${#suites[@]}"
            echo "- Suites failed: ${failed}"
          } >>"$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]
      - name: Ensure mutations restored every tracked byte
        if: always()
        run: |
          node scripts/verify-tracked-mutation-safety.mjs
          git diff --exit-code
      - name: Upload sanitized failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: platform-verification-sanitized-logs
          path: platform-verification-logs/*.txt
          if-no-files-found: ignore
          retention-days: 7
