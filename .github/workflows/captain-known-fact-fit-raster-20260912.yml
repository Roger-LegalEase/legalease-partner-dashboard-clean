name: Captain one-shot known-fact repair with original canonical reuse
on:
  push:
    branches: [claude/legalease-sprint-captain-utucnw]
    paths: [.github/workflows/captain-known-fact-fit-raster-20260912.yml]
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'rcap-packet-raster-acceptance-batch.yml',
              ref: "claude/legalease-sprint-captain-utucnw",
              inputs: {"commit_sha": "900e79e966556b6286c360f95fbaeaddb85271b3", "raster_manifest_path": "data/rcap-grade-a/packet-factory-24h/warp-20260912/known-fact-fit/raster-manifest.json", "family_batch": "nm_conviction-set,nm_identity_theft-set,nm_release_without_conviction-set,co_motion_seal_conviction-set", "requested_scale": "2.5"}
            });
