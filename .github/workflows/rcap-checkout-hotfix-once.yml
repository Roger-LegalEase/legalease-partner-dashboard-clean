name: Publish stale checkout binding recovery worker once

on:
  push:
    branches:
      - claude/legalease-sprint-captain-utucnw
    paths:
      - .github/workflows/rcap-checkout-hotfix-once.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_SHA: 44ed5e395818503c0c878fd418fb9a896d591313
      IMAGE_REPOSITORY: ghcr.io/roger-legalease/rcap-render-worker
      DOCKERFILE_PATH: deploy/rcap-render-worker/Dockerfile
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact source is canonical and check it out
        run: |
          set -euo pipefail
          git fetch --no-tags origin claude/legalease-sprint-captain-utucnw
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/claude/legalease-sprint-captain-utucnw
          git checkout --detach "$SOURCE_SHA"
      - name: Set up Node for tag guard
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refuse an existing source tag
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RCAP_WORKER_TAG: ${{ env.SOURCE_SHA }}
          RCAP_WORKER_TAG_REPLACEMENT_AUTHORIZATION: ""
        run: node scripts/verify-rcap-worker-tag-integrity.mjs --guard
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-check source tag before push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RCAP_WORKER_TAG: ${{ env.SOURCE_SHA }}
          RCAP_WORKER_TAG_REPLACEMENT_AUTHORIZATION: ""
        run: node scripts/verify-rcap-worker-tag-integrity.mjs --guard
      - name: Build and push exact source
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.SOURCE_SHA }}
          provenance: false
          sbom: false
      - name: Record publication
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build.outputs.digest }}"
          printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          mkdir -p publication
          cat > publication/rcap-render-worker-publication.json <<JSON
          {
            "schemaVersion": "rcap-worker-publication/v1",
            "sourceSha": "$SOURCE_SHA",
            "releaseIntegrationBranch": "claude/legalease-sprint-captain-utucnw",
            "containedIn": "claude/legalease-sprint-captain-utucnw",
            "dockerfilePath": "$DOCKERFILE_PATH",
            "imageRepository": "$IMAGE_REPOSITORY",
            "imageTag": "$SOURCE_SHA",
            "imageReference": "$IMAGE_REPOSITORY:$SOURCE_SHA",
            "immutableRegistryDigest": "$DIGEST",
            "digestPinnedReference": "$IMAGE_REPOSITORY@$DIGEST",
            "workflowRunId": "${{ github.run_id }}",
            "workflowRunUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "mutableLatestTagCreated": false,
            "publishOnlyNoDeploy": true,
            "workerClaimingStarted": false,
            "stagingAndProductionUnchanged": true
          }
          JSON
          cat publication/rcap-render-worker-publication.json
      - name: Upload publication
        uses: actions/upload-artifact@v4
        with:
          name: rcap-render-worker-publication-${{ env.SOURCE_SHA }}
          path: publication/rcap-render-worker-publication.json
          if-no-files-found: error
