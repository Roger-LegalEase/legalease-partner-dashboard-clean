name: Checkout hotfix live zero-dollar order once

on:
  push:
    branches:
      - claude/legalease-sprint-captain-utucnw
    paths:
      - .github/workflows/rcap-checkout-hotfix-once.yml

permissions:
  contents: read
  actions: read

jobs:
  live_order:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TOOLS_SHA: 194f1555f2eaf5182c15200f3a3da5b317ffc883
      PRODUCTION_DEPLOYMENT_ID: dpl_6qREkfSYpgQGKGnTPE9qRpM7BhFV
      RESUME_MATTER_ID: c824787c-737e-484e-bb43-ff9a5c42c8f0
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tools commit is canonical and check it out
        run: |
          set -euo pipefail
          git fetch --no-tags origin claude/legalease-sprint-captain-utucnw
          git cat-file -e "$TOOLS_SHA^{commit}"
          git merge-base --is-ancestor "$TOOLS_SHA" origin/claude/legalease-sprint-captain-utucnw
          git checkout --detach "$TOOLS_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frozen dependencies
        run: npm ci

      - name: Run exact authorized live order
        env:
          RCAP_PRODUCTION_PHASE: live_zero_dollar_order
          RCAP_PUBLIC_ORIGIN: https://expungement.ai
          RCAP_PRODUCTION_PROJECT_REF: wwtwtsmywnckfkdaqqeg
          RCAP_PRODUCTION_SUPABASE_URL: https://wwtwtsmywnckfkdaqqeg.supabase.co
          RCAP_BROWSER_CHROMIUM: /usr/bin/google-chrome
          RCAP_PROBE_BROWSERS: chromium
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RCAP_LIVE_PROMOTION_CODE: CLAUDE
          RCAP_RESUME_MATTER_ID: ${{ env.RESUME_MATTER_ID }}
          RCAP_PRODUCTION_DEPLOYMENT_ID: ${{ env.PRODUCTION_DEPLOYMENT_ID }}
          RCAP_PRODUCTION_DEPLOYMENT_READ_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/rcap-production-save-transition-probe.mjs

      - name: Upload live-order evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkout-hotfix-live-order-${{ github.run_id }}
          path: production-canary-evidence/
          if-no-files-found: error
