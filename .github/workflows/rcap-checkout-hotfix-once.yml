name: Final Stripe idempotency fix tests once

on:
  push:
    branches:
      - claude/legalease-sprint-captain-utucnw
    paths:
      - .github/workflows/rcap-checkout-hotfix-once.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOTFIX_SHA: 1e02090551a089ddc503d358032600d1c9f5b5a9
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out exact Stripe idempotency fix
        run: |
          set -euo pipefail
          git cat-file -e "$HOTFIX_SHA^{commit}"
          git checkout --detach "$HOTFIX_SHA"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install frozen dependencies
        run: npm ci
      - name: Run checkout gates
        run: |
          node scripts/test-consumer-checkout-binding-recovery.mjs
          node scripts/test-consumer-checkout-stored-session.mjs
          node scripts/verify-consumer-checkout-refusals-are-classified.mjs
          node scripts/test-expungement-checkout-guards.mjs
          npx tsc --noEmit
