name: Open one ordinary payable Production checkout once (retry)

on:
  push:
    branches:
      - claude/legalease-sprint-captain-utucnw
    paths:
      - .github/workflows/rcap-checkout-hotfix-once.yml

permissions:
  contents: read
  actions: read

jobs:
  open_payable_checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TOOLS_SHA: 70e8ec2da46663cb41aa8c9bb313c902981601c2
      PRODUCTION_DEPLOYMENT_ID: dpl_5rpkFUKgmp5cGwPaLAzHxx1nUuPK
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tools commit is canonical and check it out
        run: |
          set -euo pipefail
          git fetch --no-tags origin claude/legalease-sprint-captain-utucnw
          git cat-file -e "$TOOLS_SHA^{commit}"
          git merge-base --is-ancestor "$TOOLS_SHA" origin/claude/legalease-sprint-captain-utucnw
          git checkout --detach "$TOOLS_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frozen dependencies
        run: npm ci

      - name: Open exactly one ordinary payable checkout
        env:
          RCAP_PRODUCTION_PHASE: live_open_payable_checkout
          RCAP_PUBLIC_ORIGIN: https://expungement.ai
          RCAP_PRODUCTION_PROJECT_REF: wwtwtsmywnckfkdaqqeg
          RCAP_PRODUCTION_SUPABASE_URL: https://wwtwtsmywnckfkdaqqeg.supabase.co
          RCAP_BROWSER_CHROMIUM: /usr/bin/google-chrome
          RCAP_PROBE_BROWSERS: chromium
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RCAP_PRODUCTION_DEPLOYMENT_ID: ${{ env.PRODUCTION_DEPLOYMENT_ID }}
          RCAP_PRODUCTION_DEPLOYMENT_READ_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/rcap-production-save-transition-probe.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payable-checkout-open-${{ github.run_id }}
          path: production-canary-evidence/
          if-no-files-found: error
