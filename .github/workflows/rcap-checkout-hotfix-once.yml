name: Authority hotfix acceptance Preview once

on:
  push:
    branches:
      - claude/legalease-sprint-captain-utucnw
    paths:
      - .github/workflows/rcap-checkout-hotfix-once.yml

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APPLICATION_SHA: e52628aa420677d30dd4a8a14bc9243b4e339c5e
      TOOLS_SHA: 7d6ccfe52fd228b2d44437927299d86d52e12f8a
      ACCEPTANCE_PROJECT_REF: hyflxnlhpmiqxvvcoiia
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact tools commit is canonical and check it out
        run: |
          set -euo pipefail
          git fetch --no-tags origin claude/legalease-sprint-captain-utucnw
          git cat-file -e "$TOOLS_SHA^{commit}"
          git merge-base --is-ancestor "$TOOLS_SHA" origin/claude/legalease-sprint-captain-utucnw
          git diff --quiet "$APPLICATION_SHA" "$TOOLS_SHA" -- src package.json package-lock.json tsconfig.json next.config.ts postcss.config.mjs tailwind.config.ts public docs/record-clearing/field-map-drafts data/rcap-grade-a data/rcap-render/worker-publication-evidence.json
          git checkout --detach "$TOOLS_SHA"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Create exact authority-reconciled acceptance Preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ACCEPTANCE_SUPABASE_PROJECT_REF: ${{ env.ACCEPTANCE_PROJECT_REF }}
          HOSTED_APPLICATION_SHA: ${{ env.APPLICATION_SHA }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/rcap-hosted-acceptance-deploy.mjs
      - name: Upload Preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authority-hotfix-preview-${{ github.run_id }}
          path: hosted-acceptance-evidence/
          if-no-files-found: error
