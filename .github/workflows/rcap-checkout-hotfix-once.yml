name: Reconcile checkout hotfix Grade-A authority once

on:
  push:
    branches:
      - claude/legalease-sprint-captain-utucnw
    paths:
      - .github/workflows/rcap-checkout-hotfix-once.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: claude/hotfix-release-3e3a528b5
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frozen dependencies
        run: npm ci

      - name: Install PDF inspection dependency
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Regenerate Grade-A authority from committed evidence
        run: node scripts/generate-rcap-grade-a-fulfillment-authority.mjs

      - name: Refuse worker-input or unrelated drift
        run: |
          set -euo pipefail
          echo "Generated diff:"
          git diff --name-only
          git diff --quiet -- data/rcap-grade-a/worker-static-authority.json || {
            echo "::error::worker-static authority changed; refusing app-only reconciliation"
            exit 1
          }
          unexpected="$(git diff --name-only | grep -vE '^(data/rcap-grade-a/fulfillment-authority-registry\.json|data/rcap-grade-a/fulfillment-observation-snapshot\.json|data/rcap-grade-a/fulfillment-authority-projection\.json)$' || true)"
          [ -z "$unexpected" ] || { echo "::error::unexpected generated files: $unexpected"; exit 1; }

      - name: Verify regenerated authority
        run: |
          node scripts/generate-rcap-grade-a-fulfillment-authority.mjs --check
          node scripts/verify-rcap-grade-a-fulfillment-authority.mjs

      - name: Commit exact generated authority
        run: |
          set -euo pipefail
          git config user.name "Roger-LegalEase"
          git config user.email "roger@legalease.com"
          git add data/rcap-grade-a/fulfillment-authority-registry.json                   data/rcap-grade-a/fulfillment-observation-snapshot.json                   data/rcap-grade-a/fulfillment-authority-projection.json
          git diff --cached --quiet && { echo "::error::generator produced no authority reconciliation"; exit 1; }
          git commit -m "Reconcile Grade-A authority to active Production worker publication"
          git push origin HEAD:claude/hotfix-release-3e3a528b5
