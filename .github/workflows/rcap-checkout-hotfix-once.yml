name: Live Stripe promotion code object diagnosis once

on:
  push:
    branches:
      - claude/legalease-sprint-captain-utucnw
    paths:
      - .github/workflows/rcap-checkout-hotfix-once.yml

permissions:
  contents: read
  actions: read

jobs:
  object_diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOOLS_SHA: 71f491c92c5d0f057b7315bc5188ca3b14721a06
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tools commit is canonical and check it out
        run: |
          set -euo pipefail
          git fetch --no-tags origin claude/legalease-sprint-captain-utucnw
          git cat-file -e "$TOOLS_SHA^{commit}"
          git merge-base --is-ancestor "$TOOLS_SHA" origin/claude/legalease-sprint-captain-utucnw
          git checkout --detach "$TOOLS_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frozen dependencies
        run: npm ci

      - name: Read the live Stripe objects (GET only, nothing is modified)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RCAP_PROMOTION_CODE_ID: promo_1UGe9gDLLtltioGNKb4q6wg0G
          RCAP_COUPON_ID: 3iyJ3deM
          RCAP_CHECKOUT_SESSION_ID: cs_live_b1uPiJCcydLN7Hmq8z3rYExbUXssP4LRYrElhBWAr5kx2IObCWXLeA7MXt
          RCAP_EXPECTED_PRODUCT_ID: prod_Sx3T2wUkaYKqg9
          RCAP_DASHBOARD_PRODUCT_NAME: DIY Expungment
        run: node scripts/rcap-stripe-coupon-object-diagnosis.mjs

      - name: Upload diagnosis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stripe-object-diagnosis-${{ github.run_id }}
          path: production-canary-evidence/
          if-no-files-found: error
