name: Authority hotfix production activate once

on:
  push:
    branches:
      - claude/legalease-sprint-captain-utucnw
    paths:
      - .github/workflows/rcap-checkout-hotfix-once.yml

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APPLICATION_SHA: e52628aa420677d30dd4a8a14bc9243b4e339c5e
      TOOLS_SHA: be8873371e37ceae8a653370ca505c1e9fb5b06b
      WORKER_SOURCE_SHA: 8517a9b0ecf107605fe3094f23175d6a344f0244
      WORKER_DIGEST: sha256:c3a8d59c3c96b675a1e3dcc9cc35df08a5e5a4b5bdb635cf7f5e97137b97a534
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact tools commit is canonical and check it out
        run: |
          set -euo pipefail
          git fetch --no-tags origin claude/legalease-sprint-captain-utucnw
          git cat-file -e "$TOOLS_SHA^{commit}"
          git merge-base --is-ancestor "$TOOLS_SHA" origin/claude/legalease-sprint-captain-utucnw
          git checkout --detach "$TOOLS_SHA"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download exact successful smoke evidence
        uses: actions/download-artifact@v4
        with:
          name: authority-hotfix-smoke-35303179580
          path: prior-production-smoke-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35303179580
      - name: Activate exact staged authority hotfix
        env:
          RCAP_PRODUCTION_PHASE: activate
          RCAP_APPLICATION_SHA: ${{ env.APPLICATION_SHA }}
          RCAP_WORKER_SOURCE_SHA: ${{ env.WORKER_SOURCE_SHA }}
          RCAP_WORKER_DIGEST: ${{ env.WORKER_DIGEST }}
          RCAP_PRODUCTION_SMOKE_EVIDENCE_FILE: prior-production-smoke-evidence/production-canary-smoke.json
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/rcap-production-activate.mjs
      - name: Upload activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authority-hotfix-activation-${{ github.run_id }}
          path: production-canary-evidence/
          if-no-files-found: error
