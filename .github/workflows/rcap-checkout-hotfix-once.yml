name: Stale checkout binding recovery tests once

on:
  push:
    branches:
      - claude/legalease-sprint-captain-utucnw
    paths:
      - .github/workflows/rcap-checkout-hotfix-once.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APPLICATION_SHA: 44ed5e395818503c0c878fd418fb9a896d591313
      TOOLS_SHA: 07d9408f556a54cd24bd8d11e64d6aabef91fa78
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tools are canonical and application bytes are exact
        run: |
          set -euo pipefail
          git fetch --no-tags origin claude/legalease-sprint-captain-utucnw
          git cat-file -e "$TOOLS_SHA^{commit}"
          git merge-base --is-ancestor "$TOOLS_SHA" origin/claude/legalease-sprint-captain-utucnw
          git diff --quiet "$APPLICATION_SHA" "$TOOLS_SHA" -- src package.json package-lock.json tsconfig.json next.config.ts postcss.config.mjs tailwind.config.ts public docs/record-clearing/field-map-drafts
          git checkout --detach "$TOOLS_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frozen dependencies
        run: npm ci

      - name: Run focused checkout recovery gates
        run: |
          node scripts/test-consumer-checkout-binding-recovery.mjs
          node scripts/test-consumer-checkout-stored-session.mjs
          node scripts/verify-consumer-checkout-refusals-are-classified.mjs
          npx tsc --noEmit
