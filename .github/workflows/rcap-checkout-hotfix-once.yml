name: Inspect the CLAUDE4 Session customer shape once

on:
  push:
    branches:
      - claude/legalease-sprint-captain-utucnw
    paths:
      - .github/workflows/rcap-checkout-hotfix-once.yml

permissions:
  contents: read
  actions: read

jobs:
  object_diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOOLS_SHA: c71bd4a67f366d47302aeba7aebe1a1095a535e9
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tools commit is canonical and check it out
        run: |
          set -euo pipefail
          git fetch --no-tags origin claude/legalease-sprint-captain-utucnw
          git cat-file -e "$TOOLS_SHA^{commit}"
          git merge-base --is-ancestor "$TOOLS_SHA" origin/claude/legalease-sprint-captain-utucnw
          git checkout --detach "$TOOLS_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frozen dependencies
        run: npm ci

      - name: Read the live Stripe objects (GET only, nothing is modified)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RCAP_STRIPE_READ_KEY: ${{ secrets.RCAP_STRIPE_READ_KEY }}
          RCAP_PROMOTION_CODE: CLAUDE4
          RCAP_CHECKOUT_SESSION_ID: cs_live_b1H8b8JhxrBq0nrDDPEizF9Fkv8UeXMsna8ipJpHydTUYWekCR3sVyprjj
          RCAP_EXPECTED_PRODUCT_ID: prod_VHEHkvH7dSvGv7
          RCAP_DASHBOARD_PRODUCT_NAME: RCAP acceptance consumer packet
        run: node scripts/rcap-stripe-coupon-object-diagnosis.mjs

      - name: Upload diagnosis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude4-session-shape-${{ github.run_id }}
          path: production-canary-evidence/
          if-no-files-found: error
