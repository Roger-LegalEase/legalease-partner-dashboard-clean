name: Resolve the customer-creation worker digest once

on:
  push:
    branches:
      - claude/legalease-sprint-captain-utucnw
    paths:
      - .github/workflows/rcap-checkout-hotfix-once.yml

permissions:
  contents: read
  packages: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: 8682bd00731e247a4fe93f39075c532476eb5c74
      IMAGE_REPOSITORY: ghcr.io/roger-legalease/rcap-render-worker
    steps:
      - name: Resolve the immutable digest of the published tag
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          docker pull "$IMAGE_REPOSITORY:$SOURCE_SHA" >/dev/null
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_REPOSITORY:$SOURCE_SHA" | sed 's/.*@//')"
          REVISION="$(docker inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE_REPOSITORY:$SOURCE_SHA")"
          [ "$REVISION" = "$SOURCE_SHA" ]
          echo "RESOLVED_WORKER_SOURCE_SHA=$REVISION"
          echo "RESOLVED_WORKER_DIGEST=$DIGEST"
