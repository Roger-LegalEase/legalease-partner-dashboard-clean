name: Authority hotfix production preflight once

on:
  push:
    branches:
      - claude/legalease-sprint-captain-utucnw
    paths:
      - .github/workflows/rcap-checkout-hotfix-once.yml

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APPLICATION_SHA: e52628aa420677d30dd4a8a14bc9243b4e339c5e
      TOOLS_SHA: 2edb40e968ac1ef87a2ecf3ef3946f52c07dd5d4
      WORKER_SOURCE_SHA: 8517a9b0ecf107605fe3094f23175d6a344f0244
      WORKER_DIGEST: sha256:c3a8d59c3c96b675a1e3dcc9cc35df08a5e5a4b5bdb635cf7f5e97137b97a534
      IMAGE_REPOSITORY: ghcr.io/roger-legalease/rcap-render-worker
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact tools commit is canonical and check it out
        run: |
          set -euo pipefail
          git fetch --no-tags origin claude/legalease-sprint-captain-utucnw
          git cat-file -e "$TOOLS_SHA^{commit}"
          git merge-base --is-ancestor "$TOOLS_SHA" origin/claude/legalease-sprint-captain-utucnw
          git diff --quiet "$APPLICATION_SHA" "$TOOLS_SHA" -- src package.json package-lock.json tsconfig.json next.config.ts postcss.config.mjs tailwind.config.ts public docs/record-clearing/field-map-drafts data/rcap-grade-a data/rcap-render/worker-publication-evidence.json
          git diff --quiet "$WORKER_SOURCE_SHA" "$TOOLS_SHA" -- package.json package-lock.json tsconfig.json scripts/rcap-render-worker.mjs deploy/rcap-render-worker/Dockerfile scripts/lib src
          git checkout --detach "$TOOLS_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Production canary contract
        run: node scripts/verify-rcap-production-canary.mjs

      - name: Pull and identify accepted worker
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          REF="$IMAGE_REPOSITORY@$WORKER_DIGEST"
          docker pull "$REF" >/dev/null
          ACTUAL="$(docker inspect --format='{{index .RepoDigests 0}}' "$REF" | sed 's/.*@//')"
          REVISION="$(docker inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' "$REF")"
          [ "$ACTUAL" = "$WORKER_DIGEST" ]
          [ "$REVISION" = "$WORKER_SOURCE_SHA" ]

      - name: Run Production preflight
        env:
          RCAP_PRODUCTION_PHASE: preflight
          RCAP_APPLICATION_SHA: ${{ env.APPLICATION_SHA }}
          RCAP_ACCEPTED_TOOLS_SHA: ${{ env.APPLICATION_SHA }}
          RCAP_TOOLS_SHA: ${{ env.TOOLS_SHA }}
          RCAP_WORKER_SOURCE_SHA: ${{ env.WORKER_SOURCE_SHA }}
          RCAP_WORKER_DIGEST: ${{ env.WORKER_DIGEST }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/rcap-production-canary.mjs

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authority-hotfix-preflight-${{ github.run_id }}
          path: production-canary-evidence/
          if-no-files-found: error
