name: Stale checkout binding recovery production smoke once

on:
  push:
    branches:
      - claude/legalease-sprint-captain-utucnw
    paths:
      - .github/workflows/rcap-checkout-hotfix-once.yml

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APPLICATION_SHA: 44ed5e395818503c0c878fd418fb9a896d591313
      TOOLS_SHA: 0b714715b172aba83e14797f817784aa9a1bc3f2
      WORKER_SOURCE_SHA: 44ed5e395818503c0c878fd418fb9a896d591313
      WORKER_DIGEST: sha256:c1443d8cc027588b3cbc6c6b3514b356fcedec5bba6058f950e4646eb2787ea0
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact tools commit is canonical and check it out
        run: |
          set -euo pipefail
          git fetch --no-tags origin claude/legalease-sprint-captain-utucnw
          git cat-file -e "$TOOLS_SHA^{commit}"
          git merge-base --is-ancestor "$TOOLS_SHA" origin/claude/legalease-sprint-captain-utucnw
          git diff --quiet "$APPLICATION_SHA" "$TOOLS_SHA" -- src package.json package-lock.json tsconfig.json next.config.ts postcss.config.mjs tailwind.config.ts public docs/record-clearing/field-map-drafts
          git diff --quiet "$WORKER_SOURCE_SHA" "$TOOLS_SHA" -- package.json package-lock.json tsconfig.json scripts/rcap-render-worker.mjs deploy/rcap-render-worker/Dockerfile scripts/lib src
          git checkout --detach "$TOOLS_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frozen dependencies
        run: npm ci

      - name: Verify smoke control
        run: |
          node scripts/verify-rcap-production-smoke.mjs
          node scripts/test-rcap-production-smoke-mutations.mjs

      - name: Run recovery Production smoke
        env:
          RCAP_PRODUCTION_PHASE: smoke
          RCAP_APPLICATION_SHA: ${{ env.APPLICATION_SHA }}
          RCAP_WORKER_SOURCE_SHA: ${{ env.WORKER_SOURCE_SHA }}
          RCAP_WORKER_DIGEST: ${{ env.WORKER_DIGEST }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/rcap-production-canary-smoke.mjs

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stale-binding-smoke-${{ github.run_id }}
          path: production-canary-evidence/
          if-no-files-found: error
