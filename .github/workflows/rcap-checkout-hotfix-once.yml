name: Final Stripe idempotency production preflight once

on:
  push:
    branches:
      - claude/legalease-sprint-captain-utucnw
    paths:
      - .github/workflows/rcap-checkout-hotfix-once.yml

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APPLICATION_SHA: b06831f96624315429dc72bfe0b7ce8a2c342748
      TOOLS_SHA: fc04d5155c4f8cb81b5c2040c796e51a57adfb3d
      WORKER_SOURCE_SHA: b06831f96624315429dc72bfe0b7ce8a2c342748
      WORKER_DIGEST: sha256:464d11429da0d7c6e9257d1696c21399d1cbf76ede7dae1e4d064f88eefbbb3e
      IMAGE_REPOSITORY: ghcr.io/roger-legalease/rcap-render-worker
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact tools commit is canonical and check it out
        run: |
          set -euo pipefail
          git fetch --no-tags origin claude/legalease-sprint-captain-utucnw
          git cat-file -e "$TOOLS_SHA^{commit}"
          git merge-base --is-ancestor "$TOOLS_SHA" origin/claude/legalease-sprint-captain-utucnw
          git diff --quiet "$APPLICATION_SHA" "$TOOLS_SHA" -- src package.json package-lock.json tsconfig.json next.config.ts postcss.config.mjs tailwind.config.ts public docs/record-clearing/field-map-drafts
          git diff --quiet "$WORKER_SOURCE_SHA" "$TOOLS_SHA" -- package.json package-lock.json tsconfig.json scripts/rcap-render-worker.mjs deploy/rcap-render-worker/Dockerfile scripts/lib src
          git checkout --detach "$TOOLS_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull and identify accepted worker
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          REF="$IMAGE_REPOSITORY@$WORKER_DIGEST"
          docker pull "$REF" >/dev/null
          ACTUAL="$(docker inspect --format='{{index .RepoDigests 0}}' "$REF" | sed 's/.*@//')"
          REVISION="$(docker inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' "$REF")"
          [ "$ACTUAL" = "$WORKER_DIGEST" ]
          [ "$REVISION" = "$WORKER_SOURCE_SHA" ]

      - name: Run final Production preflight
        env:
          RCAP_PRODUCTION_PHASE: preflight
          RCAP_APPLICATION_SHA: ${{ env.APPLICATION_SHA }}
          RCAP_ACCEPTED_TOOLS_SHA: ${{ env.APPLICATION_SHA }}
          RCAP_TOOLS_SHA: ${{ env.TOOLS_SHA }}
          RCAP_WORKER_SOURCE_SHA: ${{ env.WORKER_SOURCE_SHA }}
          RCAP_WORKER_DIGEST: ${{ env.WORKER_DIGEST }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/rcap-production-canary.mjs

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-stripe-preflight-${{ github.run_id }}
          path: production-canary-evidence/
          if-no-files-found: error
