name: Regenerate accepted checkout hotfix Grade-A authority once

on:
  push:
    branches:
      - claude/legalease-sprint-captain-utucnw
    paths:
      - .github/workflows/rcap-checkout-hotfix-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: claude/hotfix-release-3e3a528b5
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Generate authority against accepted hotfix worker
        run: node scripts/generate-rcap-grade-a-fulfillment-authority.mjs
      - name: Refuse worker-static or unrelated drift
        run: |
          set -euo pipefail
          git diff --quiet -- data/rcap-grade-a/worker-static-authority.json || { echo "::error::worker-static authority changed"; exit 1; }
          unexpected="$(git diff --name-only | grep -vE '^(data/rcap-grade-a/fulfillment-authority-registry\.json|data/rcap-grade-a/fulfillment-observation-snapshot\.json|data/rcap-grade-a/fulfillment-authority-projection\.json)$' || true)"
          [ -z "$unexpected" ] || { echo "::error::unexpected drift: $unexpected"; exit 1; }
      - name: Verify authority and Mississippi commercial status
        run: |
          set -euo pipefail
          node scripts/generate-rcap-grade-a-fulfillment-authority.mjs --check
          node scripts/verify-rcap-grade-a-fulfillment-authority.mjs
          node - <<'JS'
          const p=require('./data/rcap-grade-a/fulfillment-authority-projection.json');
          const route=p.routes.find(r=>r.routeId==='MS:non-conviction-expungement-for-dismissal-no-disposition-or-acquittal');
          console.log(JSON.stringify(route));
          if (!route || route.state!=='COMPLETE_PACKET_PROVEN' || route.commercialStatus!=='commercially_eligible') process.exit(1);
          JS
      - name: Commit generated authority
        run: |
          set -euo pipefail
          git config user.name "Roger-LegalEase"
          git config user.email "roger@legalease.com"
          git add data/rcap-grade-a/fulfillment-authority-registry.json data/rcap-grade-a/fulfillment-observation-snapshot.json data/rcap-grade-a/fulfillment-authority-projection.json
          git diff --cached --quiet && { echo "::error::no generated authority change"; exit 1; }
          git commit -m "Regenerate Grade-A authority for accepted checkout hotfix worker"
          git push origin HEAD:claude/hotfix-release-3e3a528b5
