name: Expungement.ai commercial flow

on:
  workflow_dispatch:
    inputs:
      run_sandbox:
        description: Run the isolated Stripe sandbox payment regression
        type: boolean
        default: false
      run_human:
        description: Keep one isolated test Checkout and database alive for a human operator
        type: boolean
        default: false
  push:
    branches:
      - codex/expungement-ai-free-briefcase-paid-packet
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/expungement-ai-commercial-flow.yml
      - docs/product-flows/**
      - design-handoff/expungement-ai-frontend/files-20/Expungement-Landing-Full.html
      - package.json
      - package-lock.json
      - scripts/lib/ts-esm-loader.mjs
      - scripts/test-expungement-consumer-payment-receipt.mjs
      - scripts/test-expungement-consumer-verifier-mutations.mjs
      - scripts/test-commercial-readiness.mjs
      - scripts/test-briefcase-presentation-authority.mjs
      - scripts/test-expungement-checkout-guards.mjs
      - scripts/test-rcap-consumer-payment-http-mutations.mjs
      - scripts/verify-expungement-authenticated-nav.mjs
      - scripts/verify-expungement-commercial-browser.mjs
      - scripts/verify-expungement-commercial-flow-contract.mjs
      - scripts/verify-expungement-landing-copy-safety.mjs
      - scripts/verify-expungement-homepage-interactions.mjs
      - scripts/verify-expungement-date-year-selector.mjs
      - scripts/verify-expungement-profile-screening-flow.mjs
      - scripts/verify-expungement-pending-result-migration.mjs
      - scripts/verify-product-flow-docs.mjs
      - scripts/verify-rcap-partner-result-cta.mjs
      - scripts/verify-rcap-partner-result-lanes.mjs
      - scripts/verify-rcap-phase55-matter-payment-binding.mjs
      - scripts/verify-we-must-vote-launch.mjs
      - src/app/api/expungement-ai/**
      - src/app/api/stripe/webhook/**
      - src/app/briefcase/**
      - src/app/expungement-ai/**
      - src/components/expungement-ai/**
      - src/lib/expungement-ai/**
      - src/lib/partners/we-must-vote-routing.ts
      - src/lib/rcap-engine/contracts.ts
      - src/lib/stripe/**
      - src/proxy.ts
      - supabase/phase-51-rcap-consumer-payment-gate.sql
      - supabase/phase-52-rcap-consumer-payment-authority.sql
      - supabase/phase-53-rcap-consumer-job-binding.sql
      - supabase/phase-54-rcap-person-namespace-hardening.sql
      - supabase/phase-55-expungement-matter-payment-binding.sql

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.run_human && 'human' || 'default' }}
  cancel-in-progress: ${{ !inputs.run_human }}

jobs:
  verify:
    if: ${{ !inputs.run_sandbox && !inputs.run_human }}
    name: Verify free Briefcase and matter-level packet payment
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Lint the commercial-flow implementation
        run: >-
          npx eslint
          src/app/api/expungement-ai
          src/app/briefcase
          src/app/expungement-ai
          src/components/expungement-ai
          src/lib/expungement-ai
          src/lib/partners/we-must-vote-routing.ts
          src/proxy.ts
          scripts/test-expungement-consumer-payment-receipt.mjs
          scripts/test-expungement-consumer-verifier-mutations.mjs
          scripts/test-commercial-readiness.mjs
          scripts/test-briefcase-presentation-authority.mjs
          scripts/test-expungement-checkout-guards.mjs
          scripts/test-rcap-consumer-payment-http-mutations.mjs
          scripts/verify-expungement-authenticated-nav.mjs
          scripts/verify-expungement-commercial-browser.mjs
          scripts/verify-expungement-commercial-flow-contract.mjs
          scripts/verify-expungement-landing-copy-safety.mjs
          scripts/verify-expungement-homepage-interactions.mjs
          scripts/verify-expungement-date-year-selector.mjs
          scripts/verify-expungement-profile-screening-flow.mjs
          scripts/verify-expungement-pending-result-migration.mjs
          scripts/verify-product-flow-docs.mjs
          scripts/verify-rcap-partner-result-cta.mjs
          scripts/verify-rcap-partner-result-lanes.mjs
          scripts/verify-rcap-phase55-matter-payment-binding.mjs
          scripts/verify-we-must-vote-launch.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Verify the approved product-flow contract
        run: node scripts/verify-product-flow-docs.mjs

      - name: Verify approved public website copy
        run: |
          node scripts/verify-expungement-landing-copy-safety.mjs
          node scripts/verify-expungement-homepage-interactions.mjs

      - name: Verify free screening and pending-result handoff
        run: |
          node scripts/verify-expungement-profile-screening-flow.mjs
          node scripts/verify-expungement-pending-result-migration.mjs

      - name: Verify free Briefcase and builder behavior
        run: |
          node scripts/verify-expungement-commercial-flow-contract.mjs
          node scripts/verify-expungement-date-year-selector.mjs

      - name: Verify authenticated Briefcase and RCAP presentation
        run: |
          node scripts/verify-expungement-authenticated-nav.mjs
          node scripts/verify-rcap-partner-result-cta.mjs
          node scripts/verify-rcap-partner-result-lanes.mjs
          node scripts/verify-we-must-vote-launch.mjs

      - name: Verify owner-scoped financial history and receipt mutations
        run: node scripts/test-expungement-consumer-verifier-mutations.mjs

      - name: Verify server commercial readiness and participant actions
        run: |
          node scripts/test-commercial-readiness.mjs
          node scripts/test-briefcase-presentation-authority.mjs

      - name: Verify final-review Checkout guards
        run: node scripts/test-expungement-checkout-guards.mjs

      - name: Verify exact matter-level payment authority
        run: node scripts/verify-rcap-phase55-matter-payment-binding.mjs

      - name: Verify payment HTTP mutations stay blocked
        run: node scripts/test-rcap-consumer-payment-http-mutations.mjs

  stripe-sandbox-regression:
    if: ${{ inputs.run_sandbox || inputs.run_human }}
    name: ${{ inputs.run_human && 'Human-assisted isolated Stripe verification' || 'Automated Stripe sandbox regression' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.run_human && 70 || 20 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify unchanged approved application source
        run: |
          git fetch --depth=1 origin 4c189b682d0a9225a21b9fdf8a2ebc50500029d6
          git diff --exit-code 4c189b682d0a9225a21b9fdf8a2ebc50500029d6 -- src supabase data package.json package-lock.json next.config.*
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
        if: ${{ !inputs.run_human }}
      - name: Run real sandbox Checkout and signed webhook against disposable PostgreSQL
        if: ${{ !inputs.run_human }}
        env:
          HOSTED_STRIPE_TEST_SECRET: ${{ secrets.HOSTED_STRIPE_TEST_SECRET }}
          HOSTED_STRIPE_TEST_WEBHOOK_SECRET: ${{ secrets.HOSTED_STRIPE_TEST_WEBHOOK_SECRET }}
          QA_APPLICATION_SHA: 4c189b682d0a9225a21b9fdf8a2ebc50500029d6
          RCAP_PARTNER_ONBOARDING_ENABLED: "true"
          RCAP_2_0_ENABLED: "true"
        run: node scripts/verify-expungement-consumer-payment-http.mjs --stripe-sandbox --write
      - name: Prepare human-assisted Checkout and keep its database alive
        if: ${{ inputs.run_human }}
        env:
          HOSTED_STRIPE_TEST_SECRET: ${{ secrets.HOSTED_STRIPE_TEST_SECRET }}
          HOSTED_STRIPE_TEST_WEBHOOK_SECRET: ${{ secrets.HOSTED_STRIPE_TEST_WEBHOOK_SECRET }}
          QA_APPLICATION_SHA: 4c189b682d0a9225a21b9fdf8a2ebc50500029d6
          RCAP_PARTNER_ONBOARDING_ENABLED: "true"
          RCAP_2_0_ENABLED: "true"
        run: |
          set -euo pipefail
          nohup bash -c 'set +e; node scripts/verify-expungement-consumer-payment-http.mjs --stripe-human --write; qa_result=$?; printf "%s\n" "$qa_result" > "$RUNNER_TEMP/stripe-human.exit"' > "$RUNNER_TEMP/stripe-human.log" 2>&1 < /dev/null &
          for attempt in $(seq 1 180); do
            if test -s data/rcap-render/stripe-human-handoff.cms && test -s data/rcap-render/stripe-human-status.json; then
              cat data/rcap-render/stripe-human-status.json
              exit 0
            fi
            if test -f "$RUNNER_TEMP/stripe-human.exit"; then cat "$RUNNER_TEMP/stripe-human.log"; exit 1; fi
            sleep 2
          done
          echo "Human handoff was not prepared within six minutes."
          exit 1
      - name: Publish encrypted Checkout handoff only
        if: ${{ inputs.run_human }}
        uses: actions/upload-artifact@v4
        with:
          name: stripe-human-encrypted-handoff-${{ github.run_id }}
          path: |
            data/rcap-render/stripe-human-handoff.cms
            data/rcap-render/stripe-human-status.json
          if-no-files-found: error
          retention-days: 1
      - name: Wait for human test payment and verify real event, replay and PDF delivery
        if: ${{ inputs.run_human }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 600); do
            if test -f "$RUNNER_TEMP/stripe-human.exit"; then
              cat "$RUNNER_TEMP/stripe-human.log"
              qa_result=$(cat "$RUNNER_TEMP/stripe-human.exit")
              exit "$qa_result"
            fi
            sleep 5
          done
          echo "Human verification runtime exceeded its controlled window."
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-stripe-sandbox-regression
          path: |
            data/rcap-render/consumer-payment-http.json
            data/rcap-render/stripe-sandbox-regression.json
            data/rcap-render/stripe-sandbox-packet.pdf
          if-no-files-found: warn
