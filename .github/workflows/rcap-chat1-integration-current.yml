name: RCAP Chat 1 saved integration completion
on:
  push:
    branches: [chatgpt/launch-recovery-20260906]
    paths: [.github/workflows/rcap-chat1-integration-current.yml]
permissions:
  contents: read
concurrency:
  group: rcap-chat1-current-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'Roger-LegalEase/legalease-partner-dashboard-clean' && github.ref == 'refs/heads/chatgpt/launch-recovery-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    env:
      EXPECTED_PARENT: d13f4a1ef7ed6282bf414f77a5e578804e464cef
      ARTIFACT_HEAD: fa01d8a3290dad8d0fbf717cf341e21b91438fa8
      REVIEW: d219b7cda0b5e7a315e7a735fe3d09cebf69075c
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Recover the exact saved candidate without forwarding GitHub authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/chat1-integration"
          git config user.name 'LegalEase integration (ChatGPT)'
          git config user.email 'noreply@legalease.com'
          python3 - <<'PY'
          import hashlib,io,json,os,pathlib,subprocess,urllib.request,urllib.parse,zipfile
          def api_request(url, token):
              if urllib.parse.urlsplit(url).scheme != 'https' or urllib.parse.urlsplit(url).netloc != 'api.github.com':
                  raise ValueError('Credential destination must be the GitHub API')
              request=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json'})
              request.add_unredirected_header('Authorization','Bearer '+token)
              return request
          # Exercise the actual urllib redirect implementation with a nonsecret sentinel.
          redirect=urllib.request.HTTPRedirectHandler()
          request=api_request('https://api.github.com/repos/test/test/actions/artifacts/1/zip','test-only-sentinel')
          assert request.get_header('Authorization')=='Bearer test-only-sentinel'
          for target in ['https://example.blob.core.windows.net/test?sig=test','https://api.github.com/redirected']:
              forwarded=redirect.redirect_request(request,None,302,'Found',{},target)
              assert not forwarded.has_header('Authorization')
              assert forwarded.get_header('Accept')=='application/vnd.github+json'
          try:api_request('https://example.blob.core.windows.net/test','test-only-sentinel')
          except ValueError:pass
          else:raise AssertionError('Credential origin guard failed')
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'chat1-integration'
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY'];review=os.environ['REVIEW']
          def read_api(endpoint):
              with urllib.request.urlopen(api_request(base+endpoint,os.environ['GH_TOKEN']),timeout=120) as response:return response.read()
          meta=json.loads(read_api('/actions/artifacts/10029199530'))
          expected='4c587f83bcfe9d329173182c347fe3c11940abd474b557be76fd55e9ba5cb849'
          assert meta['id']==10029199530 and not meta['expired'] and meta.get('digest')=='sha256:'+expected
          assert meta['workflow_run']['id']==34150401392 and meta['workflow_run']['head_sha']==os.environ['ARTIFACT_HEAD']
          archive=read_api('/actions/artifacts/10029199530/zip')
          assert len(archive)==352758 and hashlib.sha256(archive).hexdigest()==expected
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              matches=[n for n in z.namelist() if pathlib.PurePosixPath(n).name=='unpublished-candidate.patch']
              assert len(matches)==1
              patch=z.read(matches[0])
          patchfile=out/'saved-candidate.patch';patchfile.write_bytes(patch)
          paths=[r.split('\t',2)[2] for r in subprocess.check_output(['git','apply','--numstat',str(patchfile)],text=True).splitlines()]
          workflow='.github/workflows/rcap-chat1-integration-current.yml'
          prefixes=('scripts/grade-a-packet-factory-24h/','data/rcap-grade-a/','docs/rcap/grade-a/')
          assert paths and len(paths)==len(set(paths))
          assert all(p==workflow or p.startswith(prefixes) or (p.startswith('data/rcap-all50/overlays/') and p.endswith('/product-wiring.json')) for p in paths)
          assert not any(p.endswith(('.pdf','.docx','.ttf','.woff','.woff2')) or '..' in pathlib.PurePosixPath(p).parts for p in paths)
          review_paths=subprocess.check_output(['git','diff','--name-only','24176d664c02f4f732fcf0ae03db63f14a77c820...'+review],text=True).splitlines()
          review_prefixes=('data/rcap-grade-a/chat-parallel-2026-09-07/review/','docs/rcap/grade-a/chat-parallel-2026-09-07/review/')
          assert len(review_paths)==14 and all(p.startswith(review_prefixes) for p in review_paths)
          subprocess.run(['git','merge','--no-ff','--no-commit',review],check=True)
          exclusions=['--exclude='+p+'*' for p in review_prefixes]+['--exclude='+workflow]
          subprocess.run(['git','apply','--check',*exclusions,str(patchfile)],check=True)
          subprocess.run(['git','apply',*exclusions,str(patchfile)],check=True)
          for p in review_paths:assert pathlib.Path(p).read_bytes()==subprocess.check_output(['git','show',review+':'+p])
          (out/'saved-candidate-inputs.json').write_text(json.dumps({'artifactId':10029199530,'failedRunId':34150401392,'archiveSha256':expected,'patchSha256':hashlib.sha256(patch).hexdigest(),'artifactHead':os.environ['ARTIFACT_HEAD'],'reviewCommit':review,'reviewFiles':review_paths,'patchFiles':paths,'redirectControls':6,'credentialsForwardedOnRedirect':False,'publicationGrantedByRecovery':False},indent=2)+'\n')
          print('Exact candidate recovered; fourteen review files and reviewer ancestry preserved.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked validation dependencies without rendering packets
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Stabilize only raster output serialization and verify semantic identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,hashlib,json,os
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'chat1-integration'
          p=pathlib.Path('scripts/grade-a-packet-factory-24h/generate-raster-queue.mjs');before=p.read_text()
          assert hashlib.sha256(before.encode()).hexdigest()=='eb577f5b6d9dc1cd79f0efd6a87ac3d14225b6ce9d45348592c51d496a0f6cc2'
          anchor='JSON.stringify(doc, null, 2)';assert before.count(anchor)==1
          helper='''
          // Deterministic output representation only. Document hashes and acceptance predicates are unchanged.
          function rasterStableObject(value) {
            if (Array.isArray(value)) return value.map(rasterStableObject);
            if (value && typeof value === 'object' && Object.getPrototypeOf(value) === Object.prototype) {
              return Object.fromEntries(Object.keys(value).sort().map(key => [key, rasterStableObject(value[key])]));
            }
            return value;
          }
          '''
          after=before.replace(anchor,'JSON.stringify(rasterStableObject(doc), null, 2)')+'\n'+helper;p.write_text(after)
          validator=pathlib.Path('scripts/grade-a-packet-factory-24h/validate-chat1-integration.py');v=validator.read_text()
          assert hashlib.sha256(v.encode()).hexdigest()=='3a1dbb8b8799f80436806391ab5c5a695147d224f40829c2bf01bf4e27d7fd4a'
          anchor=" 'validate-chat1-integration.py',";assert v.count(anchor)==1
          validator.write_text(v.replace(anchor," 'validate-chat1-integration.py','generate-raster-queue.mjs',"))
          # Capture the original generator's output on this exact checkout before testing the new serializer.
          (out/'raster-original-generator.mjs').write_text(before)
          (out/'serialization-repair.json').write_text(json.dumps({'file':str(p),'beforeSha256':hashlib.sha256(before.encode()).hexdigest(),'afterSha256':hashlib.sha256(after.encode()).hexdigest(),'serializerCallSitesChanged':1,'documentHashingUnchanged':True,'changesAcceptancePredicates':False,'additionalAllowedPath':str(p)},indent=2)+'\n')
          tests="import assert from 'node:assert/strict';\n"+helper+'''
          const a={z:[{b:2,a:1},null],a:{q:'hash',p:false}}, b={a:{p:false,q:'hash'},z:[{a:1,b:2},null]};
          const before=JSON.stringify(a), s=x=>JSON.stringify(rasterStableObject(x));
          assert.equal(s(a),s(b));assert.deepEqual(JSON.parse(s(a)),a);assert.equal(JSON.stringify(a),before);
          assert.notEqual(s([1,2]),s([2,1]));assert.notEqual(s({sha256:'a'}),s({sha256:'b'}));
          assert.notEqual(s({complete:true}),s({complete:false}));assert.equal(s({x:0,y:false,z:null}),'{"x":0,"y":false,"z":null}');
          assert.equal(s(new Date('2026-09-07T00:00:00Z')),JSON.stringify(new Date('2026-09-07T00:00:00Z')));
          console.log('8 serializer controls passed.');
          '''
          (out/'serialization-controls.mjs').write_text(tests)
          PY
          node "$RUNNER_TEMP/chat1-integration/serialization-controls.mjs" | tee "$RUNNER_TEMP/chat1-integration/serialization-controls.log"
          python3 - <<'PY'
          import pathlib,os,subprocess,json,hashlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'chat1-integration';p=pathlib.Path('scripts/grade-a-packet-factory-24h/generate-raster-queue.mjs');new=p.read_bytes()
          try:
              p.write_bytes((out/'raster-original-generator.mjs').read_bytes())
              with (out/'raster-before.log').open('w') as log:subprocess.run(['node',str(p)],check=True,stdout=log,stderr=subprocess.STDOUT)
              before=json.loads(pathlib.Path('data/rcap-grade-a/packet-factory-24h/RASTER_QUEUE.json').read_text())
          finally:p.write_bytes(new)
          with (out/'raster-after.log').open('w') as log:subprocess.run(['node',str(p)],check=True,stdout=log,stderr=subprocess.STDOUT)
          after=json.loads(pathlib.Path('data/rcap-grade-a/packet-factory-24h/RASTER_QUEUE.json').read_text())
          assert before==after,'Changing serialization changed actual receipt content'
          assert after['packetCommitSha']==os.environ['GITHUB_SHA']
          (out/'raster-semantic-comparison.json').write_text(json.dumps({'sameCheckout':os.environ['GITHUB_SHA'],'parsedBeforeEqualsAfter':True,'comparedRows':len(after['rows']),'comparedHistoricalRows':len(after.get('historicalRasterRows',[])),'ignoredFields':[],'packetRebuilds':0},indent=2)+'\n')
          print('Original and corrected generators produce exactly equal parsed manifests on the same checkout.')
          PY
          node scripts/grade-a-packet-factory-24h/generate-raster-queue.mjs --check
      - name: Prepare and run every existing admission, normal and mutation check
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/chat1-integration"
          python3 scripts/grade-a-packet-factory-24h/validate-chat1-integration.py --base "$GITHUB_SHA" --out "$out/prepare" --prepare
          node scripts/grade-a-packet-factory-24h/generate-raster-queue.mjs --check
          python3 - <<'PY'
          import os,pathlib,subprocess
          p=pathlib.Path('scripts/grade-a-packet-factory-24h/validate-chat1-integration.py').resolve();ns={'__file__':str(p),'__name__':'integration_scope'};exec(compile(p.read_text(),str(p),'exec'),ns)
          paths=ns['scope'](os.environ['GITHUB_SHA']);assert paths
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git diff --cached --check
          git commit -m 'fix(rcap): consume exact independent reviews and stabilize raster output serialization'
          git rev-parse HEAD > "$out/implementation-sha.txt"
          python3 scripts/grade-a-packet-factory-24h/validate-chat1-integration.py --base "$GITHUB_SHA" --out "$out/validate"
      - name: Publish measured completion to the unchanged recovery branch only
        run: |
          set -euo pipefail
          evidence='data/rcap-grade-a/chat-parallel-2026-09-07/chat1-integration/hosted-validation'
          mkdir -p "$evidence"
          cp -R "$RUNNER_TEMP/chat1-integration/prepare" "$RUNNER_TEMP/chat1-integration/validate" "$evidence/"
          cp "$RUNNER_TEMP/chat1-integration/"{saved-candidate-inputs.json,serialization-repair.json,serialization-controls.mjs,serialization-controls.log,raster-semantic-comparison.json,implementation-sha.txt} "$evidence/"
          git add -- "$evidence"
          git commit -m 'test(rcap): retain full integration checks and exact raster semantic comparison'
          python3 - <<'PY'
          import os,pathlib
          p=pathlib.Path('scripts/grade-a-packet-factory-24h/validate-chat1-integration.py').resolve();ns={'__file__':str(p),'__name__':'integration_scope'};exec(compile(p.read_text(),str(p),'exec'),ns)
          ns['scope'](os.environ['GITHUB_SHA']);ns['census'](os.environ['GITHUB_SHA'])
          PY
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/chatgpt/launch-recovery-20260906 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/chatgpt/launch-recovery-20260906
          git rev-parse HEAD > "$RUNNER_TEMP/chat1-integration/publication-sha.txt"
          git diff --binary "$GITHUB_SHA" HEAD > "$RUNNER_TEMP/chat1-integration/published.patch"
      - name: Retain exact unpushed changes if any check fails
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/chat1-integration"
          git status --short > "$RUNNER_TEMP/chat1-integration/failure-status.txt"
          git diff --binary "$GITHUB_SHA" > "$RUNNER_TEMP/chat1-integration/unpublished-candidate.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat1-integration-${{ github.run_id }}
          path: ${{ runner.temp }}/chat1-integration/
          retention-days: 14
          if-no-files-found: error
