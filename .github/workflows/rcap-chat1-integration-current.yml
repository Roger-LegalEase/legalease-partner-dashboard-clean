name: RCAP Chat 1 reconciled contracts and Arizona selectors
on:
  push:
    branches: [chatgpt/launch-recovery-20260906]
    paths: [.github/workflows/rcap-chat1-integration-current.yml]
permissions:
  contents: read
concurrency:
  group: rcap-chat1-current-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'Roger-LegalEase/legalease-partner-dashboard-clean' && github.ref == 'refs/heads/chatgpt/launch-recovery-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      EXPECTED_PARENT: 38e7bf5e684d5c3cdfb147929a3ee49668f36101
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact current inputs and consume the two reconciled local patches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/chat1-contracts"
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,subprocess,urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'chat1-contracts'
          sha=lambda b:hashlib.sha256(b).hexdigest()
          gitblob=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          chunks=[]
          for blob in ['1d11d272d2d08044c949c6b04f0990523d17a843','a2f46adf68ac4d6453b1f181539fa87087afd744','b266d6cdaee7fb0040fdab7bc1d766f15a5c819f','50ce6602f233cae918ccfeed934d8d376403472e']:
              url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+blob
              req=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json'})
              req.add_unredirected_header('Authorization','Bearer '+os.environ['GH_TOKEN'])
              with urllib.request.urlopen(req,timeout=60) as response: item=json.load(response)
              raw=base64.b64decode(item['content']);assert gitblob(raw)==blob
              chunks.append(raw)
          payload_bytes=base64.b64decode(b''.join(chunks),validate=True)
          assert len(payload_bytes)==20876 and sha(payload_bytes)=='436180e2adef3055723e6dc23cca472c4a77074e46b50c0f30d84bbf898db4ed'
          payload=json.loads(gzip.decompress(payload_bytes));assert payload['schemaVersion']=='chat1-bounded-contract-integration/v1'
          assert payload['observedRecoveryHead']==os.environ['EXPECTED_PARENT']
          prefix='scripts/rcap-packet-recovery/chat1/'
          expected={'data/record-clearing/legal-design-track-registry.json','scripts/grade-a-packet-factory-24h/generate-product-wiring.mjs','scripts/grade-a-packet-factory-24h/test-product-wiring-refreshes-artifact-identity.mjs'}|{prefix+p for p in ['source-contract-corrections.mjs','test-source-contract-corrections.mjs','il-education-components.mjs','test-il-education-components.mjs','az-filing-court.mjs','test-az-filing-court.mjs','test-pa-790-optional-order.mjs']}
          assert len(payload['files'])==10 and {f['path'] for f in payload['files']}==expected
          for f in payload['files']:
              p=pathlib.Path(f['path'])
              if f['beforeGitBlob'] is None:assert not p.exists(),f['path']+' already exists'
              else:assert p.is_file() and gitblob(p.read_bytes())==f['beforeGitBlob'],f['path']+' changed since baseline'
          registry=pathlib.Path('data/record-clearing/legal-design-track-registry.json')
          (out/'registry-before.json').write_bytes(registry.read_bytes())
          master=pathlib.Path('data/rcap-grade-a/packet-factory-24h/MASTER_QUEUE.json')
          (out/'master-before.json').write_bytes(master.read_bytes())
          patch=payload.pop('patch').encode();assert sha(patch)==payload['patchSha256']=='29e90a72f851eb4ae812d0349a731afd348451aab1895f83cbec2e9ec11f0ef8'
          patchfile=out/'implementation.patch';patchfile.write_bytes(patch)
          paths={r.split('\t',2)[2] for r in subprocess.check_output(['git','apply','--numstat',str(patchfile)],text=True).splitlines()}
          assert paths==expected
          subprocess.run(['git','apply','--check',str(patchfile)],check=True)
          subprocess.run(['git','apply',str(patchfile)],check=True)
          for f in payload['files']:assert sha(pathlib.Path(f['path']).read_bytes())==f['afterSha256'],f['path']
          before=json.loads((out/'registry-before.json').read_text());after=json.loads(registry.read_text())
          changed=[a['trackId'] for a,b in zip(before['tracks'],after['tracks']) if a!=b]
          assert len(before['tracks'])==len(after['tracks'])==503
          assert changed==payload['changedTrackIds']
          assert {k:v for k,v in before.items() if k!='tracks'}=={k:v for k,v in after.items() if k!='tracks'}
          payload['actualChangedTrackIds']=changed;payload['workflowInputCommit']=os.environ['GITHUB_SHA']
          (out/'input-bindings.json').write_text(json.dumps(payload,indent=2)+'\n')
          print('Ten exact implementation paths installed. Five track objects changed; other 498 and current DE/NC handlers preserved.')
          PY
      - name: Install locked validation dependencies without rendering packets
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Exercise focused fixes, update derived metadata and run combined validation
        run: |
          python3 - <<'PY'
          import collections,hashlib,json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'chat1-contracts';results=[]
          def run(name,cmd):
              before=hashlib.sha256(subprocess.check_output(['git','diff','HEAD','--binary'])).hexdigest()
              with (out/(name+'.log')).open('w') as log:
                  try:code=subprocess.run(cmd,stdout=log,stderr=subprocess.STDOUT,timeout=540).returncode
                  except subprocess.TimeoutExpired:code=124
              restored=hashlib.sha256(subprocess.check_output(['git','diff','HEAD','--binary'])).hexdigest()==before
              results.append({'name':name,'command':cmd,'exitCode':code,'trackedFilesRestored':restored})
              (out/'commands.json').write_text(json.dumps(results,indent=2)+'\n')
              print(name,code,'unchanged',restored,flush=True)
              if code:print((out/(name+'.log')).read_text()[-7000:],flush=True)
              return code,restored
          scoped=['test-source-contract-corrections','test-il-education-components','test-az-filing-court','test-pa-790-optional-order']
          for script in scoped:
              code,restored=run(script,['node','scripts/rcap-packet-recovery/chat1/'+script+'.mjs']);assert code==0 and restored
          for script in ['test-product-wiring-refreshes-artifact-identity','test-de-guidance-binding','test-de-reviewed-guidance','test-nc-declared-delivery']:
              code,restored=run(script,['node','scripts/grade-a-packet-factory-24h/'+script+'.mjs']);assert code==0 and restored
          generators=['extract-verifier-returns','generate','generate-source-conveyor','generate-washington-repair','generate-source-relationship-registry','generate-raster-queue']
          for iteration in [1,2]:
              for script in generators:
                  code,_=run(script+'-prepare-'+str(iteration),['node','scripts/grade-a-packet-factory-24h/'+script+'.mjs']);assert code==0
          ids=['az_record_sealing_arrest_no_charges-set','az_record_sealing_dismissal_not_guilty-set']
          master=json.loads(pathlib.Path('data/rcap-grade-a/packet-factory-24h/MASTER_QUEUE.json').read_text())
          for family in ids:
              for check in [False,True]:
                  command=['node','scripts/grade-a-packet-factory-24h/generate-product-wiring.mjs','--family',family]+(['--check'] if check else [])
                  code,restored=run(family+('-check' if check else '-generate'),command);assert code==0 and (not check or restored)
          for script in generators:
              code,restored=run(script+'-convergence',['node','scripts/grade-a-packet-factory-24h/'+script+'.mjs','--check']);assert code==0 and restored
          for script in ['verify','verify-source-conveyor','verify-acq-promo-handoff','verify-lane-contracts','verify-source-relationship-model']:
              for mutation in [False,True]:
                  command=['node','scripts/grade-a-packet-factory-24h/'+script+'.mjs']+(['--mutations'] if mutation else [])
                  code,restored=run(script+('-mutations' if mutation else ''),command);assert code==0 and restored
          old=json.loads((out/'master-before.json').read_text());new=json.loads(pathlib.Path('data/rcap-grade-a/packet-factory-24h/MASTER_QUEUE.json').read_text())
          states=lambda doc:{f['familyId']:f['state'] for f in doc['families']}
          assert states(old)==states(new),'Contract correction changed family states'
          terminal={'COMPLETE_PACKET_PROVEN','GUIDANCE_READY','HANDOFF_READY','OUT_OF_SCOPE'}
          count=sum(f['state'] in terminal for f in new['families'])
          assert len(new['families'])==346 and count==178
          report={'status':'PASS','runId':os.environ['GITHUB_RUN_ID'],'inputCommit':os.environ['GITHUB_SHA'],'checks':results,'terminalBefore':178,'terminalAfter':count,'terminalDelta':0,'allFamilyStatesPreserved':True,'states':dict(collections.Counter(states(new).values())),'packetRebuilds':0,'packetApprovalsAdded':0,'runtimeInstalled':False,'productionTouched':False}
          (out/'results.json').write_text(json.dumps(report,indent=2)+'\n')
          print('All focused, convergence and ten normal/mutation suites passed; 178/346 and every family state preserved.')
          PY
      - name: Publish only the validated scoped implementation to unchanged recovery
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,shutil,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'chat1-contracts';manifest=json.loads((out/'input-bindings.json').read_text());assert json.loads((out/'results.json').read_text())['status']=='PASS'
          evidence=pathlib.Path('data/rcap-grade-a/chat-parallel-2026-09-07/chat1-contracts-integration');evidence.mkdir(parents=True,exist_ok=True)
          for p in out.iterdir():
              if p.name not in ['registry-before.json','master-before.json']:shutil.copyfile(p,evidence/p.name)
          exact={f['path'] for f in manifest['files']}
          master=json.loads(pathlib.Path('data/rcap-grade-a/packet-factory-24h/MASTER_QUEUE.json').read_text())
          for f in master['families']:
              if f['familyId'] in ['az_record_sealing_arrest_no_charges-set','az_record_sealing_dismissal_not_guilty-set']:exact.add(f['directory']+'/product-wiring.json')
          prefixes=('data/rcap-grade-a/packet-factory-24h/','docs/rcap/grade-a/packet-factory-24h/',str(evidence)+'/')
          changed=set(subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines())|set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert all(p in exact or p.startswith(prefixes) for p in changed),sorted(changed-exact)
          assert not any(p.endswith(('.pdf','.docx','.ttf','.woff','.woff2')) for p in changed)
          assert 'data/record-clearing/legal-design-track-registry.json' in changed
          (out/'published-paths.json').write_text(json.dumps(sorted(changed),indent=2)+'\n')
          subprocess.run(['git','add','--',*sorted(changed)],check=True)
          PY
          git diff --cached --check
          test "$(git ls-remote origin refs/heads/chatgpt/launch-recovery-20260906 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'LegalEase integration (ChatGPT)'
          git config user.email 'noreply@legalease.com'
          git commit -m 'fix(rcap): reconcile MO MI IL PA contract corrections and AZ court selection'
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/chatgpt/launch-recovery-20260906
          git rev-parse HEAD > "$RUNNER_TEMP/chat1-contracts/publication-sha.txt"
          git diff --binary "$GITHUB_SHA" HEAD > "$RUNNER_TEMP/chat1-contracts/published.patch"
      - name: Retain exact unpublished implementation if a check fails
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/chat1-contracts"
          git status --short > "$RUNNER_TEMP/chat1-contracts/failure-status.txt"
          git diff --binary "$GITHUB_SHA" > "$RUNNER_TEMP/chat1-contracts/unpublished.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat1-contracts-${{ github.run_id }}
          path: ${{ runner.temp }}/chat1-contracts/
          retention-days: 14
          if-no-files-found: error
