name: RCAP Chat 1 exact NC text correction
on:
  push:
    branches: [chatgpt/launch-recovery-20260906]
    paths: [.github/workflows/rcap-chat1-integration-current.yml]
permissions:
  contents: read
concurrency:
  group: rcap-chat1-current-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'Roger-LegalEase/legalease-partner-dashboard-clean' && github.ref == 'refs/heads/chatgpt/launch-recovery-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      EXPECTED_PARENT: d2ddf7300b06a5bdf88e01442bea13afa83a8e6d
      AUTHOR_COMMIT: 4c79607c7985e1f7b95ece153f3d16867b49007e
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply only the existing author-verified two-text-file patch and original test
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/nc-chronology"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'nc-chronology';author=os.environ['AUTHOR_COMMIT']
          get=lambda p:subprocess.check_output(['git','show',author+':'+p])
          blob=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          sha=lambda b:hashlib.sha256(b).hexdigest()
          stem='data/rcap-grade-a/chat-parallel-2026-09-07/build/nc-guide-chronology/'
          handoff_bytes=get(stem+'PUBLICATION_HANDOFF.json');assert blob(handoff_bytes)=='af90d358c2aa31965c049f660b04ef1ccb5bb967'
          handoff=json.loads(handoff_bytes);assert handoff['family']=='nc_146_dismissal_petition-set'
          patch=get(stem+'chronology.patch');assert blob(patch)=='bed01804e5019ff5910f1ef1f585579c8da1fcb0' and sha(patch)==handoff['patchSha256']
          host='scripts/build-census-v1-nc_146_dismissal_petition-set.mjs'
          guide='data/rcap-all50/overlays/census-v1/nc/nc-146-dismissal-petition-set--official-pdf-fill/participant-instructions.md'
          test='scripts/rcap-packet-recovery/chat3/test-nc-guide-chronology.mjs';test_bytes=get(test);assert blob(test_bytes)=='d81e657cf88b71f62b91253e3a5014c7369f2420'
          assert blob(pathlib.Path(host).read_bytes())==handoff['baselineHostBlob']
          assert blob(pathlib.Path(guide).read_bytes())==handoff['baselineGuideBlob']
          patchfile=out/'author.patch';patchfile.write_bytes(patch)
          paths={x.split('\t',2)[2] for x in subprocess.check_output(['git','apply','--numstat',str(patchfile)],text=True).splitlines()};assert paths=={host,guide}
          p=pathlib.Path(test)
          if p.exists():assert p.read_bytes()==test_bytes,'Conflicting newer test'
          subprocess.run(['git','apply','--check',str(patchfile)],check=True);subprocess.run(['git','apply',str(patchfile)],check=True)
          p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(test_bytes)
          assert sha(pathlib.Path(host).read_bytes())==handoff['newHostSha256'] and sha(pathlib.Path(guide).read_bytes())==handoff['newGuideSha256']
          (out/'author-handoff.json').write_bytes(handoff_bytes)
          master='data/rcap-grade-a/packet-factory-24h/MASTER_QUEUE.json';(out/'master-before.json').write_bytes(pathlib.Path(master).read_bytes())
          (out/'input-bindings.json').write_text(json.dumps({'authorCommit':author,'workflowInputCommit':os.environ['GITHUB_SHA'],'authorPatchSha256':sha(patch),'files':[{'path':x,'sha256':sha(pathlib.Path(x).read_bytes()),'gitBlob':blob(pathlib.Path(x).read_bytes())} for x in [host,guide,test]],'rebuildsRequested':0,'independentApproval':False},indent=2)+'\n')
          PY
      - name: Install locked dependencies for existing text and factory tests
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Execute the original Markdown generator test and converge current records
        run: |
          set -euo pipefail
          node scripts/rcap-packet-recovery/chat3/test-nc-guide-chronology.mjs > "$RUNNER_TEMP/nc-chronology/text-test-results.json"
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'nc-chronology';r=json.loads((out/'text-test-results.json').read_text())
          assert r['fullMarkdownGenerationPasses']==2 and r['allBytesMatched'] and r['existingDisclosureRows']==60 and r['negativeCount']==8 and r['pdfFilesWritten']==0
          generators=['extract-verifier-returns','generate','generate-source-conveyor','generate-washington-repair','generate-source-relationship-registry','generate-raster-queue']
          for iteration in [1,2]:
              for script in generators:
                  with (out/(script+'-'+str(iteration)+'.log')).open('w') as log:code=subprocess.run(['node','scripts/grade-a-packet-factory-24h/'+script+'.mjs'],stdout=log,stderr=subprocess.STDOUT,timeout=540).returncode
                  assert code==0,(script,iteration)
          master='data/rcap-grade-a/packet-factory-24h/MASTER_QUEUE.json'
          old=json.loads((out/'master-before.json').read_text());new=json.loads(pathlib.Path(master).read_text())
          states=lambda d:{f['familyId']:f['state'] for f in d['families']};assert states(old)==states(new),'Text-only repair unexpectedly changed a family state'
          changed=set(subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines())|set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          bindings=json.loads((out/'input-bindings.json').read_text());exact={f['path'] for f in bindings['files']}
          assert all(p in exact or p.startswith(('data/rcap-grade-a/packet-factory-24h/','docs/rcap/grade-a/packet-factory-24h/')) for p in changed),sorted(changed-exact)
          assert not any(p.endswith(('.pdf','.docx','.ttf','.woff','.woff2')) or p.startswith('.github/') for p in changed)
          subprocess.run(['git','add','--',*sorted(changed)],check=True)
          (out/'implementation-paths.json').write_text(json.dumps(sorted(changed),indent=2)+'\n')
          PY
          git diff --cached --check
          git config user.name 'LegalEase integration (ChatGPT)'
          git config user.email 'noreply@legalease.com'
          git commit -m 'fix(rcap): install Chat 3 NC post-order clerk certification instructions'
      - name: Validate the committed correction without rebuilding packets
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'nc-chronology';commands=[];results=[]
          for script in ['extract-verifier-returns','generate','generate-source-conveyor','generate-washington-repair','generate-source-relationship-registry','generate-raster-queue']:
              commands.append((script+'-check',['node','scripts/grade-a-packet-factory-24h/'+script+'.mjs','--check']))
          for script in ['verify','verify-source-conveyor','verify-acq-promo-handoff','verify-lane-contracts','verify-source-relationship-model']:
              for mutation in [False,True]:commands.append((script+('-mutations' if mutation else ''),['node','scripts/grade-a-packet-factory-24h/'+script+'.mjs']+(['--mutations'] if mutation else [])))
          for name,cmd in commands:
              with (out/(name+'.log')).open('w') as log:
                  try:code=subprocess.run(cmd,stdout=log,stderr=subprocess.STDOUT,timeout=540).returncode
                  except subprocess.TimeoutExpired:code=124
              clean=not subprocess.check_output(['git','status','--porcelain']).strip();results.append({'name':name,'command':cmd,'exitCode':code,'cleanWorktreeRestored':clean})
              (out/'commands.json').write_text(json.dumps(results,indent=2)+'\n');print(name,code,clean,flush=True)
              if code:print((out/(name+'.log')).read_text()[-5000:])
              assert code==0 and clean,name
          bindings=json.loads((out/'input-bindings.json').read_text())
          for f in bindings['files']:assert hashlib.sha256(pathlib.Path(f['path']).read_bytes()).hexdigest()==f['sha256'],f['path']
          master='data/rcap-grade-a/packet-factory-24h/MASTER_QUEUE.json';before=json.loads((out/'master-before.json').read_text());after=json.loads(pathlib.Path(master).read_text())
          states=lambda d:{f['familyId']:f['state'] for f in d['families']};assert states(before)==states(after)
          terminal={'COMPLETE_PACKET_PROVEN','GUIDANCE_READY','HANDOFF_READY','OUT_OF_SCOPE'};count=sum(f['state'] in terminal for f in after['families'])
          assert count==178 and len(after['families'])==346
          record={'status':'PASS','runId':os.environ['GITHUB_RUN_ID'],'inputCommit':os.environ['GITHUB_SHA'],'checkedCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'authorCommit':os.environ['AUTHOR_COMMIT'],'checks':results,'actualMarkdownGeneratorTest':json.loads((out/'text-test-results.json').read_text()),'allFamilyStatesPreserved':True,'terminalFamilies':178,'denominator':346,'terminalDelta':0,'ncState':states(after)['nc_146_dismissal_petition-set'],'packetRebuilds':0,'packetPdfWrites':0,'independentGuideReviewPending':True,'productionTouched':False}
          (out/'results.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
      - name: Publish tested text correction only to unchanged recovery
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip,json,os,pathlib,shutil,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'nc-chronology';assert json.loads((out/'results.json').read_text())['status']=='PASS'
          dest=pathlib.Path('data/rcap-grade-a/chat-parallel-2026-09-07/chat1-nc-chronology-integration');dest.mkdir(parents=True,exist_ok=True)
          for p in out.iterdir():
              if p.name=='master-before.json':continue
              if p.suffix in ['.log','.patch']:
                  b=p.read_bytes();c=gzip.compress(b,mtime=0);assert gzip.decompress(c)==b;(dest/(p.name+'.gz')).write_bytes(c)
              else:shutil.copyfile(p,dest/p.name)
          subprocess.run(['git','add','--',str(dest)],check=True)
          PY
          git diff --cached --check
          git commit -m 'test(rcap): retain exact NC text repair tests and unchanged packet proof'
          test -z "$(git status --porcelain)"
          test -z "$(git diff --name-only "$GITHUB_SHA" HEAD -- .github/workflows)"
          test "$(git ls-remote origin refs/heads/chatgpt/launch-recovery-20260906 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/chatgpt/launch-recovery-20260906
          git rev-parse HEAD > "$RUNNER_TEMP/nc-chronology/publication-sha.txt"
          git diff --binary "$GITHUB_SHA" HEAD > "$RUNNER_TEMP/nc-chronology/published.patch"
      - name: Preserve unpushed correction on failure
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/nc-chronology"
          git status --short > "$RUNNER_TEMP/nc-chronology/failure-status.txt"
          git diff --binary "$GITHUB_SHA" > "$RUNNER_TEMP/nc-chronology/unpublished.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nc-chronology-integration-${{ github.run_id }}
          path: ${{ runner.temp }}/nc-chronology/
          retention-days: 14
          if-no-files-found: error
