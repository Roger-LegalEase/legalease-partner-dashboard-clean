name: RCAP Chat 1 finish NC text integration
on:
  push:
    branches: [chatgpt/launch-recovery-20260906]
    paths: [.github/workflows/rcap-chat1-integration-current.yml]
permissions:
  contents: read
concurrency:
  group: rcap-chat1-current-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'Roger-LegalEase/legalease-partner-dashboard-clean' && github.ref == 'refs/heads/chatgpt/launch-recovery-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    env:
      PRIOR: e8c3dfa1a422445dd363fdd40cc7fb3bacce103d
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recover only the three measured implementation files, not pre-commit derived history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PRIOR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/nc-final"
          python3 - <<'PY'
          import hashlib,io,json,os,pathlib,subprocess,urllib.request,zipfile
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'nc-final';base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY'];sha=lambda b:hashlib.sha256(b).hexdigest()
          def get(endpoint):
              req=urllib.request.Request(base+endpoint,headers={'Accept':'application/vnd.github+json'});req.add_unredirected_header('Authorization','Bearer '+os.environ['GH_TOKEN']);return urllib.request.urlopen(req,timeout=120)
          with get('/actions/artifacts/10033266987') as r:meta=json.load(r)
          expected='bb2fd97e4c84771cfccb4fced53efe04d1af03cd233fe88f1bb62b9fe845d18c'
          assert meta['id']==10033266987 and not meta['expired'] and meta['digest']=='sha256:'+expected
          assert meta['workflow_run']['id']==34162958073 and meta['workflow_run']['head_sha']==os.environ['PRIOR']
          with get('/actions/artifacts/10033266987/zip') as r:raw=r.read()
          assert len(raw)==220770 and sha(raw)==expected
          z=zipfile.ZipFile(io.BytesIO(raw));assert len(z.namelist())==len(set(z.namelist())) and all('/' not in n and n not in ['.','..'] for n in z.namelist())
          bindings=json.loads(z.read('input-bindings.json'));test=json.loads(z.read('text-test-results.json'))
          assert bindings['authorCommit']=='4c79607c7985e1f7b95ece153f3d16867b49007e' and bindings['workflowInputCommit']==os.environ['PRIOR']
          assert test['negativeCount']==8 and test['allBytesMatched'] and test['pdfFilesWritten']==0
          files={f['path']:f for f in bindings['files']};assert len(files)==3
          expected_files={'scripts/build-census-v1-nc_146_dismissal_petition-set.mjs','data/rcap-all50/overlays/census-v1/nc/nc-146-dismissal-petition-set--official-pdf-fill/participant-instructions.md','scripts/rcap-packet-recovery/chat3/test-nc-guide-chronology.mjs'}
          assert set(files)==expected_files
          patch=z.read('unpublished.patch');assert sha(patch)=='0e2c6150de17074b6b5e9ceb33027f59db4cc31dc022cd28bc579b0324aa284a'
          p=out/'recovered.patch';p.write_bytes(patch);includes=['--include='+s for s in sorted(files)]
          subprocess.run(['git','apply','--check',*includes,str(p)],check=True);subprocess.run(['git','apply',*includes,str(p)],check=True)
          for name,f in files.items():assert sha(pathlib.Path(name).read_bytes())==f['sha256'],name
          changed=set(subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines())|set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines());assert changed==expected_files
          subprocess.run(['git','add','--',*sorted(changed)],check=True)
          (out/'input-bindings.json').write_bytes(z.read('input-bindings.json'));(out/'author-handoff.json').write_bytes(z.read('author-handoff.json'))
          (out/'source-artifact.json').write_text(json.dumps({'artifactId':10033266987,'sha256':expected,'sourceRunId':34162958073,'sourceInputCommit':os.environ['PRIOR'],'recoveredPatchSha256':sha(patch),'copiedDerivedMetadata':False},indent=2)+'\n')
          master='data/rcap-grade-a/packet-factory-24h/MASTER_QUEUE.json';(out/'master-before.json').write_bytes(pathlib.Path(master).read_bytes())
          PY
          git diff --cached --check
          git config user.name 'LegalEase integration (ChatGPT)'
          git config user.email 'noreply@legalease.com'
          git commit -m 'fix(rcap): apply exact authored NC clerk-certification chronology repair'
          git rev-parse HEAD > "$RUNNER_TEMP/nc-final/text-implementation-sha.txt"
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Test actual Markdown and derive records from the committed text identity
        run: |
          set -euo pipefail
          node scripts/rcap-packet-recovery/chat3/test-nc-guide-chronology.mjs > "$RUNNER_TEMP/nc-final/text-test-results.json"
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'nc-final'
          generators=['extract-verifier-returns','generate','generate-source-conveyor','generate-washington-repair','generate-source-relationship-registry','generate-raster-queue']
          for iteration in [1,2]:
              for script in generators:
                  log=out/(script+'-prepare-'+str(iteration)+'.log')
                  with log.open('w') as f:code=subprocess.run(['node','scripts/grade-a-packet-factory-24h/'+script+'.mjs'],stdout=f,stderr=subprocess.STDOUT,timeout=540).returncode
                  assert code==0,(script,iteration)
          changed=set(subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines())|set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert all(p.startswith(('data/rcap-grade-a/packet-factory-24h/','docs/rcap/grade-a/packet-factory-24h/')) for p in changed),sorted(changed)
          assert not any(p.endswith(('.pdf','.docx','.ttf','.woff','.woff2')) for p in changed)
          master='data/rcap-grade-a/packet-factory-24h/MASTER_QUEUE.json';old=json.loads((out/'master-before.json').read_text());new=json.loads(pathlib.Path(master).read_text())
          states=lambda d:{f['familyId']:f['state'] for f in d['families']};a,b=states(old),states(new);assert set(a)==set(b)
          diff={k:{'before':a[k],'after':b[k]} for k in a if a[k]!=b[k]}
          assert set(diff)<= {'nc_146_dismissal_petition-set'} and b['nc_146_dismissal_petition-set'] in ['FAIL_REPAIR_REQUIRED','VERIFY_PENDING'],diff
          terminal={'COMPLETE_PACKET_PROVEN','GUIDANCE_READY','HANDOFF_READY','OUT_OF_SCOPE'}
          assert {k:v for k,v in a.items() if v in terminal}=={k:v for k,v in b.items() if v in terminal}
          (out/'derived-state-diff.json').write_text(json.dumps(diff,indent=2)+'\n')
          (out/'derived-paths.json').write_text(json.dumps(sorted(changed),indent=2)+'\n')
          if changed:subprocess.run(['git','add','--',*sorted(changed)],check=True)
          PY
          git diff --cached --check
          if ! git diff --cached --quiet; then git commit -m 'chore(rcap): derive repair and raster records after NC text commit'; fi
      - name: Require all committed-state checks before publication
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'nc-final';commands=[];results=[]
          for script in ['extract-verifier-returns','generate','generate-source-conveyor','generate-washington-repair','generate-source-relationship-registry','generate-raster-queue']:
              commands.append((script+'-check',['node','scripts/grade-a-packet-factory-24h/'+script+'.mjs','--check']))
          for script in ['verify','verify-source-conveyor','verify-acq-promo-handoff','verify-lane-contracts','verify-source-relationship-model']:
              for mutation in [False,True]:commands.append((script+('-mutations' if mutation else ''),['node','scripts/grade-a-packet-factory-24h/'+script+'.mjs']+(['--mutations'] if mutation else [])))
          for name,cmd in commands:
              with (out/(name+'.log')).open('w') as log:
                  try:code=subprocess.run(cmd,stdout=log,stderr=subprocess.STDOUT,timeout=540).returncode
                  except subprocess.TimeoutExpired:code=124
              clean=not subprocess.check_output(['git','status','--porcelain']).strip();results.append({'name':name,'command':cmd,'exitCode':code,'cleanWorktreeRestored':clean})
              (out/'commands.json').write_text(json.dumps(results,indent=2)+'\n');print(name,code,clean,flush=True)
              if code:print((out/(name+'.log')).read_text()[-6000:])
              assert code==0 and clean,name
          bindings=json.loads((out/'input-bindings.json').read_text())
          for f in bindings['files']:assert hashlib.sha256(pathlib.Path(f['path']).read_bytes()).hexdigest()==f['sha256'],f['path']
          master='data/rcap-grade-a/packet-factory-24h/MASTER_QUEUE.json';new=json.loads(pathlib.Path(master).read_text())
          terminal={'COMPLETE_PACKET_PROVEN','GUIDANCE_READY','HANDOFF_READY','OUT_OF_SCOPE'};assert len(new['families'])==346 and sum(f['state'] in terminal for f in new['families'])==178
          text=json.loads((out/'text-test-results.json').read_text());assert text['negativeCount']==8 and text['allBytesMatched'] and text['pdfFilesWritten']==0
          record={'status':'PASS','runId':os.environ['GITHUB_RUN_ID'],'inputCommit':os.environ['GITHUB_SHA'],'checkedCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'textImplementationCommit':(out/'text-implementation-sha.txt').read_text().strip(),'authorCommit':bindings['authorCommit'],'checks':results,'textTest':text,'stateChanges':json.loads((out/'derived-state-diff.json').read_text()),'terminalFamilies':178,'denominator':346,'terminalDelta':0,'ncState':next(f['state'] for f in new['families'] if f['familyId']=='nc_146_dismissal_petition-set'),'packetRebuilds':0,'packetPdfWrites':0,'independentGuideReviewPending':True,'productionTouched':False}
          (out/'results.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
      - name: Publish checked text and records without editing workflow files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip,json,os,pathlib,shutil,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'nc-final';assert json.loads((out/'results.json').read_text())['status']=='PASS'
          dest=pathlib.Path('data/rcap-grade-a/chat-parallel-2026-09-07/chat1-nc-chronology-integration');dest.mkdir(parents=True,exist_ok=True)
          for p in out.iterdir():
              if p.name in ['master-before.json','recovered.patch']:continue
              if p.suffix=='.log':
                  b=p.read_bytes();encoded=gzip.compress(b,mtime=0);assert gzip.decompress(encoded)==b;(dest/(p.name+'.gz')).write_bytes(encoded)
              else:shutil.copyfile(p,dest/p.name)
          subprocess.run(['git','add','--',str(dest)],check=True)
          PY
          git diff --cached --check
          git commit -m 'test(rcap): retain NC chronology execution and current-history acceptance checks'
          test -z "$(git status --porcelain)"
          test -z "$(git diff --name-only "$GITHUB_SHA" HEAD -- .github/workflows)"
          test "$(git ls-remote origin refs/heads/chatgpt/launch-recovery-20260906 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/chatgpt/launch-recovery-20260906
          git rev-parse HEAD > "$RUNNER_TEMP/nc-final/publication-sha.txt"
          git diff --binary "$GITHUB_SHA" HEAD > "$RUNNER_TEMP/nc-final/published.patch"
      - name: Preserve exact candidate on failure
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/nc-final"
          git status --short > "$RUNNER_TEMP/nc-final/failure-status.txt"
          git diff --binary "$GITHUB_SHA" > "$RUNNER_TEMP/nc-final/unpublished.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nc-text-final-${{ github.run_id }}
          path: ${{ runner.temp }}/nc-final/
          retention-days: 14
          if-no-files-found: error
