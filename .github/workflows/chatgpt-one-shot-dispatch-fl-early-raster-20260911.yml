name: ChatGPT one-shot dispatch Florida early-juvenile raster

on:
  push:
    paths:
      - .github/workflows/chatgpt-one-shot-dispatch-fl-early-raster-20260911.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch pinned Florida raster
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'rcap-packet-raster-acceptance-batch.yml',
              ref: 'claude/legalease-sprint-captain-utucnw',
              inputs: {
                commit_sha: 'd5a4bec9fd68bb2bdbb2791588789c55e3e4ae67',
                raster_manifest_path: 'data/rcap-grade-a/packet-factory-24h/fix06/fl-early-source-geometry-20260911/raster-manifest.json',
                family_batch: 'fl-early-juvenile-set'
              }
            });
            core.info('Dispatched Florida early-juvenile raster pinned to d5a4bec9fd68bb2bdbb2791588789c55e3e4ae67');
