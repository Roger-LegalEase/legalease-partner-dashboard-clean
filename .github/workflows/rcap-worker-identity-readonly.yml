name: RCAP Fly credential format category only
on:
  workflow_dispatch:
permissions: {}
jobs:
  category:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Report credential format category only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          let category='Unknown';
          const token=process.env.FLY_API_TOKEN;
          if(typeof token==='string'&&!/[\x00-\x1f\x7f]/.test(token)){
            const value=token.trim();
            if(/^FlyV1\s+\S+$/i.test(value))category='Already-prefixed FlyV1';
            else if(/^fm2_\S+$/.test(value))category='Bare fm2 token';
            else if(/^Bearer\s+\S+$/i.test(value))category='Already-prefixed Bearer';
            else if(/^\S+$/.test(value))category='Raw legacy token';
          }
          process.stdout.write(category+'\n');
          NODE
