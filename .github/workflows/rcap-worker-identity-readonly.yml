name: RCAP worker read-only identity
on:
  workflow_dispatch:
    inputs:
      qualified_readiness:
        description: "Capture reviewed effective WWT/queue/rollback facts only; never deploy"
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify the bounded read-only identity controls
        run: node --test scripts/rcap-worker-identity-readonly.test.mjs scripts/qualified-worker-readonly-capture.test.mjs
      - name: Capture sanitized existing Fly worker facts
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RCAP_QUALIFIED_WORKER_READINESS: ${{ inputs.qualified_readiness && '1' || '' }}
        run: node scripts/rcap-worker-identity-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rcap-worker-readonly-identity-${{ github.run_id }}
          path: worker-identity-evidence/
          if-no-files-found: error
