name: RCAP completion pass
on:
  push:
    branches: [chatgpt/launch-recovery-20260906]
    paths: [.github/workflows/rcap-completion-pass.yml]
permissions:
  contents: read
concurrency:
  group: rcap-completion-publication
  cancel-in-progress: false
jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.publish.outputs.candidate }}
    env:
      OUT: data/rcap-grade-a/completion-pass-2026-09-07/finalization
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair only measured receipt metadata and consume the NC repair contract
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/chatgpt/launch-recovery-20260906
          mkdir -p "$OUT" "$RUNNER_TEMP/finalization"
          cp data/rcap-grade-a/packet-factory-24h/MASTER_QUEUE.json "$RUNNER_TEMP/finalization/before-master.json"
          python3 scripts/rcap-packet-recovery/finish-completion-records.py | tee "$OUT/receipt-corrections.log"
          python3 scripts/rcap-packet-recovery/finish-completion-records.py --check | tee "$OUT/receipt-idempotence.log"
          git config user.name 'LegalEase completion (ChatGPT)'
          git config user.email 'noreply@legalease.com'
          git add -- data/rcap-all50/overlays/census-v1/ak/ak-mistaken-identity-set--official-pdf-fill/source-receipt.json data/rcap-all50/overlays/census-v1/ar/ar-nonconviction-seal-set--official-pdf-fill/source-receipt.json data/rcap-all50/overlays/census-v1/nc/nc-145-5-felony-set--official-pdf-fill/source-receipt.json data/rcap-all50/overlays/census-v1/nc/nc-146-acquittal-petition-set--official-pdf-fill/source-receipt.json data/rcap-grade-a/legal-decisions/LEGAL_HOLD_RECLASSIFICATION_2026-09-04.json data/rcap-grade-a/completion-pass-2026-09-07/receipt-refresh-proof.json
          git diff --cached --check
          git commit -m 'fix(rcap): preserve unchanged receipt anchors and request current-byte NC review'
      - name: Execute the combined scoped regression suites
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          node scripts/rcap-packet-recovery/test-nc-indigency.mjs | tee "$OUT/nc-checks.log"
          node scripts/rcap-packet-recovery/test-recovery.mjs | tee "$OUT/prior-checks.log"
          node scripts/rcap-packet-recovery/test-mutations.mjs | tee "$OUT/prior-mutations.log"
          find scripts/rcap-packet-recovery -maxdepth 1 -name '*nv*' -print
          node scripts/grade-a-packet-factory-24h/summarize-readiness-steps.mjs --self-test | tee "$OUT/summary-controls.log"
      - name: Regenerate current queue, then admit the already verified Nevada receipt
        run: |
          set -euo pipefail
          for script in generate generate-source-conveyor generate-washington-repair generate-source-relationship-registry generate-raster-queue; do
            node "scripts/grade-a-packet-factory-24h/$script.mjs" > "$OUT/$script.log" 2>&1 || { tail -60 "$OUT/$script.log"; exit 1; }
          done
          python3 - <<'PY'
          import pathlib,json,hashlib
          qpath=pathlib.Path('data/rcap-grade-a/packet-factory-24h/RASTER_QUEUE.json');q=json.loads(qpath.read_text())
          root=pathlib.Path('data/rcap-grade-a/nv-completion-2026-09-07/central-raster')
          v=json.loads((root/'rcap-nv-custom-pleading.verdict.json').read_text());proof=json.loads((root/'verified-receipt.json').read_text())
          family='rcap-nv-custom-pleading';row=next(x for x in q['rows'] if x['familyId']==family)
          assert v['verdict']=='RASTER_PASS' and v['coversTheWholeFamily'] is True and v['packetPdfsModified']==0
          assert v['problems']==[] and v['environmentProblems']==[] and v['pagesMeasured']==88
          assert proof['downloadedZipDigestVerified'] is True and proof['immutableRepositoryPdfsMatch'] is True
          assert proof['admissionNegativeControlsCaught']==16 and len(proof['measuredPageImages'])==88
          assert row['documentsDigest']==v['documentsDigest'] and len(row['documents'])==2
          for doc in row['documents']:
            assert hashlib.sha256(pathlib.Path(doc['path']).read_bytes()).hexdigest()==doc['sha256']
            match=next(x for x in v['documentsRendered'] if x['path']==doc['path']);assert match['pinned']==doc['sha256']
          previous=row.get('rasterReceipt')
          if previous and str(previous.get('workflowRunId'))!='34101879269':row.setdefault('supersededReceipts',[]).append(previous)
          row['currentRasterState']='RASTER_PASS'
          row['rasterReceipt']={'verdict':'RASTER_PASS','workflowRunId':'34101879269','workflow':'.github/workflows/rcap-packet-raster-acceptance-batch.yml','renderedCommitSha':v['packetCommitSha'],'jobId':'101678748778','jobConclusion':'success','boundToCanonicalSha256':row['canonicalPdfSha256'],'boundToBoundarySha256':row['boundaryPdfSha256'],'documentsDigest':v['documentsDigest'],'documentsCovered':[x['document'] for x in v['documentsRendered']],'documentsNotCovered':[],'coversTheWholeFamily':True,'documentsMeasured':2,'pagesMeasured':88,'problemsFound':0,'receiptArtifact':{'id':'10011501772','name':'rcap-raster-rcap-nv-custom-pleading-34101879269','zipSha256':'sha256:'+proof['artifactZipSha256']},'verdictPath':str(root/'rcap-nv-custom-pleading.verdict.json'),'receiptArtifactInspection':'retain-nv-central-receipt.py verified the fixed ZIP, all 88 measured page images, current and immutable whole-PDF bytes, and successful run/job provenance; 16 admission corruption controls caught.','admittedBy':'ChatGPT integration; raster only, no semantic verdict or terminal approval.'}
          row['coverage']={'documents':[x['document'] for x in v['documentsRendered']],'rastered':[x['document'] for x in v['documentsRendered']],'notRastered':[],'complete':True,'basis':'Both complete inputs are bound by the retained current-byte central verdict.','notRenderedByThisGate':[]}
          qpath.write_text(json.dumps(q,indent=2)+'\n')
          print('Nevada completed 88-page central raster incorporated without changing packet bytes or independent verdict.')
          PY
          for script in generate generate-source-conveyor generate-washington-repair generate-source-relationship-registry generate-raster-queue; do
            node "scripts/grade-a-packet-factory-24h/$script.mjs" >> "$OUT/$script.log" 2>&1 || { tail -60 "$OUT/$script.log"; exit 1; }
          done
          for script in generate generate-source-conveyor generate-washington-repair generate-source-relationship-registry; do
            node "scripts/grade-a-packet-factory-24h/$script.mjs" --check > "$OUT/$script-check.log" 2>&1 || { tail -60 "$OUT/$script-check.log"; exit 1; }
          done
      - name: Measure every wider check and the derived completion delta
        run: |
          python3 - <<'PY'
          import subprocess,pathlib,json,os,datetime,collections
          out=pathlib.Path(os.environ['OUT']);results=[]
          for script in ['verify','verify-source-conveyor','verify-acq-promo-handoff','verify-lane-contracts','verify-source-relationship-model']:
            for mutations in [False,True]:
              cmd=['node',f'scripts/grade-a-packet-factory-24h/{script}.mjs']+(['--mutations'] if mutations else [])
              name=script+('-mutations' if mutations else '')
              with (out/f'{name}.log').open('w') as log:
                try:code=subprocess.run(cmd,stdout=log,stderr=subprocess.STDOUT,timeout=180).returncode
                except subprocess.TimeoutExpired:code=124
              results.append({'command':cmd,'exitCode':code,'status':'PASS' if code==0 else 'FAIL'})
              print(name,code,flush=True)
          master=json.loads(pathlib.Path('data/rcap-grade-a/packet-factory-24h/MASTER_QUEUE.json').read_text());before=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'finalization/before-master.json').read_text())
          previous={x['familyId']:x for x in before['families']};current={x['familyId']:x for x in master['families']}
          terminal={'COMPLETE_PACKET_PROVEN','GUIDANCE_READY','HANDOFF_READY','OUT_OF_SCOPE'}
          transitions=[{'familyId':k,'before':previous[k]['state'],'after':r['state']} for k,r in current.items() if previous[k]['state']!=r['state']]
          report={'workflowRunId':os.environ['GITHUB_RUN_ID'],'checkedSourceCommit':os.environ['GITHUB_SHA'],'recordedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'results':results,'states':dict(collections.Counter(x['state'] for x in current.values())),'terminalFamilies':sum(x['state'] in terminal for x in current.values()),'denominator':len(current),'transitionsSinceIntermediatePublication':transitions,'newSemanticApprovalOfAuthoredRepairs':False,'productionTouched':False,'commercialRoutesOpened':0}
          (out/'results.json').write_text(json.dumps(report,indent=2)+'\n');print(json.dumps(report,indent=2))
          assert current['rcap-wi-custom-pleading']['state']=='COMPLETE_PACKET_PROVEN','Wisconsin proof unexpectedly regressed'
          for f in ['ar-nonconviction-seal-set','nc_145_5_felony-set','nc_146_acquittal_petition-set']:assert current[f]['state']=='COMPLETE_PACKET_PROVEN',f+' identity-only refresh still lapses the unchanged packet'
          assert current['nc_146_dismissal_petition-set']['state'] not in terminal,'NC authored repair cannot self-approve'
          assert current['de_mandatory_expungement-set']['state'] not in terminal,'DE authored repair cannot self-approve'
          assert current['rcap-nv-custom-pleading']['state'] not in terminal,'NV authored repair cannot self-approve'
          PY
      - name: Publish exact scoped finalization to recovery only
        id: publish
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,os
          prefixes=['data/rcap-grade-a/packet-factory-24h/','docs/rcap/grade-a/packet-factory-24h/',os.environ['OUT']+'/']
          changed=set(subprocess.check_output(['git','diff','--name-only']).decode().splitlines())|set(subprocess.check_output(['git','ls-files','--others','--exclude-standard']).decode().splitlines())
          bad=[p for p in changed if not any(p.startswith(x) for x in prefixes)];assert not bad,bad
          for p in sorted(changed):subprocess.run(['git','add','--',p],check=True)
          PY
          git diff --cached --check
          git commit -m 'evidence(rcap): integrate completed raster receipts and preserve measured terminal progress'
          git diff --binary "$GITHUB_SHA" HEAD > "$RUNNER_TEMP/finalization/candidate.patch"
          test "$(git ls-remote origin refs/heads/chatgpt/launch-recovery-20260906 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/chatgpt/launch-recovery-20260906
          sha=$(git rev-parse HEAD)
          echo "$sha" | tee "$RUNNER_TEMP/finalization/published-sha.txt"
          echo "candidate=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rcap-completion-finalization-${{ github.run_id }}
          path: |
            data/rcap-grade-a/completion-pass-2026-09-07/finalization/
            ${{ runner.temp }}/finalization/
          retention-days: 14
          if-no-files-found: error
  nc_raster:
    needs: complete
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/github-script@v7
        env:
          CANDIDATE: ${{ needs.complete.outputs.candidate }}
        with:
          script: |
            const sha=process.env.CANDIDATE;
            if(!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Missing published candidate');
            const manifest='data/rcap-grade-a/packet-factory-24h/RASTER_QUEUE.json';
            const {data}=await github.rest.repos.getContent({...context.repo,path:manifest,ref:sha});
            const q=JSON.parse(Buffer.from(data.content,'base64').toString('utf8'));
            const row=q.rows.find(r=>r.familyId==='nc_146_dismissal_petition-set');
            if(!row || row.currentRasterState!=='RASTER_PENDING') throw new Error('NC is not an eligible current raster-pending family');
            await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'rcap-packet-raster-acceptance-batch.yml',ref:'main',inputs:{commit_sha:sha,raster_manifest_path:manifest,family_batch:row.familyId,requested_scale:'2.5'}});
            core.info(`Central NC raster dispatched for immutable ${sha}; ${row.documents.length} documents. Dispatch is not a pass.`);
