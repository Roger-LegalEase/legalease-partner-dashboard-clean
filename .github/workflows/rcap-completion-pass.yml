name: RCAP completion validation
on:
  push:
    branches: [chatgpt/launch-recovery-20260906]
    paths: [.github/workflows/rcap-completion-pass.yml]
permissions:
  contents: read
concurrency:
  group: rcap-completion-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate published repairs and convergence without modifying a branch
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/completion-validation"
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          node scripts/rcap-packet-recovery/test-nc-indigency.mjs | tee "$RUNNER_TEMP/completion-validation/nc.log"
          node scripts/rcap-packet-recovery/test-recovery.mjs | tee "$RUNNER_TEMP/completion-validation/prior.log"
          node scripts/rcap-packet-recovery/test-mutations.mjs | tee "$RUNNER_TEMP/completion-validation/mutations.log"
          for script in generate generate-source-conveyor generate-washington-repair generate-source-relationship-registry; do
            node "scripts/grade-a-packet-factory-24h/$script.mjs" --check > "$RUNNER_TEMP/completion-validation/$script.log" 2>&1 || { tail -80 "$RUNNER_TEMP/completion-validation/$script.log"; exit 1; }
          done
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completion-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/completion-validation/
          retention-days: 14
          if-no-files-found: error
  nc_raster:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f9f00d6c221f8f972663ea016b9055d8972c16d8
          persist-credentials: false
          sparse-checkout: data/rcap-grade-a/packet-factory-24h
      - name: Read the full pinned manifest and dispatch the existing central gate
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const child = require('child_process');
            const sha = 'f9f00d6c221f8f972663ea016b9055d8972c16d8';
            if (child.execFileSync('git', ['rev-parse','HEAD'], {encoding:'utf8'}).trim() !== sha) throw new Error('Unexpected checkout');
            const manifest = 'data/rcap-grade-a/packet-factory-24h/RASTER_QUEUE.json';
            // The Contents API omits inline content for oversized files. Read
            // the full immutable Git checkout instead of decoding an empty field.
            const bytes = fs.readFileSync(manifest);
            const queue = JSON.parse(bytes.toString('utf8'));
            const family = 'nc_146_dismissal_petition-set';
            const rows = queue.rows.filter(row => row.familyId === family);
            if (rows.length !== 1 || rows[0].currentRasterState !== 'RASTER_PENDING') throw new Error('NC is not uniquely raster-pending');
            if (!rows[0].documents?.length) throw new Error('No complete NC document inventory');
            core.info(JSON.stringify({packetCommit:sha, family, documents:rows[0].documents.length, manifestBytes:bytes.length, manifestSha256:crypto.createHash('sha256').update(bytes).digest('hex')}));
            await github.rest.actions.createWorkflowDispatch({...context.repo, workflow_id:'rcap-packet-raster-acceptance-batch.yml', ref:'main', inputs:{commit_sha:sha, raster_manifest_path:manifest, family_batch:family, requested_scale:'2.5'}});
            await core.summary.addHeading('NC central raster dispatched').addRaw(`Exact packet commit: ${sha}\n\nFull manifest read from Git, not truncated API content. Dispatch is not a raster verdict, semantic approval, or terminal promotion.`).write();
