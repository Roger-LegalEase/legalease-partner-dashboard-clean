name: RCAP completed NC raster integration
on:
  push:
    branches: [chatgpt/launch-recovery-20260906]
    paths: [.github/workflows/rcap-completion-pass.yml]
permissions:
  contents: read
concurrency:
  group: rcap-completion-publication
  cancel-in-progress: false
jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare readers and preserve the pre-admission census
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/chatgpt/launch-recovery-20260906
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/nc-admission"
          cp data/rcap-grade-a/packet-factory-24h/MASTER_QUEUE.json "$RUNNER_TEMP/nc-admission/before.json"
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Download only the already completed NC artifact and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/nc-admission"
          api=https://api.github.com/repos/Roger-LegalEase/legalease-partner-dashboard-clean
          for pair in 'run.json actions/runs/34121189163' 'jobs.json actions/runs/34121189163/jobs?per_page=100' 'artifact.json actions/artifacts/10018791229' 'raster.zip actions/artifacts/10018791229/zip'; do
            read -r file endpoint <<< "$pair"
            curl --fail --silent --show-error --location --retry 2 --max-time 180 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api/$endpoint" -o "$dir/$file"
          done
      - name: Verify all inputs and page images, then admit only the matching raster row
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/nc-admission"
          python3 - <<'PY'
          import pathlib,hashlib
          p=pathlib.Path('scripts/rcap-packet-recovery/retain-nc-full-raster.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='2619af791d3c0dc4eac5a74a2bd6fb0d797a1c8a96570eed5b4f5943bce42bd6','Admission source differs from the inspected code'
          PY
          python3 scripts/rcap-packet-recovery/retain-nc-full-raster.py "$dir/raster.zip" "$dir/run.json" "$dir/jobs.json" "$dir/artifact.json" --admit | tee "$dir/admission.log"
          sha256sum data/rcap-grade-a/packet-factory-24h/RASTER_QUEUE.json > "$dir/first.sha256"
          python3 scripts/rcap-packet-recovery/retain-nc-full-raster.py "$dir/raster.zip" "$dir/run.json" "$dir/jobs.json" "$dir/artifact.json" --admit > "$dir/idempotence.log"
          sha256sum --check "$dir/first.sha256"
      - name: Regenerate using complete Git history without rebuilding packets
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/nc-admission"
          for pass in 1 2; do
            for script in generate generate-source-conveyor generate-washington-repair generate-source-relationship-registry generate-raster-queue; do
              node "scripts/grade-a-packet-factory-24h/$script.mjs" > "$out/$script-$pass.log" 2>&1 || { tail -60 "$out/$script-$pass.log"; exit 1; }
            done
          done
          for script in generate generate-source-conveyor generate-washington-repair generate-source-relationship-registry; do
            node "scripts/grade-a-packet-factory-24h/$script.mjs" --check > "$out/$script-check.log" 2>&1 || { tail -60 "$out/$script-check.log"; exit 1; }
          done
          git diff --exit-code -- data/rcap-all50/ src/ data/record-clearing/
      - name: Run the complete factory suites and measure the exact state change
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,os,json,hashlib,collections
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'nc-admission';results=[]
          def fingerprint():
              return hashlib.sha256(subprocess.check_output(['git','diff','--binary'])+b'\0'+subprocess.check_output(['git','status','--porcelain','-z'])).hexdigest()
          for script in ['verify','verify-source-conveyor','verify-acq-promo-handoff','verify-lane-contracts','verify-source-relationship-model']:
              for mutation in [False,True]:
                  name=script+('-mutations' if mutation else '')
                  cmd=['node',f'scripts/grade-a-packet-factory-24h/{script}.mjs']+(['--mutations'] if mutation else [])
                  before=fingerprint()
                  with (out/(name+'.log')).open('w') as log:
                      try:code=subprocess.run(cmd,stdout=log,stderr=subprocess.STDOUT,timeout=540).returncode
                      except subprocess.TimeoutExpired:code=124
                  restored=before==fingerprint()
                  results.append({'command':cmd,'exitCode':code,'status':'PASS' if code==0 else 'FAIL','worktreeRestored':restored})
                  print(name,code,restored,flush=True)
                  if not restored:break
              if not restored:break
          base=json.loads((out/'before.json').read_text())['families']
          current=json.loads(pathlib.Path('data/rcap-grade-a/packet-factory-24h/MASTER_QUEUE.json').read_text())['families']
          terminal={'COMPLETE_PACKET_PROVEN','GUIDANCE_READY','HANDOFF_READY','OUT_OF_SCOPE'}
          old={f['familyId']:f['state'] for f in base};new={f['familyId']:f['state'] for f in current}
          changes=[{'familyId':f,'before':old[f],'after':new[f]} for f in old if old[f]!=new.get(f)]
          same_terminal={f for f,s in old.items() if s in terminal}=={f for f,s in new.items() if s in terminal}
          report={'schemaVersion':'rcap-nc-raster-integration/v1','runId':os.environ['GITHUB_RUN_ID'],'checkedCommit':os.environ['GITHUB_SHA'],'centralRunId':34121189163,'results':results,'transitions':changes,'terminalSetPreserved':same_terminal,'terminalFamilies':sum(s in terminal for s in new.values()),'denominator':len(new),'states':dict(collections.Counter(new.values())),'packetRebuilds':0,'newSemanticApprovals':0,'productionTouched':False}
          (out/'results.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          assert len(results)==10 and all(r['status']=='PASS' and r['worktreeRestored'] for r in results),'A suite failed'
          assert same_terminal and set(old)==set(new),'Unrelated family loss/promotion'
          assert changes==[{'familyId':'nc_146_dismissal_petition-set','before':'BUILT_RASTER_PENDING','after':'VERIFY_PENDING'}],changes
          PY
      - name: Publish only the admitted receipt and verified generated state to recovery
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/nc-admission"
          evidence=data/rcap-grade-a/completion-pass-2026-09-07/nc-full-raster
          cp "$out/results.json" "$evidence/integration-results.json"
          python3 - <<'PY'
          import subprocess
          prefixes=['data/rcap-grade-a/packet-factory-24h/','docs/rcap/grade-a/packet-factory-24h/','data/rcap-grade-a/completion-pass-2026-09-07/nc-full-raster/']
          changed=set(subprocess.check_output(['git','diff','--name-only']).decode().splitlines())|set(subprocess.check_output(['git','ls-files','--others','--exclude-standard']).decode().splitlines())
          assert all(any(p.startswith(prefix) for prefix in prefixes) for p in changed),changed
          for p in sorted(changed):subprocess.run(['git','add','--',p],check=True)
          PY
          git diff --cached --check
          test "$(git ls-remote origin refs/heads/chatgpt/launch-recovery-20260906 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'LegalEase completion (ChatGPT)'
          git config user.email 'noreply@legalease.com'
          git commit -m 'verify(rcap-nc): retain complete 60-page raster and advance to independent review'
          git push origin HEAD:refs/heads/chatgpt/launch-recovery-20260906
          git rev-parse HEAD > "$out/published-sha.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nc-full-raster-integration-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nc-admission/*.json
            ${{ runner.temp }}/nc-admission/*.log
            ${{ runner.temp }}/nc-admission/published-sha.txt
            data/rcap-grade-a/completion-pass-2026-09-07/nc-full-raster/
          retention-days: 14
          if-no-files-found: error
