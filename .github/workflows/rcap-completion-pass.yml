name: RCAP completion pass
on:
  push:
    branches: [chatgpt/launch-recovery-20260906]
    paths: [.github/workflows/rcap-completion-pass.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read existing private source archive and select three official forms
        env:
          SOURCE_TOKEN: ${{ secrets.LEGALEASE_SOURCE_ARTIFACTS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/completion-inputs"
          test -n "$SOURCE_TOKEN" || { echo 'Existing source-archive credential is unavailable to this workflow.'; exit 1; }
          curl --fail --silent --show-error --location --retry 2 --max-time 180 \
            -H "Authorization: Bearer $SOURCE_TOKEN" -H 'Accept: application/octet-stream' \
            https://api.github.com/repos/Roger-LegalEase/legalease-source-artifacts/releases/assets/534450572 \
            -o "$RUNNER_TEMP/source-archive.zip"
          unset SOURCE_TOKEN
          python3 - <<'PY'
          import pathlib,os,hashlib,json,datetime,zipfile
          temp=pathlib.Path(os.environ['RUNNER_TEMP']);out=temp/'completion-inputs';archive=temp/'source-archive.zip'
          expected_archive='a26e3ca7d52db4460e53c2eddd893109037702f5c8035f2c698a7e16bad84e89'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==expected_archive,'Archive digest mismatch'
          wanted={
            'a876229328f9ee8325890b597633b661711fe606da1be8ddb573cd50791365ed':'AOC-CR-287-2025-12.pdf',
            'fe22270401aa22ee5c801871aeb1c00f3b98cfb6867f7155681bab4af9c990d7':'AOC-CR-287-instructions-2025-12.pdf',
            '74057a13e4bccccbbac785c845b4996b322c6219e1c45f1ab42dca2377755a8f':'AOC-CV-226-2023-04.pdf'
          }
          receipts=[]
          with zipfile.ZipFile(archive) as z:
            for info in z.infolist():
              if '/NC/' not in info.filename or not info.filename.lower().endswith('.pdf'):continue
              data=z.read(info);sha=hashlib.sha256(data).hexdigest()
              if sha not in wanted:continue
              assert data.startswith(b'%PDF-')
              name=wanted[sha];(out/name).write_bytes(data)
              receipts.append({'file':name,'sha256':sha,'byteLength':len(data),'matchesPinnedHash':True,'sourceArchivePath':info.filename})
          record={'runId':os.environ['GITHUB_RUN_ID'],'archiveAssetId':534450572,'archiveSha256':expected_archive,'recoveredAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'sources':receipts,'freshIssuerDownload':False,'grantsApproval':False}
          (out/'source-receipts.json').write_text(json.dumps(record,indent=2)+'\n')
          assert set(x['sha256'] for x in receipts)==set(wanted),'Archive does not contain all three pinned NC sources'
          print('Three official NC sources recovered with exact pinned hashes; no other archive contents published.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rcap-completion-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/completion-inputs/
          retention-days: 3
          if-no-files-found: error
