name: RCAP completion pass
on:
  push:
    branches: [chatgpt/launch-recovery-20260906]
    paths: [.github/workflows/rcap-completion-pass.yml]
permissions:
  contents: write
jobs:
  retain_sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Import only the three verified blank public court forms
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/chatgpt/launch-recovery-20260906
          python3 - <<'PY'
          import urllib.request,urllib.parse,pathlib,os,hashlib,json,zipfile,io,re
          api='https://api.github.com/repos/Roger-LegalEase/legalease-partner-dashboard-clean/issues/comments/5567366947'
          req=urllib.request.Request(api,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as r: comment=json.load(r)
          assert comment['user']['login']=='Roger-LegalEase'
          match=re.search(r'^NC_PUBLIC_FORM_ZIP_URL=(https://[^\s]+)$',comment['body'],re.M);assert match
          url=match.group(1);assert urllib.parse.urlsplit(url).hostname=='sdmntprcentralus.oaiusercontent.com'
          with urllib.request.urlopen(url,timeout=60) as response:data=response.read(2000000)
          assert hashlib.sha256(data).hexdigest()=='f32f8fb862dfad79b64a965a5470c3009f654731b92b7d5baa40f825a78a4ca3'
          expected={
            'AOC-CR-287-2025-12.pdf':'a876229328f9ee8325890b597633b661711fe606da1be8ddb573cd50791365ed',
            'AOC-CR-287-instructions-2025-12.pdf':'fe22270401aa22ee5c801871aeb1c00f3b98cfb6867f7155681bab4af9c990d7',
            'AOC-CV-226-2023-04.pdf':'74057a13e4bccccbbac785c845b4996b322c6219e1c45f1ab42dca2377755a8f'}
          dest=pathlib.Path('reference/north-carolina');dest.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(data)) as z:
            assert set(z.namelist())==set(expected)|{'source-receipts.json'},'Unexpected archive entry'
            for name,sha in expected.items():
              body=z.read(name);assert body.startswith(b'%PDF-') and hashlib.sha256(body).hexdigest()==sha
              target=dest/name
              if target.exists():assert target.read_bytes()==body,'Different retained source already exists'
              target.write_bytes(body)
            record=json.loads(z.read('source-receipts.json'))
          record.update(transferZipSha256=hashlib.sha256(data).hexdigest(),retainedAtRun=os.environ['GITHUB_RUN_ID'],publicBlankCourtFormsOnly=True)
          out=pathlib.Path('data/rcap-grade-a/completion-pass-2026-09-07');out.mkdir(parents=True,exist_ok=True)
          (out/'nc-source-custody.json').write_text(json.dumps(record,indent=2)+'\n')
          print('Three exact pinned blank official NC PDFs verified and retained; no signed transfer URL retained.')
          PY
          test "$(git ls-remote origin refs/heads/chatgpt/launch-recovery-20260906 | cut -f1)" = "$GITHUB_SHA"
          git add -- reference/north-carolina/AOC-CR-287-2025-12.pdf reference/north-carolina/AOC-CR-287-instructions-2025-12.pdf reference/north-carolina/AOC-CV-226-2023-04.pdf data/rcap-grade-a/completion-pass-2026-09-07/nc-source-custody.json
          git diff --cached --check -- ':(glob,exclude)**/*.pdf'
          git config user.name 'LegalEase completion (ChatGPT)'
          git config user.email 'noreply@legalease.com'
          git commit -m 'build(rcap): retain exact pinned NC court forms for the G106 branch repair'
          git push origin HEAD:refs/heads/chatgpt/launch-recovery-20260906
