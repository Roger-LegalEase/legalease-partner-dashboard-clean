name: RCAP completion validation
on:
  push:
    branches: [chatgpt/launch-recovery-20260906]
    paths:
      - .github/workflows/rcap-completion-pass.yml
      - scripts/rcap-packet-recovery/test-nc-indigency.mjs
      - scripts/rcap-packet-recovery/nc-indigency.mjs
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test published packet behavior without generating or publishing queue state
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          mkdir -p "$RUNNER_TEMP/completion-validation"
          node scripts/rcap-packet-recovery/test-nc-indigency.mjs | tee "$RUNNER_TEMP/completion-validation/nc.log"
          node scripts/rcap-packet-recovery/test-nv-special-routes.mjs | tee "$RUNNER_TEMP/completion-validation/nv.log"
          node scripts/rcap-packet-recovery/test-recovery.mjs | tee "$RUNNER_TEMP/completion-validation/prior.log"
          node scripts/rcap-packet-recovery/test-mutations.mjs | tee "$RUNNER_TEMP/completion-validation/mutations.log"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completion-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/completion-validation/
          retention-days: 14
          if-no-files-found: error
