name: RCAP completion pass
on:
  push:
    branches: [chatgpt/launch-recovery-20260906]
    paths: [.github/workflows/rcap-completion-pass.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtain exact official NC repair inputs
        run: |
          mkdir -p "$RUNNER_TEMP/completion-inputs"
          python3 - <<'PY'
          import urllib.request,pathlib,os,hashlib,json,datetime
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'completion-inputs'
          rows=[
            ('AOC-CR-287-2025-12.pdf','https://www.nccourts.gov/assets/documents/forms/cr287_5.pdf?VersionId=i8vcDwdQdPLKFLV9zLnYz8xmj2zMLajv','a876229328f9ee8325890b597633b661711fe606da1be8ddb573cd50791365ed'),
            ('AOC-CR-287-instructions-2025-12.pdf','https://www.nccourts.gov/assets/documents/forms/cr287-instr_3.pdf?VersionId=KdBrjd7dOC8zgSkKoCyOfwRvHvg93ilX','fe22270401aa22ee5c801871aeb1c00f3b98cfb6867f7155681bab4af9c990d7'),
            ('AOC-CV-226-2023-04.pdf','https://www.nccourts.gov/assets/documents/forms/cv226_1.pdf?VersionId=fyKKNw_0bAqHtDZYoFe.WzU5Ya1oDibo','74057a13e4bccccbbac785c845b4996b322c6219e1c45f1ab42dca2377755a8f')]
          receipts=[]
          for name,url,expected in rows:
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'LegalEase source verification'}),timeout=60) as response:
              data=response.read();final=response.url;status=response.status
            actual=hashlib.sha256(data).hexdigest()
            assert data.startswith(b'%PDF-') and actual==expected,(name,actual,expected)
            (out/name).write_bytes(data)
            receipts.append({'file':name,'url':url,'finalUrl':final,'status':status,'sha256':actual,'byteLength':len(data),'matchesPinnedHash':True,'retrievedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()})
          (out/'source-receipts.json').write_text(json.dumps({'runId':os.environ['GITHUB_RUN_ID'],'sources':receipts,'grantsApproval':False},indent=2)+'\n')
          print('All three exact official NC source hashes matched.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcap-completion-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/completion-inputs/
          retention-days: 3
          if-no-files-found: error
