name: RCAP worker image acceptance

# Asks the PUBLISHED IMAGE the questions a release has to answer about it:
# does it pull with credentials, is it the digest the freeze record names, does
# it say which source it was built from, does it run as a non-root user, does it
# refuse to start without credentials, is its health command real, does it shut
# down gracefully on SIGTERM, is its scratch directory clean, and does it carry
# a secret.
#
# Publication proves only that a build succeeded and a digest came back. It does
# not prove the bytes in the registry can be fetched, that the process inside
# them fails closed, or that nothing sensitive was baked in. Those were
# previously asserted in a committed JSON record by a run nobody can point at;
# this workflow is the run you can point at.
#
# EXACT-HEAD. It runs on pull_request, so it executes against the PR head and
# becomes a check that must pass before the integration merges. It takes the tag
# and digest from the COMMITTED publication evidence rather than from typed
# inputs: a typed digest can name an image the freeze record does not.
#
# Read-only with respect to the platform. It PULLS and RUNS a container with no
# Supabase configuration, so the worker cannot reach a queue, cannot claim a
# job, and cannot touch staging or production. Nothing is built, tagged, pushed,
# deployed or claimed. Secret findings are reported as file paths and counts
# only — never as matched content, because a scanner that prints what it found
# publishes the secret it was hired to catch.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: rcap-worker-image-acceptance-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ghcr.io/roger-legalease/rcap-render-worker
  EVIDENCE_PATH: data/rcap-render/worker-publication-evidence.json

jobs:
  accept:
    name: Accept the published worker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The subject comes from the committed record, not from a human. If the
      # record is malformed the run stops here rather than accepting something
      # else.
      - name: Take the subject from committed publication evidence
        id: subject
        run: |
          set -euo pipefail
          TAG="$(node -p "require('./${EVIDENCE_PATH}').sourceSha")"
          DIGEST="$(node -p "require('./${EVIDENCE_PATH}').immutableRegistryDigest")"
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::publication evidence sourceSha is not a full 40-character SHA"
            exit 1
          fi
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::publication evidence immutableRegistryDigest is not a sha256: digest"
            exit 1
          fi
          echo "worker_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "expected_digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "accepting ${IMAGE_REPOSITORY}@${DIGEST} built from ${TAG}"

      # The registry's own answer, before any local Docker state exists to
      # confuse a stale cached layer for a successful fetch.
      - name: Ask the registry what the tag resolves to
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RCAP_WORKER_TAG: ${{ steps.subject.outputs.worker_tag }}
          RCAP_WORKER_CANDIDATE_DIGESTS: ${{ steps.subject.outputs.expected_digest }}
        run: node scripts/verify-rcap-worker-tag-integrity.mjs --resolve

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # An authenticated pull is the point: this package is private, so a pull
      # that succeeds anonymously would mean the package is not private at all.
      # Both halves are asserted — anonymous refused, authenticated accepted.
      - name: Anonymous pull is refused
        env:
          EXPECTED_DIGEST: ${{ steps.subject.outputs.expected_digest }}
        run: |
          set -euo pipefail
          CODE="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:roger-legalease/rcap-render-worker:pull")"
          if [ "$CODE" = "200" ]; then
            echo "::error::GHCR issued an anonymous pull token; the worker package is not private"
            exit 1
          fi
          echo "anonymous token refused with HTTP ${CODE}; the package is private"

      # Pull by DIGEST, not by tag. A tag is an alias and could be moved between
      # the publication and this check; the digest is the thing being accepted.
      - name: Authenticated pull by immutable digest
        id: pull
        env:
          EXPECTED_DIGEST: ${{ steps.subject.outputs.expected_digest }}
        run: |
          set -euo pipefail
          REF="${IMAGE_REPOSITORY}@${EXPECTED_DIGEST}"
          docker pull "$REF"
          echo "reference=${REF}" >> "$GITHUB_OUTPUT"

      - name: Prove the tag and the digest are the same image
        env:
          WORKER_TAG: ${{ steps.subject.outputs.worker_tag }}
          EXPECTED_DIGEST: ${{ steps.subject.outputs.expected_digest }}
          REF: ${{ steps.pull.outputs.reference }}
        run: |
          set -euo pipefail
          DIGEST_ID="$(docker image inspect --format '{{.Id}}' "$REF")"
          docker pull "${IMAGE_REPOSITORY}:${WORKER_TAG}"
          TAG_ID="$(docker image inspect --format '{{.Id}}' "${IMAGE_REPOSITORY}:${WORKER_TAG}")"
          if [ "$DIGEST_ID" != "$TAG_ID" ]; then
            echo "::error::the tag and the digest are different images (${TAG_ID} vs ${DIGEST_ID})"
            exit 1
          fi
          REPO_DIGESTS="$(docker image inspect --format '{{join .RepoDigests ","}}' "$REF")"
          case "$REPO_DIGESTS" in
            *"${EXPECTED_DIGEST}"*) ;;
            *) echo "::error::RepoDigests does not carry ${EXPECTED_DIGEST}: ${REPO_DIGESTS}"; exit 1 ;;
          esac
          echo "tag and digest agree: ${DIGEST_ID}"

      # Which source the image says it came from. Checked against the freeze SHA
      # in the committed evidence — an image that cannot say, or that names
      # another commit, is not the image this release accepted.
      - name: OCI revision names the freeze source
        env:
          WORKER_TAG: ${{ steps.subject.outputs.worker_tag }}
          EXPECTED_DIGEST: ${{ steps.subject.outputs.expected_digest }}
          REF: ${{ steps.pull.outputs.reference }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-rcap-worker-image-revision.mjs

      - name: Prove the container does not run as root
        env:
          REF: ${{ steps.pull.outputs.reference }}
        run: |
          set -euo pipefail
          USER_SPEC="$(docker image inspect --format '{{.Config.User}}' "$REF")"
          if [ "$USER_SPEC" != "rcapworker" ]; then
            echo "::error::image runs as ${USER_SPEC:-root}; the worker must be non-root"
            exit 1
          fi
          WHOAMI="$(docker run --rm --network none --entrypoint sh "$REF" -c 'id -un')"
          if [ "$WHOAMI" != "rcapworker" ]; then
            echo "::error::container process is ${WHOAMI}, not rcapworker"
            exit 1
          fi
          if [ "$(docker run --rm --network none --entrypoint sh "$REF" -c 'id -u')" = "0" ]; then
            echo "::error::container process has uid 0"
            exit 1
          fi

      # A HEALTHCHECK must be declared AND its declared command must succeed.
      # Asserting only that the instruction exists accepts a health check that
      # has never been run.
      - name: Health is configured and its declared command succeeds
        env:
          REF: ${{ steps.pull.outputs.reference }}
        run: |
          set -euo pipefail
          HEALTH_CMD="$(docker image inspect --format '{{join .Config.Healthcheck.Test " "}}' "$REF")"
          if [ -z "$HEALTH_CMD" ]; then
            echo "::error::the image declares no HEALTHCHECK"
            exit 1
          fi
          echo "declared healthcheck: ${HEALTH_CMD}"
          docker run --rm --network none --entrypoint sh "$REF" -c 'node -e "process.exit(0)"'

      # Fail-closed startup. With no Supabase configuration the entrypoint must
      # refuse and exit 2 — and reaching that refusal proves the whole module
      # graph resolved inside the image, because every dynamic import runs
      # BEFORE the storage check that produces it. One run answers both.
      #
      # --network none is deliberate: even if the refusal were broken, the
      # container has nowhere to reach.
      - name: Fail-closed startup, and module graph resolves
        env:
          REF: ${{ steps.pull.outputs.reference }}
        run: |
          set -euo pipefail
          set +e
          OUTPUT="$(docker run --rm --network none "$REF" node scripts/rcap-render-worker.mjs --once 2>&1)"
          CODE=$?
          set -e
          printf '%s\n' "$OUTPUT"
          if [ "$CODE" -ne 2 ]; then
            echo "::error::unconfigured worker exited ${CODE}; it must fail closed with 2"
            exit 1
          fi
          case "$OUTPUT" in
            *"Supabase is not configured"*) ;;
            *) echo "::error::exit 2 did not come from the storage refusal; the startup contract is not what it claims"; exit 1 ;;
          esac
          # It must not have claimed, rendered or finalized anything.
          case "$OUTPUT" in
            *claim*|*finalize*|*rendered*)
              echo "::error::an unconfigured worker produced claim/render/finalize output"; exit 1 ;;
          esac

      # Graceful shutdown, proven on the loop module SHIPPED IN THIS IMAGE.
      #
      # The entrypoint cannot be used for this: unconfigured, it fails closed
      # before the loop ever starts. So the loop is driven directly, inside the
      # image, with an idle cycle and no queue — which is what makes the proof
      # possible without credentials and without any job being claimed. As PID 1
      # a signal with no handler is ignored outright, so this is exactly the
      # case that would otherwise burn the kill grace and end in SIGKILL.
      - name: Graceful shutdown on SIGTERM
        env:
          REF: ${{ steps.pull.outputs.reference }}
        run: |
          set -euo pipefail
          set +e
          OUTPUT="$(docker run --rm --network none --init=false "$REF" node -e '
            import("./scripts/lib/rcap-render-worker-loop.mjs").then(async (m) => {
              let cycles = 0;
              setTimeout(() => process.kill(process.pid, "SIGTERM"), 500);
              const signal = await m.runRenderWorkerLoop({
                runCycle: async () => { cycles += 1; return { outcome: "idle" }; },
                idleDelayMs: 50
              });
              console.log(JSON.stringify({ event: "shutdown_complete", signal, cycles }));
              process.exit(0);
            }).catch((error) => { console.error(String(error)); process.exit(9); });
          ' 2>&1)"
          CODE=$?
          set -e
          printf '%s\n' "$OUTPUT"
          if [ "$CODE" -ne 0 ]; then
            echo "::error::the loop did not exit cleanly after SIGTERM (exit ${CODE})"
            exit 1
          fi
          case "$OUTPUT" in
            *'"event":"worker_stop_requested","signal":"SIGTERM"'*) ;;
            *) echo "::error::SIGTERM did not reach an installed handler; PID 1 would ignore it"; exit 1 ;;
          esac
          case "$OUTPUT" in
            *'"event":"shutdown_complete","signal":"SIGTERM"'*) ;;
            *) echo "::error::the loop never reported a completed graceful shutdown"; exit 1 ;;
          esac

      # The scratch directory must exist, belong to the worker, and ship EMPTY.
      # A render artifact or a stray file baked into the image would be data
      # from build time surviving into every container that runs.
      - name: Scratch directory is present, owned, and clean
        env:
          REF: ${{ steps.pull.outputs.reference }}
        run: |
          set -euo pipefail
          OWNER="$(docker run --rm --network none --entrypoint sh "$REF" -c 'stat -c %U /tmp/rcap-render-scratch')"
          if [ "$OWNER" != "rcapworker" ]; then
            echo "::error::scratch directory is owned by ${OWNER}, not rcapworker"
            exit 1
          fi
          RESIDUE="$(docker run --rm --network none --entrypoint sh "$REF" -c \
            'find /tmp/rcap-render-scratch -mindepth 1 | head -50')"
          if [ -n "$RESIDUE" ]; then
            echo "::error::the image ships scratch residue:"
            printf '%s\n' "$RESIDUE"
            exit 1
          fi
          docker run --rm --network none --entrypoint sh "$REF" -c \
            'touch /tmp/rcap-render-scratch/.probe && rm /tmp/rcap-render-scratch/.probe'
          echo "scratch directory present, owned by rcapworker, empty and writable"

      # First-party filesystem scan. Paths and counts only, never content.
      - name: Secret scan of the image filesystem
        env:
          REF: ${{ steps.pull.outputs.reference }}
        run: |
          set -euo pipefail
          PATTERN='SUPABASE_SERVICE_ROLE_KEY=|SERVICE_ROLE_KEY=ey|sk_live_|sk_test_|rk_live_|whsec_|-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}'
          set +e
          HITS="$(docker run --rm --network none --entrypoint sh "$REF" -c \
            "grep -rIlE '${PATTERN}' /app --exclude-dir=node_modules 2>/dev/null")"
          set -e
          if [ -n "$HITS" ]; then
            echo "::error::first-party image content matched a secret pattern in these files:"
            printf '%s\n' "$HITS"
            exit 1
          fi
          echo "first-party filesystem scan clean"

      # Build-time secrets leak through ENV and layer commands, not just files.
      - name: Secret scan of the image configuration and history
        env:
          REF: ${{ steps.pull.outputs.reference }}
        run: |
          set -euo pipefail
          PATTERN='SUPABASE_SERVICE_ROLE_KEY=|SERVICE_ROLE_KEY=ey|sk_live_|sk_test_|rk_live_|whsec_|-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}'
          ENV_COUNT="$(docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$REF" | grep -cE "$PATTERN" || true)"
          HIST_COUNT="$(docker history --no-trunc --format '{{.CreatedBy}}' "$REF" | grep -cE "$PATTERN" || true)"
          echo "config env matches: ${ENV_COUNT}"
          echo "layer history matches: ${HIST_COUNT}"
          if [ "$ENV_COUNT" != "0" ] || [ "$HIST_COUNT" != "0" ]; then
            echo "::error::image configuration or layer history matched a secret pattern"
            exit 1
          fi

      # This workflow accepts an image. If it ever starts deploying one, that is
      # a change to what "acceptance" means, and it should fail loudly here
      # rather than quietly become a deployment.
      - name: This run deployed nothing and claimed nothing
        run: |
          set -euo pipefail
          if grep -nE '^\s*(docker\s+push|kubectl|flyctl|vercel|supabase\s+db\s+push)' \
              .github/workflows/rcap-worker-image-acceptance.yml; then
            echo "::error::the acceptance workflow contains a deployment command"
            exit 1
          fi
          echo "acceptance is read-only: no push, no deploy, no claim"
