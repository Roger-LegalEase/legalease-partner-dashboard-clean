name: RCAP single corrected-header Fly identity GET
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/rcap-worker-identity-readonly.mjs
            /scripts/rcap-worker-identity-get-once.mjs
      - name: One read-only corrected-header GET
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: node scripts/rcap-worker-identity-get-once.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rcap-worker-get-once-${{ github.run_id }}
          path: worker-identity-evidence/get-result.json
          if-no-files-found: error
