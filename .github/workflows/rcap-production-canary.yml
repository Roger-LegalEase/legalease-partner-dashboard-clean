name: RCAP controlled Production canary

# Release-captain-only control. The preflight leaves the restored Vercel
# environment entry untouched. It proves Supabase identity from one exact
# Production-target staged deployment and the accepted Preview runtime. When
# no exact staged candidate exists, --prod --skip-domain creates one without
# moving a public alias.
on:
  workflow_call:
    inputs:
      phase:
        description: "preflight, clinic_migrate, forward_chain_readback, forward_chain_migrate, legal_aid_readback, legal_aid_migrate, smoke, or activate"
        required: true
        type: string
      application_sha:
        required: true
        type: string
      worker_source_sha:
        required: true
        type: string
      worker_digest:
        required: true
        type: string
      tools_sha:
        description: "Tools-only execution commit descended from the accepted hosted tools SHA"
        required: true
        type: string
    secrets:
      VERCEL_TOKEN:
        required: true
      SUPABASE_ACCESS_TOKEN:
        required: true
      VERCEL_AUTOMATION_BYPASS_SECRET:
        required: true

permissions:
  contents: read
  packages: read
  actions: read

env:
  APPLICATION_SHA: 8517a9b0ecf107605fe3094f23175d6a344f0244
  ACCEPTED_TOOLS_SHA: 8517a9b0ecf107605fe3094f23175d6a344f0244
  WORKER_SOURCE_SHA: 8517a9b0ecf107605fe3094f23175d6a344f0244
  WORKER_DIGEST: sha256:c3a8d59c3c96b675a1e3dcc9cc35df08a5e5a4b5bdb635cf7f5e97137b97a534
  IMAGE_REPOSITORY: ghcr.io/roger-legalease/rcap-render-worker
  CANONICAL_INTEGRATION_BRANCH: claude/legalease-sprint-captain-utucnw

jobs:
  preflight:
    name: Exact Production release phase
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Refuse any release identity outside the frozen authorization
        env:
          INPUT_PHASE: ${{ inputs.phase }}
          INPUT_APPLICATION_SHA: ${{ inputs.application_sha }}
          INPUT_WORKER_SOURCE_SHA: ${{ inputs.worker_source_sha }}
          INPUT_WORKER_DIGEST: ${{ inputs.worker_digest }}
          INPUT_TOOLS_SHA: ${{ inputs.tools_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$INPUT_PHASE" in preflight|clinic_migrate|forward_chain_readback|forward_chain_migrate|legal_aid_readback|legal_aid_migrate|smoke|activate) ;; *) echo "::error::unsupported Production phase"; exit 1 ;; esac
          [ "$INPUT_APPLICATION_SHA" = "$APPLICATION_SHA" ] || { echo "::error::application SHA mismatch"; exit 1; }
          [ "$INPUT_WORKER_SOURCE_SHA" = "$WORKER_SOURCE_SHA" ] || { echo "::error::worker source SHA mismatch"; exit 1; }
          [ "$INPUT_WORKER_DIGEST" = "$WORKER_DIGEST" ] || { echo "::error::worker digest mismatch"; exit 1; }
          [ "$INPUT_TOOLS_SHA" = "$WORKFLOW_SHA" ] || { echo "::error::tools SHA must equal the workflow source SHA"; exit 1; }
          printf '%s' "$INPUT_TOOLS_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::tools SHA must be full"; exit 1; }

      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the exact frozen identity and image-input equivalence
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CANONICAL_INTEGRATION_BRANCH"
          for SHA in "$APPLICATION_SHA" "$ACCEPTED_TOOLS_SHA" "${{ inputs.tools_sha }}"; do
            git cat-file -e "${SHA}^{commit}" || { echo "::error::$SHA does not resolve"; exit 1; }
            git merge-base --is-ancestor "$SHA" "origin/$CANONICAL_INTEGRATION_BRANCH" || { echo "::error::$SHA is outside canonical history"; exit 1; }
          done
          git merge-base --is-ancestor "$APPLICATION_SHA" "$ACCEPTED_TOOLS_SHA" || { echo "::error::accepted tools do not descend from the application"; exit 1; }
          git merge-base --is-ancestor "$ACCEPTED_TOOLS_SHA" "${{ inputs.tools_sha }}" || { echo "::error::execution tools do not descend from accepted hosted tools"; exit 1; }
          git diff --quiet "$APPLICATION_SHA" "${{ inputs.tools_sha }}" -- src package.json package-lock.json tsconfig.json next.config.ts postcss.config.mjs tailwind.config.ts public docs/record-clearing/field-map-drafts \
            || { echo "::error::execution tools differ from the frozen application"; exit 1; }
          git diff --quiet "$WORKER_SOURCE_SHA" "${{ inputs.tools_sha }}" -- package.json package-lock.json tsconfig.json scripts/rcap-render-worker.mjs deploy/rcap-render-worker/Dockerfile scripts/lib src \
            || { echo "::error::execution tools differ from immutable worker inputs"; exit 1; }
          git checkout --detach "${{ inputs.tools_sha }}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify the Production control contract
        run: node scripts/verify-rcap-production-canary.mjs

      - name: Verify the exact Production Clinic migration contract
        if: inputs.phase == 'clinic_migrate'
        run: |
          node scripts/verify-rcap-production-clinic-migrate.mjs
          node scripts/test-rcap-production-clinic-migrate-mutations.mjs

      - name: Verify the exact Production forward-chain migration contract
        if: inputs.phase == 'forward_chain_readback' || inputs.phase == 'forward_chain_migrate'
        env:
          # The verifier needs the phase to know whether an apply-authorization
          # record is required yet. It is required for every value except the
          # exact read-only phase, so passing the raw input cannot weaken it:
          # anything unexpected here demands the record.
          RCAP_PRODUCTION_PHASE: ${{ inputs.phase }}
        run: |
          node scripts/verify-rcap-production-forward-chain-migrate.mjs
          # Deliberately unset for the mutation proof: it must exercise the
          # authorization-required path regardless of which phase is running.
          RCAP_PRODUCTION_PHASE= node scripts/test-rcap-production-forward-chain-migrate-mutations.mjs

      - name: Verify the exact Production Legal Aid migration contract
        if: inputs.phase == 'legal_aid_readback' || inputs.phase == 'legal_aid_migrate'
        run: |
          node scripts/verify-rcap-production-legal-aid-migrate.mjs
          node scripts/test-rcap-production-legal-aid-migrate-mutations.mjs
          # The PGlite readback self-test needs node_modules, which this
          # Supabase-only step runs before installing (run 35120655761 stopped
          # on ERR_MODULE_NOT_FOUND). It runs in the local test chain; the two
          # dependency-free proofs above stay blocking here.

      - name: Install frozen dependencies for the exact-SHA Colorado smoke
        if: inputs.phase == 'smoke'
        run: npm ci

      - name: Verify the bounded Production canary smoke contract
        if: inputs.phase == 'smoke'
        run: |
          node scripts/verify-rcap-production-smoke.mjs
          node scripts/test-rcap-production-smoke-mutations.mjs

      - name: Verify the exact Production activation contract
        if: inputs.phase == 'activate'
        run: |
          node scripts/verify-rcap-production-activation.mjs
          node scripts/test-rcap-production-activation-mutations.mjs

      - name: Pull and identify the accepted worker by immutable digest
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          REF="$IMAGE_REPOSITORY@$WORKER_DIGEST"
          docker pull "$REF" >/dev/null
          ACTUAL="$(docker inspect --format='{{index .RepoDigests 0}}' "$REF" | sed 's/.*@//')"
          REVISION="$(docker inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' "$REF")"
          [ "$ACTUAL" = "$WORKER_DIGEST" ] || { echo "::error::worker digest readback mismatch"; exit 1; }
          [ "$REVISION" = "$WORKER_SOURCE_SHA" ] || { echo "::error::worker OCI revision mismatch"; exit 1; }
          echo "Accepted worker pulled by digest; OCI revision matches the frozen worker source."

      - name: Discover and record Production identity and rollback
        if: inputs.phase == 'preflight'
        env:
          RCAP_PRODUCTION_PHASE: "preflight"
          RCAP_APPLICATION_SHA: ${{ inputs.application_sha }}
          RCAP_ACCEPTED_TOOLS_SHA: ${{ env.ACCEPTED_TOOLS_SHA }}
          RCAP_TOOLS_SHA: ${{ inputs.tools_sha }}
          RCAP_WORKER_SOURCE_SHA: ${{ inputs.worker_source_sha }}
          RCAP_WORKER_DIGEST: ${{ inputs.worker_digest }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/rcap-production-canary.mjs

      - name: Apply and directly read back the exact Production Clinic sequence
        if: inputs.phase == 'clinic_migrate'
        env:
          RCAP_PRODUCTION_PHASE: "clinic_migrate"
          RCAP_APPLICATION_SHA: ${{ inputs.application_sha }}
          RCAP_PRODUCTION_PROJECT_REF: wwtwtsmywnckfkdaqqeg
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/rcap-production-clinic-migrate.mjs

      - name: Read back the Production forward migration chain without writing
        if: inputs.phase == 'forward_chain_readback'
        env:
          RCAP_PRODUCTION_PHASE: "forward_chain_readback"
          RCAP_APPLICATION_SHA: ${{ inputs.application_sha }}
          RCAP_PRODUCTION_PROJECT_REF: wwtwtsmywnckfkdaqqeg
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/rcap-production-forward-chain-migrate.mjs

      - name: Apply and directly read back the exact Production forward migration chain
        if: inputs.phase == 'forward_chain_migrate'
        env:
          RCAP_PRODUCTION_PHASE: "forward_chain_migrate"
          RCAP_APPLICATION_SHA: ${{ inputs.application_sha }}
          RCAP_PRODUCTION_PROJECT_REF: wwtwtsmywnckfkdaqqeg
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/rcap-production-forward-chain-migrate.mjs

      - name: Read back the Production Legal Aid prerequisites and state without writing
        if: inputs.phase == 'legal_aid_readback'
        env:
          RCAP_PRODUCTION_PHASE: "legal_aid_readback"
          RCAP_APPLICATION_SHA: ${{ inputs.application_sha }}
          RCAP_PRODUCTION_PROJECT_REF: wwtwtsmywnckfkdaqqeg
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/rcap-production-legal-aid-migrate.mjs

      - name: Apply and directly read back the exact Production Legal Aid migration
        if: inputs.phase == 'legal_aid_migrate'
        env:
          RCAP_PRODUCTION_PHASE: "legal_aid_migrate"
          RCAP_APPLICATION_SHA: ${{ inputs.application_sha }}
          RCAP_PRODUCTION_PROJECT_REF: wwtwtsmywnckfkdaqqeg
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/rcap-production-legal-aid-migrate.mjs

      - name: Run the bounded no-alias Production canary smoke
        if: inputs.phase == 'smoke'
        env:
          RCAP_PRODUCTION_PHASE: "smoke"
          RCAP_APPLICATION_SHA: ${{ inputs.application_sha }}
          RCAP_WORKER_SOURCE_SHA: ${{ inputs.worker_source_sha }}
          RCAP_WORKER_DIGEST: ${{ inputs.worker_digest }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/rcap-production-canary-smoke.mjs

      - name: Download the exact successful Production smoke evidence
        if: inputs.phase == 'activate'
        uses: actions/download-artifact@v4
        with:
          name: rcap-production-smoke-35278012687
          path: prior-production-smoke-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35278012687

      - name: Activate the exact staged Production deployment with rollback protection
        if: inputs.phase == 'activate'
        env:
          RCAP_PRODUCTION_PHASE: "activate"
          RCAP_APPLICATION_SHA: ${{ inputs.application_sha }}
          RCAP_WORKER_SOURCE_SHA: ${{ inputs.worker_source_sha }}
          RCAP_WORKER_DIGEST: ${{ inputs.worker_digest }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/rcap-production-activate.mjs

      - name: Upload the immutable Production preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcap-production-${{ inputs.phase }}-${{ github.run_id }}
          path: production-canary-evidence/
          if-no-files-found: error
