name: Dispatch 3c799 ten-family raster once

on:
  push:
    branches:
      - chatgpt/dispatch-3c799-raster-20260911
    paths:
      - .github/workflows/dispatch-3c799-ten-family-raster-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch pinned ten-family raster
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          payload='{"ref":"claude/legalease-sprint-captain-utucnw","inputs":{"commit_sha":"3c799170ea5f0bdf4bdc75338b5defb364cec9b1","raster_manifest_path":"data/rcap-grade-a/packet-factory-24h/checkpoint-232-to-250/source-restored-ten-family-raster-manifest-20260911.json"}}'
          code="$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/rcap-packet-raster-acceptance-batch.yml/dispatches" \
            -d "$payload")"
          if [ "$code" != "204" ]; then
            echo "workflow dispatch failed with HTTP $code"
            cat /tmp/dispatch-response.txt
            exit 1
          fi
          echo "workflow dispatch accepted (HTTP 204)"
