name: RCAP factory completion validation
on:
  push:
    branches: [chatgpt/launch-recovery-20260906]
    paths:
      - .github/workflows/rcap-factory-audit-repair.yml
      - scripts/grade-a-packet-factory-24h/**
      - scripts/rcap-corpus/**
      - data/rcap-grade-a/source-custody/generator-preflight-20261013/**
      - scripts/lib/corpus-index-paths.mjs
      - data/rcap-grade-a/legal-decisions/SC_GUIDANCE_RUNTIME_SUCCESSOR_2026-10-13.json
  pull_request:
    paths:
      - .github/workflows/rcap-factory-audit-repair.yml
      - scripts/grade-a-packet-factory-24h/**
      - scripts/rcap-corpus/**
      - data/rcap-grade-a/source-custody/generator-preflight-20261013/**
      - scripts/lib/corpus-index-paths.mjs
      - data/rcap-grade-a/legal-decisions/SC_GUIDANCE_RUNTIME_SUCCESSOR_2026-10-13.json
      - data/rcap-grade-a/packet-factory-24h/**
permissions:
  contents: read
concurrency:
  group: rcap-factory-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      FACTORY_APPLICATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked parsers without rebuilding any packet
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils cabextract
      - name: Establish verified corpus environment
        id: corpus_environment
        env:
          GH_TOKEN: ${{ secrets.SOURCE_CORPUS_READ_TOKEN }}
        run: |
          set -euo pipefail
          corpus="$GITHUB_WORKSPACE/private/source-imports/Expungement_AI_RCAP_Master_Library_Edition_1"
          if [ ! -d "$corpus" ]; then
            test -n "$GH_TOKEN" || { echo "CORPUS_ENVIRONMENT_REFUSED: SOURCE_CORPUS_READ_TOKEN must read the pinned private source-artifacts release"; exit 1; }
            bash scripts/rcap-corpus/bootstrap-private-corpus.sh
          fi
          export MASTER_LIBRARY_SOURCE_DIR="$corpus"
          export RCAP_BUNDLE_EXTRACT="$corpus"
          node --input-type=module -e 'import { requireMasterLibraryEnvironment } from "./scripts/lib/corpus-index-paths.mjs"; requireMasterLibraryEnvironment({repoRoot:process.cwd()});'
          printf 'MASTER_LIBRARY_SOURCE_DIR=%s\nRCAP_BUNDLE_EXTRACT=%s\n' "$corpus" "$corpus" >> "$GITHUB_ENV"
      - name: Adopted-source restoration guard regressions
        id: adoption_controls
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/rcap-corpus/test-restore-adopted-sources.py
      - name: Restore exact adopted source bytes
        id: adopted_sources
        env:
          GH_TOKEN: ${{ secrets.SOURCE_CORPUS_READ_TOKEN }}
          SOURCE_ADOPTION_BUNDLE_REPOSITORY: ${{ vars.SOURCE_ADOPTION_BUNDLE_REPOSITORY }}
          SOURCE_ADOPTION_BUNDLE_RELEASE_TAG: ${{ vars.SOURCE_ADOPTION_BUNDLE_RELEASE_TAG }}
        run: |
          set -euo pipefail
          python3 scripts/rcap-corpus/restore-adopted-sources.py
          node --input-type=module -e 'import { loadUserSourceAdoption, AZ_ATTACHMENT_ADOPTION_PATH } from "./scripts/grade-a-packet-factory-24h/user-source-adoption.mjs"; loadUserSourceAdoption(process.cwd()); loadUserSourceAdoption(process.cwd(), {recordPath: AZ_ATTACHMENT_ADOPTION_PATH});'
      - name: South Carolina source restoration guard regressions
        id: sc_source_controls
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/rcap-corpus/test-sc-guidance-sources.py
      - name: Restore South Carolina guidance private sources
        id: sc_sources
        run: python3 scripts/rcap-corpus/restore-sc-guidance-sources.py
      - name: South Carolina runtime successor guards
        id: sc_runtime_controls
        run: node scripts/grade-a-packet-factory-24h/test-sc-runtime-successor.mjs --current
      - name: Replay all ten South Carolina guidance routes
        run: node scripts/grade-a-packet-factory-24h/review-sc-runtime-binding.mjs
      - name: Restore exact Ohio Arial from original package
        id: oh_font
        run: python3 scripts/rcap-corpus/restore-oh-exact-font.py
      - name: Ohio font restoration guard regressions
        id: oh_font_controls
        run: python3 scripts/rcap-corpus/test-oh-exact-font.py
      - name: Verify new acceptance-cycle dispatch regression guards
        run: node --test scripts/grade-a-packet-factory-24h/verification-cycle.test.mjs
      - name: Generator source preflight guard regressions
        id: generator_source_controls
        run: |
          python3 scripts/rcap-corpus/test-generator-sources.py
          node --test scripts/rcap-corpus/test-generator-source-corroboration.mjs scripts/rcap-corpus/test-generated-successor.mjs
      - name: Restore and preflight complete generator source inventory
        id: generator_sources
        run: python3 scripts/rcap-corpus/restore-generator-sources.py --report "$RUNNER_TEMP/generator-source-preflight/report.json"
      - name: Check committed generator convergence
        id: convergence
        env:
          GENERATOR_SOURCE_AUDIT_DIR: ${{ runner.temp }}/generator-source-preflight/reads
          FACTORY_CANDIDATE_DIR: ${{ runner.temp }}/factory-convergence-candidate
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/factory-validation"
          mkdir -p "$out"
          test "$(git rev-parse HEAD)" = "$FACTORY_APPLICATION_SHA"
          git status --porcelain > "$out/pre-convergence-worktree.txt"
          test ! -s "$out/pre-convergence-worktree.txt" || { cat "$out/pre-convergence-worktree.txt"; exit 1; }
          node scripts/rcap-corpus/check-generator-convergence.mjs
      - name: Check bounded source, repair and coverage contracts
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/factory-validation"
          node scripts/grade-a-packet-factory-24h/test-source-readiness-constraints.mjs --generated | tee "$out/source-controls.log"
          node scripts/grade-a-packet-factory-24h/test-conditional-raster-documents.mjs --generated | tee "$out/conditional-controls.log"
          node scripts/grade-a-packet-factory-24h/test-bounded-repair-authorization.mjs | tee "$out/bounded-repair-controls.log"
          node scripts/grade-a-packet-factory-24h/test-post-repair-reread.mjs | tee "$out/reread-controls.log"
      - name: Execute every normal and mutation suite and prove restoration
        run: |
          python3 - <<'PY'
          import subprocess,pathlib,os,json,re,collections,datetime,hashlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'factory-validation';results=[]
          def fingerprint():
              diff=subprocess.check_output(['git','diff','--binary'])
              status=subprocess.check_output(['git','status','--porcelain','-z'])
              return hashlib.sha256(diff+b'\0'+status).hexdigest()
          for script in ['verify','verify-source-conveyor','verify-acq-promo-handoff','verify-lane-contracts','verify-source-relationship-model']:
              for mutation in [False,True]:
                  name=script+('-mutations' if mutation else '')
                  cmd=['node',f'scripts/grade-a-packet-factory-24h/{script}.mjs']+(['--mutations'] if mutation else [])
                  before=fingerprint()
                  with (out/f'{name}.log').open('w') as log:
                      try:code=subprocess.run(cmd,stdout=log,stderr=subprocess.STDOUT,timeout=540).returncode
                      except subprocess.TimeoutExpired:code=124
                  restored=fingerprint()==before
                  results.append({'command':cmd,'exitCode':code,'status':'PASS' if code==0 else 'FAIL','worktreeRestored':restored})
                  print(name,code,restored,flush=True)
                  if not restored:break
              if not restored:break
          master=json.loads(pathlib.Path('data/rcap-grade-a/packet-factory-24h/MASTER_QUEUE.json').read_text())
          terminal={'COMPLETE_PACKET_PROVEN','GUIDANCE_READY','HANDOFF_READY','OUT_OF_SCOPE'}
          log=out/'verify-mutations.log';text=log.read_text() if log.exists() else ''
          clean=subprocess.check_output(['git','status','--porcelain'])==b''
          report={'runId':os.environ['GITHUB_RUN_ID'],'checkedCommit':os.environ['FACTORY_APPLICATION_SHA'],'recordedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'results':results,'states':dict(collections.Counter(f['state'] for f in master['families'])),'terminalFamilies':sum(f['state'] in terminal for f in master['families']),'denominator':len(master['families']),'completeFactoryMutationSuite':'every mutated file restored byte-for-byte: true' in text and not re.search(r'\b(MISSED|OVER-CAUGHT|UNPROVABLE)\b',text),'negativeCasesCaught':len(re.findall(r'^  detected',text,re.M)),'positiveCasesPassed':len(re.findall(r'^  stayed green',text,re.M)),'cleanWorktree':clean,'packetRebuilds':0,'branchWrites':0,'newApprovals':0,'productionTouched':False}
          (out/'results.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          assert len(results)==10 and all(r['status']=='PASS' and r['worktreeRestored'] for r in results),'A validation suite failed'
          assert report['completeFactoryMutationSuite'],'Incomplete mutation coverage'
          assert clean,'Validation changed the checkout'
          PY
      - name: Capture complete generated successor after failed convergence
        if: failure() && steps.convergence.outcome == 'failure'
        env:
          GENERATOR_SOURCE_AUDIT_DIR: ${{ runner.temp }}/generator-source-preflight/reads
          GENERATED_SUCCESSOR_DIR: ${{ runner.temp }}/factory-generated-successor
        run: node scripts/rcap-corpus/capture-generated-successor.mjs
      - name: Preserve complete generated successor for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-generated-successor-${{ github.run_id }}
          path: ${{ runner.temp }}/factory-generated-successor/
          retention-days: 14
          if-no-files-found: ignore
      - name: Preserve divergent factory metadata for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-convergence-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/factory-convergence-candidate/
          retention-days: 14
          if-no-files-found: ignore
      - name: Preserve generator source preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generator-source-preflight-${{ github.job }}-${{ github.run_id }}
          path: ${{ runner.temp }}/generator-source-preflight/
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-completion-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/factory-validation/
          retention-days: 14
          if-no-files-found: error
