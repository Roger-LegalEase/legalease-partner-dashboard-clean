name: RCAP factory audit repair
on:
  push:
    branches: [chatgpt/launch-recovery-20260906]
    paths: [.github/workflows/rcap-factory-audit-repair.yml]
permissions:
  contents: read
concurrency:
  group: rcap-factory-audit-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      OUT: data/rcap-grade-a/completion-pass-2026-09-07/factory-validation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply only the checksum-bound corrections
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/chatgpt/launch-recovery-20260906
          mkdir -p "$OUT"
          python3 - <<'PY'
          import pathlib,hashlib,subprocess
          base=pathlib.Path('data/rcap-grade-a/completion-pass-2026-09-07')
          for name,sha in [('factory-corrections.patch','bd756ca06d2ed3a8cd801c4626f03f71e8287d5971ffd311bd104c5f6c4c3f20'),('factory-f32-control.patch','f3d9e3bd845dbcd5830b4db7f018c052b5be8732ac10e81e6049761f33a3237d')]:
            p=base/name
            assert hashlib.sha256(p.read_bytes()).hexdigest()==sha,name+' transfer changed'
            subprocess.run(['git','apply','--check',str(p)],check=True)
            subprocess.run(['git','apply',str(p)],check=True)
          expected={'generate.mjs':'55108d7f13d57ba29ff878dae5058c4b49156017b24d623a4245e32a6411c7c9','verify.mjs':'8920a8b89c41f128ea34a3b3a666fd95121fc74cb6e7c0b1d13c12c659a83a7b'}
          for name,sha in expected.items():
            assert hashlib.sha256((pathlib.Path('scripts/grade-a-packet-factory-24h')/name).read_bytes()).hexdigest()==sha,name
          print('Both code changes match the locally tested exact bytes.')
          PY
          node --check scripts/grade-a-packet-factory-24h/generate.mjs
          node --check scripts/grade-a-packet-factory-24h/verify.mjs
          node scripts/grade-a-packet-factory-24h/test-source-readiness-constraints.mjs | tee "$OUT/source-controls.log"
      - name: Regenerate complete state without changing packet bytes or legal decisions
        run: |
          set -euo pipefail
          for pass in 1 2; do
            for script in generate generate-source-conveyor generate-washington-repair generate-source-relationship-registry generate-raster-queue; do
              node "scripts/grade-a-packet-factory-24h/$script.mjs" > "$OUT/$script-$pass.log" 2>&1 || { tail -60 "$OUT/$script-$pass.log"; exit 1; }
            done
          done
          for script in generate generate-source-conveyor generate-washington-repair generate-source-relationship-registry; do
            node "scripts/grade-a-packet-factory-24h/$script.mjs" --check > "$OUT/$script-check.log" 2>&1 || { tail -60 "$OUT/$script-check.log"; exit 1; }
          done
          node scripts/grade-a-packet-factory-24h/test-source-readiness-constraints.mjs --generated | tee "$OUT/generated-source-controls.log"
      - name: Measure the whole factory and mutation suites with full Git history
        run: |
          python3 - <<'PY'
          import subprocess,pathlib,os,json,re,collections,datetime
          out=pathlib.Path(os.environ['OUT']);results=[]
          scripts=['verify','verify-source-conveyor','verify-acq-promo-handoff','verify-lane-contracts','verify-source-relationship-model']
          for script in scripts:
            for mutation in [False,True]:
              name=script+('-mutations' if mutation else '')
              cmd=['node',f'scripts/grade-a-packet-factory-24h/{script}.mjs']+(['--mutations'] if mutation else [])
              with (out/f'{name}.log').open('w') as log:
                try:code=subprocess.run(cmd,stdout=log,stderr=subprocess.STDOUT,timeout=540).returncode
                except subprocess.TimeoutExpired:code=124
              results.append({'command':cmd,'exitCode':code,'status':'PASS' if code==0 else 'FAIL'})
              print(name,code,flush=True)
          master=json.loads(pathlib.Path('data/rcap-grade-a/packet-factory-24h/MASTER_QUEUE.json').read_text())
          terminal={'COMPLETE_PACKET_PROVEN','GUIDANCE_READY','HANDOFF_READY','OUT_OF_SCOPE'}
          report={'runId':os.environ['GITHUB_RUN_ID'],'checkedSourceCommit':os.environ['GITHUB_SHA'],'recordedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'results':results,'states':dict(collections.Counter(f['state'] for f in master['families'])),'terminalFamilies':sum(f['state'] in terminal for f in master['families']),'denominator':len(master['families']),'newSemanticApprovals':0,'productionTouched':False,'commercialRoutesOpened':0}
          (out/'results.json').write_text(json.dumps(report,indent=2)+'\n')
          # Do not waive the remaining WY legal/repair-claim conflict. These
          # checks require the corrected checks themselves to pass, not an
          # invented all-green factory verdict.
          baseline=(out/'verify.log').read_text()
          for check in ['F24','F29','F20']:
            assert re.search(r'\bok\s+'+check+r'\s',baseline),check+' remains broken'
          remaining=set(re.findall(r'FAIL\s+(F\d+)\s',baseline))
          assert remaining <= {'F26'},'Unexpected remaining factory failure: '+repr(remaining)
          mutations=(out/'verify-mutations.log').read_text()
          assert 'every mutated file restored byte-for-byte: true' in mutations,'Mutation harness did not finish safely'
          assert not re.search(r'\b(MISSED|OVER-CAUGHT)\b',mutations),'A control was missed or over-caught'
          assert all(x['status']=='PASS' for x in results if x['command'][1].endswith('verify-source-relationship-model.mjs')),'Source relationship checks did not pass'
          assert report['terminalFamilies']==177,'This non-packet correction must preserve the measured terminal set'
          print(json.dumps(report,indent=2))
          PY
      - name: Publish scoped tested code and generated state to recovery only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,os,pathlib
          exact={'scripts/grade-a-packet-factory-24h/generate.mjs','scripts/grade-a-packet-factory-24h/verify.mjs'}
          prefixes=['data/rcap-grade-a/packet-factory-24h/','docs/rcap/grade-a/packet-factory-24h/',os.environ['OUT']+'/']
          changed=set(subprocess.check_output(['git','diff','--name-only']).decode().splitlines())|set(subprocess.check_output(['git','ls-files','--others','--exclude-standard']).decode().splitlines())
          bad=[p for p in changed if p not in exact and not any(p.startswith(x) for x in prefixes)]
          assert not bad,bad
          for p in sorted(changed):subprocess.run(['git','add','--',p],check=True)
          PY
          git diff --cached --check
          git diff --cached --binary > "$RUNNER_TEMP/factory-candidate.patch"
          test "$(git ls-remote origin refs/heads/chatgpt/launch-recovery-20260906 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'LegalEase completion (ChatGPT)'
          git config user.email 'noreply@legalease.com'
          git commit -m 'fix(rcap): reconcile real repair assignments and preserve source identity holds'
          git push origin HEAD:refs/heads/chatgpt/launch-recovery-20260906
          git rev-parse HEAD > "$RUNNER_TEMP/factory-published-sha.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-audit-repair-${{ github.run_id }}
          path: |
            data/rcap-grade-a/completion-pass-2026-09-07/factory-validation/
            ${{ runner.temp }}/factory-candidate.patch
            ${{ runner.temp }}/factory-published-sha.txt
          retention-days: 14
          if-no-files-found: error
