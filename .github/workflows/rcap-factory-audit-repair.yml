name: RCAP factory audit repair
on:
  push:
    branches: [chatgpt/launch-recovery-20260906]
    paths: [.github/workflows/rcap-factory-audit-repair.yml]
permissions:
  contents: read
concurrency:
  group: rcap-completion-publication
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.publish.outputs.candidate }}
    env:
      OUT: data/rcap-grade-a/completion-pass-2026-09-07/factory-validation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked parsers without rebuilding a packet
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Consume the existing corrections and finish their measured defects
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/chatgpt/launch-recovery-20260906
          mkdir -p "$OUT"
          cp data/rcap-grade-a/packet-factory-24h/MASTER_QUEUE.json "$RUNNER_TEMP/before-master.json"
          python3 - <<'PY'
          import pathlib,hashlib,subprocess
          base=pathlib.Path('data/rcap-grade-a/completion-pass-2026-09-07')
          for name,sha in [('factory-corrections.patch','bd756ca06d2ed3a8cd801c4626f03f71e8287d5971ffd311bd104c5f6c4c3f20'),('factory-f32-control.patch','f3d9e3bd845dbcd5830b4db7f018c052b5be8732ac10e81e6049761f33a3237d'),('factory-source-wait.patch','eb4dbae21fdea1efc6c206ecfb590ca8c68bd834ab751afad26ca1becccfb365')]:
            p=base/name;assert hashlib.sha256(p.read_bytes()).hexdigest()==sha,name
            subprocess.run(['git','apply','--check',str(p)],check=True)
            subprocess.run(['git','apply',str(p)],check=True)
          target='scripts/grade-a-packet-factory-24h/generate-raster-queue.mjs'
          assert subprocess.check_output(['git','hash-object',target]).decode().strip()=='8c78377dfce25c96512f721993e4b67d723eae1c'
          p=base/'conditional-raster.patch'
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply',str(p)],check=True)
          assert subprocess.check_output(['git','hash-object',target]).decode().strip()=='f07fbccf66c348f3fd1ffd0cdae4ea1104c16c5a'
          PY
          python3 scripts/rcap-packet-recovery/finish-factory-consumption.py | tee "$OUT/consumption.log"
          node scripts/grade-a-packet-factory-24h/test-bounded-repair-authorization.mjs | tee "$OUT/bounded-repair-controls.log"
          node scripts/grade-a-packet-factory-24h/test-source-readiness-constraints.mjs | tee "$OUT/source-controls.log"
          node scripts/grade-a-packet-factory-24h/test-conditional-raster-documents.mjs | tee "$OUT/conditional-controls.log"
      - name: Regenerate and prove selected-document coverage and source-wait projection
        run: |
          set -euo pipefail
          for pass in 1 2; do
            for script in generate generate-source-conveyor generate-washington-repair generate-source-relationship-registry generate-raster-queue; do
              node "scripts/grade-a-packet-factory-24h/$script.mjs" > "$OUT/$script-$pass.log" 2>&1 || { tail -60 "$OUT/$script-$pass.log"; exit 1; }
            done
          done
          for script in generate generate-source-conveyor generate-washington-repair generate-source-relationship-registry; do
            node "scripts/grade-a-packet-factory-24h/$script.mjs" --check > "$OUT/$script-check.log" 2>&1 || { tail -60 "$OUT/$script-check.log"; exit 1; }
          done
          node scripts/grade-a-packet-factory-24h/test-source-readiness-constraints.mjs --generated | tee "$OUT/generated-source-controls.log"
          node scripts/grade-a-packet-factory-24h/test-conditional-raster-documents.mjs --generated | tee "$OUT/generated-conditional-controls.log"
          node scripts/grade-a-packet-factory-24h/test-bounded-repair-authorization.mjs | tee "$OUT/generated-bounded-controls.log"
          node scripts/grade-a-packet-factory-24h/test-post-repair-reread.mjs | tee "$OUT/isolated-reread-controls.log"
      - name: Execute full factory and mutation checks with restoration proof
        run: |
          python3 - <<'PY'
          import subprocess,pathlib,os,json,re,collections,datetime,hashlib
          out=pathlib.Path(os.environ['OUT']);results=[]
          fingerprint=lambda:hashlib.sha256(subprocess.check_output(['git','diff','--binary'])).hexdigest()
          for script in ['verify','verify-source-conveyor','verify-acq-promo-handoff','verify-lane-contracts','verify-source-relationship-model']:
            for mutation in [False,True]:
              name=script+('-mutations' if mutation else '')
              cmd=['node',f'scripts/grade-a-packet-factory-24h/{script}.mjs']+(['--mutations'] if mutation else [])
              before=fingerprint()
              with (out/f'{name}.log').open('w') as log:
                try:code=subprocess.run(cmd,stdout=log,stderr=subprocess.STDOUT,timeout=540).returncode
                except subprocess.TimeoutExpired:code=124
              restored=fingerprint()==before
              results.append({'command':cmd,'exitCode':code,'status':'PASS' if code==0 else 'FAIL','trackedWorktreeRestored':restored})
              print(name,code,restored,flush=True)
              if not restored:break
            if not restored:break
          master=json.loads(pathlib.Path('data/rcap-grade-a/packet-factory-24h/MASTER_QUEUE.json').read_text())
          prior=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'before-master.json').read_text())
          terminal={'COMPLETE_PACKET_PROVEN','GUIDANCE_READY','HANDOFF_READY','OUT_OF_SCOPE'}
          ids=lambda m:sorted(f['familyId'] for f in m['families'] if f['state'] in terminal)
          mutations=(out/'verify-mutations.log').read_text() if (out/'verify-mutations.log').exists() else ''
          report={'runId':os.environ['GITHUB_RUN_ID'],'checkedSourceCommit':os.environ['GITHUB_SHA'],'recordedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'results':results,'states':dict(collections.Counter(f['state'] for f in master['families'])),'terminalFamilies':len(ids(master)),'denominator':len(master['families']),'terminalSetPreserved':ids(master)==ids(prior),'newSemanticApprovals':0,'productionTouched':False,'commercialRoutesOpened':0,'packetRebuildsThisRun':0,'ncRasterRequiredDocuments':10,'ncRasterRequiredPages':60,'completeFactoryMutationSuite':'every mutated file restored byte-for-byte: true' in mutations and not re.search(r'\b(MISSED|OVER-CAUGHT|UNPROVABLE)\b',mutations)}
          (out/'results.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          assert len(results)==10 and all(r['status']=='PASS' and r['trackedWorktreeRestored'] for r in results),'A full validation failed; no publication'
          assert report['completeFactoryMutationSuite'],'Incomplete mutation coverage'
          assert report['terminalSetPreserved'],'Non-packet correction changed the proven family set'
          PY
      - name: Publish only validated non-packet changes to the existing recovery branch
        id: publish
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,os
          exact={'scripts/grade-a-packet-factory-24h/generate.mjs','scripts/grade-a-packet-factory-24h/verify.mjs','scripts/grade-a-packet-factory-24h/generate-raster-queue.mjs'}
          prefixes=['data/rcap-grade-a/packet-factory-24h/','docs/rcap/grade-a/packet-factory-24h/',os.environ['OUT']+'/']
          changed=set(subprocess.check_output(['git','diff','--name-only']).decode().splitlines())|set(subprocess.check_output(['git','ls-files','--others','--exclude-standard']).decode().splitlines())
          bad=[p for p in changed if p not in exact and not any(p.startswith(x) for x in prefixes)];assert not bad,bad
          for p in sorted(changed):subprocess.run(['git','add','--',p],check=True)
          PY
          git diff --cached --check
          git diff --cached --binary > "$RUNNER_TEMP/factory-candidate.patch"
          test "$(git ls-remote origin refs/heads/chatgpt/launch-recovery-20260906 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'LegalEase completion (ChatGPT)'
          git config user.email 'noreply@legalease.com'
          git commit -m 'fix(rcap): consume validated factory corrections and all selectable NC raster inputs'
          git push origin HEAD:refs/heads/chatgpt/launch-recovery-20260906
          sha=$(git rev-parse HEAD);echo "$sha" > "$RUNNER_TEMP/factory-published-sha.txt";echo "candidate=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-audit-repair-${{ github.run_id }}
          path: |
            data/rcap-grade-a/completion-pass-2026-09-07/factory-validation/
            ${{ runner.temp }}/factory-candidate.patch
            ${{ runner.temp }}/factory-published-sha.txt
          retention-days: 14
          if-no-files-found: error
  nc_raster:
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/github-script@v7
        env:
          CANDIDATE: ${{ needs.repair.outputs.candidate }}
        with:
          script: |
            const candidate=process.env.CANDIDATE;
            if(!/^[a-f0-9]{40}$/.test(candidate)) throw new Error('Missing published candidate');
            await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'rcap-packet-raster-acceptance-batch.yml',ref:'main',inputs:{commit_sha:candidate,raster_manifest_path:'data/rcap-grade-a/packet-factory-24h/RASTER_QUEUE.json',family_batch:'nc_146_dismissal_petition-set',requested_scale:'2.5'}});
            core.info(`Ten existing NC packet variants queued for immutable ${candidate}; no packet was rebuilt and dispatch is not a raster pass.`);
